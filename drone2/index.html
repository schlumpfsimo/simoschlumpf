const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
function hash2(x, y){
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct = 4){ let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++){ s += a * vnoise(x * f + i * 17.3, y * f - i * 9.1); f *= 2.03; a *= 0.5; } return s / (1 - Math.pow(0.5, oct)); }
function ridged(x, y, oct = 5){ let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++){ const n = 1 - Math.abs(vnoise(x * f + i * 31.7, y * f + i * 7.7) * 2 - 1); s += a * n * n; f *= 2.07; a *= 0.5; } return s; }
function rng(seed){ return () => { seed = (seed + 0x6D2B79F5) | 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const pairs = f => { const o = []; for (let i = 0; i < f.length; i += 2) o.push([f[i], f[i + 1]]); return o; };

// ================================================================ scene, light, sky
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(new THREE.Color(0.7, 0.75, 0.8), 0.0005);
const camera = new THREE.PerspectiveCamera(90, W / H, 0.1, 30000);

const rt = new THREE.WebGLRenderTarget(RW, RH, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
const hemi = new THREE.HemisphereLight(0xffffff, 0x555555, 1);
const sun = new THREE.DirectionalLight(0xffffff, 1);
scene.add(hemi, sun);
const U_TIME = { value: 0 };
const skyU = { uZen: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uSun: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Color() }, uHaze: { value: 0 }, uTime: U_TIME };
const sky = new THREE.Mesh(new THREE.SphereGeometry(20000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform vec3 uZen, uHor, uSun, uSunCol; uniform float uHaze, uTime; varying vec3 vDir;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + 1.0), f.x), f.y); }
    void main(){
      vec3 d = normalize(vDir);
      float e = max(d.y, 0.0);
      vec3 c = mix(uHor, uZen, pow(e, 0.55));
      float s = max(dot(d, normalize(uSun)), 0.0);
      c += uSunCol * (pow(s, 600.0) * 2.5 * (1.0 - uHaze * 0.75) + pow(s, 9.0) * 0.25);
      // clouds, or smoke in a war sky
      vec2 p = d.xz / (d.y + 0.12) * 1.6 + vec2(uTime * 0.004, 0.0);
      float cl = n(p) * 0.5 + n(p * 2.1) * 0.3 + n(p * 4.3) * 0.2;
      cl = smoothstep(0.52 - uHaze * 0.25, 0.85, cl) * smoothstep(0.0, 0.25, d.y);
      c = mix(c, mix(vec3(0.95), uHor * 0.55, uHaze), cl * (0.55 + uHaze * 0.35));
      if (d.y < 0.0) c = uHor;
      gl_FragColor = vec4(c, 1.0);
    }`
}));
sky.renderOrder = -1; sky.frustumCulled = false;

}

// ================================================================ facade skins: eight bays of Basel facades, painted once into a texture atlas
// One tile = one window bay (3.1 m) by one storey (3.25 m); the top row is the ground floor, the bottom row the upper floors.
// Alpha 0 marks glass: the shader draws its own panes there (and the fire behind them).
// 0 neutral plaster (tinted by the vertex colour), 1 old town beige with red sandstone surrounds and green shutters,
// 2 light grey with grey shutters, 3 red sandstone ashlar, 4 pale yellow with dark shutters, 5 ochre Gründerzeit with pediments,
// 6 post-war concrete with wide windows, 7 pink plaster with brown shutters
const FACADE_TEX = (() => {
  const T = 256, NX = 8, c = document.createElement('canvas'); c.width = T * NX; c.height = T * 2;
  const g = c.getContext('2d'), m = document.createElement('canvas'); m.width = c.width; m.height = c.height;
  const gm = m.getContext('2d'); gm.fillStyle = '#fff'; gm.fillRect(0, 0, m.width, m.height); gm.fillStyle = '#000';
  const R = rng(77);
  const STY = [
    { wall: '#d9d9d6', frame: '#f2f1ec', sur: null, shut: null, shop: false },
    { wall: '#d8c6a2', frame: '#efe9dc', sur: '#a86a55', shut: '#3f5a3a', shop: true },
    { wall: '#e2e0da', frame: '#f6f5f1', sur: '#bdb9b0', shut: '#6b6f70', shop: false, rust: true },
    { wall: '#b06a55', frame: '#e6ddd0', sur: '#8d4c3c', shut: null, shop: false, ashlar: true, arch: true },
    { wall: '#e3d29b', frame: '#f4efe2', sur: '#f0eadb', shut: '#2f3d33', shop: true },
    { wall: '#cfb48a', frame: '#efe7d6', sur: '#b29a74', shut: null, shop: false, ped: true, rust: true, rustCol: '#9a8a76' },
    { wall: '#bdbab2', frame: '#6d6f70', sur: null, shut: null, shop: true, wide: true },
    { wall: '#d9b2a2', frame: '#f4efe8', sur: '#e8ddd2', shut: '#6a4a36', shop: false },
  ];
  const rect = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const glass = (x, y, w, h) => { gm.fillRect(x, y, w, h); };
  STY.forEach((s, i) => {
    for (const row of [0, 1]){
      const x0 = i * T, y0 = row * T, ground = row === 0;
      // plaster with grain and weather streaks
      rect(x0, y0, T, T, s.wall);
      for (let k = 0; k < 700; k++){ const a = R() * 0.07; g.fillStyle = R() < 0.5 ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a})`; g.fillRect(x0 + R() * T, y0 + R() * T, 1 + R() * 3, 1 + R() * 3); }

function setWar(v){

  setAtmosphere(v ? w.atmos.war : w.atmos.peace);
  SMOKE.mat.uniforms.uTint.value.setRGB(...(v ? [0.2, 0.18, 0.17] : [0.5, 0.5, 0.5]));
  SMOKE.mat.uniforms.uLit.value.setRGB(...(v ? [0.55, 0.47, 0.4] : [0.8, 0.8, 0.8]));
  if (!v){ SMOKE.P.fill(0); FIRE.P.fill(0); }

  if (state === 'fly' && !P.alive) return;
  if (state === 'fly' && (P.pos.y < w.obst.at(P.pos.x, P.pos.z) || inSlab(P.pos.x, P.pos.y, P.pos.z))){ P.pos.y = w.obst.at(P.pos.x, P.pos.z) + 3; P.vel.set(0, 0, 0); }

// run the smoke for a while so the columns stand when the war view appears

async function startWorld(i, mode = 'explore'){

    console.error(err);
    state = 'menu'; openMain(); msg = say(S.loadFail); msgT = 5; return;
  }
  world.def = def;
  post.uniforms.uGrade.value = world.grade ?? 1;
  aaGuns.length = 0;
  if (world.aaSpots) for (const [x, z] of world.aaSpots) aaGuns.push(makeAA(x, z));
  for (const p of world.pois){ p.y = world.groundAt(p.x, p.z); p.visited = false; p.beacon = makeBeacon(p.x, p.y, p.z); world.root.add(p.beacon); }

  setWar(world.hasWar);
  state = 'fly'; paused = false; hintT = 14; clock = 0;

    for (const p of world.pois) p.beacon.visible = false;

}

// ================================================================ ambience
let ambT = 0, boomT = 8;
function updateAudio(dt){
  if (!AU.ready) return;
  const flying = state === 'fly' && !paused;
  const tf = clamp(P.T / MAXT, 0, 1), on = flying && P.alive && P.armed;
  const f = 110 + 620 * Math.sqrt(tf) + P.vel.length() * 0.8;
  for (const { o, mult } of AU.pOsc) setP(o.frequency, f * mult, 0.03);
  setP(AU.pGain.gain, on ? 0.035 + 0.12 * tf : 0, 0.03);
  setP(AU.pLp.frequency, 800 + 3000 * tf);
  setP(AU.wind.gain, flying && P.alive ? Math.min(0.25, P.vel.length() / 90 * 0.25) : 0);
  const fx = state === 'fly' ? (P.alive ? noise * 0.04 : 0.07) : 0.02;
  setP(AU.hiss.gain, fx);
  if (!flying || !world){ for (const n of [AU.rumble, AU.crackle, AU.water, AU.city]) setP(n.gain, 0, 0.3); sirenStop(); return; }
  const war = world.war, agl = P.pos.y - world.groundAt(P.pos.x, P.pos.z), low = clamp(1 - agl / 250, 0.15, 1);
  // nearest fire
  let fd = 1e9; if (war) for (const e of emitters) if (e.kind === 'fire'){ const d = Math.hypot(e.x - P.pos.x, e.y - P.pos.y, e.z - P.pos.z); if (d < fd) fd = d; }
  setP(AU.crackle.gain, war ? clamp(1 - fd / 120, 0, 1) * 0.12 : 0, 0.2);
  setP(AU.rumble.gain, war ? 0.18 * low + 0.05 : 0, 0.5);
  setP(AU.city.gain, world.id === 'basel' && !war ? 0.06 * low : 0, 0.5);
  let wd = 1e9; if (world.riverZ) wd = Math.hypot(Math.abs(P.pos.z - world.riverZ(P.pos.x)), agl);
  setP(AU.water.gain, world.id === 'valley' ? clamp(1 - wd / 160, 0, 1) * 0.09 : 0, 0.3);
  ambT -= dt;
  if (ambT <= 0){
    if (world.id === 'valley' || !war){ ambT = 0.4 + Math.random() * 2.5; if (agl < 200) chirp(); }
    else ambT = 1;
    if (world.id === 'valley' && world.cows){ let cd = 1e9; for (const c of world.cows) cd = Math.min(cd, Math.hypot(c[0] - P.pos.x, c[1] - P.pos.y, c[2] - P.pos.z)); if (cd < 260 && Math.random() < 0.7) bell(700 + Math.random() * 300, 0.03 * (1 - cd / 260), 0.9); }
    if (world.id === 'basel' && !war && Math.random() < 0.04) bell(392, 0.04, 4);
  }
  // the war goes on: distant impacts, now and then a siren in Basel
  if (war){

  const hb = new GB(512), tb = new GB(256), bb = new GB(128), OL = [0.3, 0.32, 0.26], DK = [0.14, 0.14, 0.13];
  hb.box(0, 1.0, 0, 3.2, 1.1, 6.6, 0, OL); for (const sd of [-1, 1]) hb.box(sd * 1.5, 0.5, 0, 0.5, 0.9, 6.8, 0, DK);
  tb.box(0, 0.5, 0, 2.4, 1.0, 2.4, 0, OL); tb.box(0, 1.5, -0.8, 1.2, 0.9, 0.12, 0, DK);
  bb.box(-0.55, 0, 1.6, 0.13, 0.13, 3.2, 0, DK); bb.box(0.55, 0, 1.6, 0.13, 0.13, 3.2, 0, DK);
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  grp.add(hb.mesh(mat)); tur.add(tb.mesh(mat)); gun.add(bb.mesh(mat));
  gun.position.set(0, 0.8, 0.5); tur.add(gun); tur.position.set(0, 1.55, 0); grp.add(tur);
  grp.position.set(x, y, z); grp.rotation.y = rr(0, 6.28);
  world.gWar.add(grp);
  world.obstWar.circle(x, z, 4, y + 3.5);
  return { grp, tur, gun, pos: new THREE.Vector3(x, y + 2.6, z), cd: rr(0, 2), burst: 0, acc: 0, n: 0, target: null, err: new THREE.Vector3(), muzzle: new THREE.Vector3() };
}
function updateAA(dt){
  for (const a of aaGuns){
    if (!a.target || a.target.state === 'down' || !a.target.grp.parent || a.target.pos.distanceTo(a.pos) > 1900){
      a.target = null; let bd = 1900;
      for (const b of bandits) if (b.state !== 'down'){ const d = b.pos.distanceTo(a.pos); if (d < bd){ bd = d; a.target = b; } }
    }
    const t = a.target;
    if (!t){ a.burst = 0; continue; }
    const d = t.pos.distanceTo(a.pos), tof = d / 1000;
    const aim = _w.copy(t.pos).addScaledVector(t.vel, tof).add(a.err); aim.y += 0.5 * G * tof * tof;
    a.grp.updateMatrixWorld(true);
    const local = a.grp.worldToLocal(_v.copy(aim));
    let dy = Math.atan2(local.x, local.z) - a.tur.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    a.tur.rotation.y += clamp(dy, -1.6 * dt, 1.6 * dt);
    const pitch = Math.atan2(local.y - 2.4, Math.hypot(local.x, local.z));
    a.gun.rotation.x += clamp(-pitch - a.gun.rotation.x, -1.2 * dt, 1.2 * dt);
    a.cd -= dt;
    if (a.cd <= 0 && a.burst <= 0 && Math.abs(dy) < 0.15){ a.burst = rr(1, 2.4); a.err.set(gauss(), gauss(), gauss()).multiplyScalar(d * rr(0.012, 0.035)); }
    if (a.burst > 0){
      a.burst -= dt; a.acc += dt * 14;
      while (a.acc >= 1){
        a.acc -= 1; a.n++;
        a.gun.localToWorld(a.muzzle.set(a.n % 2 ? -0.55 : 0.55, 0, 3.3));
        fireRound(a.muzzle, _w, 1000, a.n % 2 === 0, 'aa');
        if (a.n % 2) gunShot(a.muzzle, false);
      }
      emit(FIRE, a.muzzle.x, a.muzzle.y, a.muzzle.z, 0, 0, 0, 0.06, 2.2, 1, 1, 0);
      if (a.burst <= 0) a.cd = rr(1.2, 3);
    }
  }
}
// the war goes on around the pilot when exploring: drones over the town, air defence firing, impacts
let warT = 12;
function updateWarLife(dt){
  if (GAME.mode !== 'defend'){
    if (world.war && world.ambientTarget){
      warT -= dt;
      if (warT <= 0){ warT = rr(14, 30); const n = Math.random() < 0.25 ? 3 : 1; for (let k = 0; k < n; k++) bandits.push(new Bandit(pickR(['geran', 'geran', 'lancet', 'molniya']), world.ambientTarget())); }
      for (const b of [...bandits]) b.update(dt);
    } else if (bandits.length) for (const b of [...bandits]) b.remove();
    updateRounds(dt); updateFlying(dt);
  }
  if (world.war && aaGuns.length) updateAA(dt);
}

// ---------------------------------------------------------------- the interceptor: it detonates on contact
function detonate(){
  if (!P.alive) return;
  const pos = P.pos.clone();
  explosion(pos, 0.8);
  for (const b of [...bandits]) if (b.state !== 'down' && b.pos.distanceTo(pos) < 14){ GAME.stopped++; b.shootDown(); explosion(b.pos.clone(), b.type === 'geran' ? 1.6 : 0.9); confirm(b.name); }
  for (const v of vehicles) if (v.alive && v.pos.distanceTo(pos) < v.t.r + 3){ v.kill(); confirm(say(DT.vnames[v.type])); }
  P.alive = false; P.armed = false; P.deadAt = clock; P.deadWhy = 'boom'; GAME.used++;
  staticAmt = 1;
}
function confirm(what){ GAME.hitMsg = 3; GAME.hitWhat = what + ' · ' + say(DT.stopped); beep(440, 0.25); }
function interceptCheck(p0){
  if (!P.alive || !P.armed) return;
  for (const b of bandits){
    if (b.state === 'down') continue;
    const rel = _v.copy(b.prev).sub(p0), dr = _w.copy(b.pos).sub(b.prev).sub(_rd.copy(P.pos).sub(p0));
    const t = clamp(-rel.dot(dr) / Math.max(1e-6, dr.lengthSq()), 0, 1);
    if (rel.addScaledVector(dr, t).length() < 3.2){ detonate(); return; }
  }
  for (const v of vehicles) if (v.alive && v.s >= 0 && v.pos.distanceTo(P.pos) < v.t.r){ detonate(); return; }
}

// ---------------------------------------------------------------- the round: threats arrive over time
function resetDefense(){
  for (const b of [...bandits]) b.remove();
  for (const v of vehicles) v.remove(); vehicles.length = 0;
  for (const f of flying) scene.remove(f.o); flying.length = 0; rounds.length = 0;
  clearDamage();
  Object.assign(GAME, { t: 0, stopped: 0, leaks: 0, used: 0, homeHits: 0, ended: false, endT: 0, endWhy: '', hitMsg: 0, next: { recon: 8, strike: 25, column: [60, 185], moto: [115, 235] } });
}
function spawnColumn(){
  const path = pickR(world.routes);
  const types = ['tank', pickR(['bmp', 'tank']), 'bmp']; if (rnd() < 0.4) types.push('bmp');
  const speed = clamp(path.len / 170, 7, 14), s0 = 0;
  types.forEach((t, k) => vehicles.push(new Vehicle(t, path, s0 - k * 28, speed)));
}
function spawnMotos(){
  const path = pickR(world.motoRoutes || world.routes), n = 4 + Math.floor(rnd() * 3), s0 = 0, sp = clamp(path.len / 95, 12, 24);
  for (let k = 0; k < n; k++) vehicles.push(new Vehicle('moto', path, s0 - k * 9, sp, (k % 2 ? 1 : -1) * 2.5));
}
function updateDefense(dt){
  if (GAME.ended){ GAME.endT += dt; return; }
  GAME.t += dt;
  const T = GAME.t, N = GAME.next;
  if (T > N.recon){ bandits.push(new Bandit(rnd() < 0.5 ? 'orlan' : 'zala')); N.recon = T + rr(60, 80); }
  if (T > N.strike){
    const swarm = T > 100 && rnd() < 0.3 ? 2 + Math.floor(rnd() * 3) : 1;
    for (let k = 0; k < swarm; k++){ const r = rnd(); bandits.push(new Bandit(swarm > 1 || r < 0.5 ? 'geran' : r < 0.75 ? 'molniya' : 'lancet')); }
    N.strike = T + lerp(22, 9, T / ROUND) * rr(0.7, 1.3);
  }
  if (N.column.length && T > N.column[0]){ N.column.shift(); spawnColumn(); }
  if (N.moto.length && T > N.moto[0]){ N.moto.shift(); spawnMotos(); }
  for (const b of [...bandits]) b.update(dt);
  for (const v of vehicles) v.update(dt);
  updateRounds(dt); updateFlying(dt);
  GAME.hitMsg = Math.max(0, GAME.hitMsg - dt);
  if (GAME.homeHits >= 6) endRound('home');
  else if (T >= ROUND) endRound('time');
}
function endRound(why){
  if (GAME.ended) return;
  GAME.ended = true; GAME.endWhy = why; GAME.endT = 0;
  if (!P.alive) respawnStart();
  P.armed = false; staticAmt = 0;
}

// ================================================================ main loop
let noise = 0;
function update(dt){
  clock += dt; U_TIME.value += dt;
  msgT = Math.max(0, msgT - dt);
  if (state !== 'fly') return;
  hintT = Math.max(0, hintT - dt);
  const p0 = P.pos.clone();
  if (!GAME.ended) updateDrone(dt); else { camera.position.copy(P.pos); camera.updateMatrixWorld(); }
  if (GAME.mode === 'defend'){ if (card) card.t += dt; interceptCheck(p0); if (!(card && card.intro)) updateDefense(dt); }
  else updatePois(dt);
  updateWarLife(dt);
  flashI *= Math.exp(-dt * 9); flashLight.intensity = flashI;
  updateEmitters(dt, camera.position);
  stepParticles(SMOKE, dt, false); stepParticles(FIRE, dt, true);
  updateFireLights(dt);
  if (GAME.mode !== 'defend') for (const p of world.pois) if (p.beacon.visible){ const d = Math.hypot(p.x - P.pos.x, p.z - P.pos.z); p.beacon.scale.set(1 + d / 250, 1, 1 + d / 250); }
  const r = Math.hypot(P.pos.x - world.center[0], P.pos.z - world.center[1]);
  noise = clamp((r - world.R) / 600, 0, 1);
  sky.position.copy(camera.position);
}
let staticAmt = 0;
function render(){
  post.uniforms.uTime.value = (performance.now() / 1000) % 600;
  post.uniforms.uNoise.value = noise;
  if (state === 'fly') staticAmt = P.alive ? Math.max(0, staticAmt - 0.06) : 1; else staticAmt = 0.55;
  post.uniforms.uStatic.value = staticAmt;
  post.uniforms.uBlack.value = state === 'fly' ? 0 : 0.6;
  post.uniforms.uDim.value = menu && menu.kind === 'pause' ? 1 : GAME.mode === 'defend' && GAME.ended ? clamp(GAME.endT / 2, 0, 1.4) : card ? 0.25 : 0;
  const inVR = renderer.xr.isPresenting, t = performance.now();
  if (!inVR || t - lastFeed > 1000 / 30){
    lastFeed = t;
    drawOSD(); drawUI();
    OSD.t.needsUpdate = true; UI.t.needsUpdate = true;
    const xrTarget = renderer.getRenderTarget();
    renderer.xr.enabled = false;
    renderer.setRenderTarget(rt);
    if (state === 'fly') renderer.render(scene, camera); else renderer.clear();
    renderer.setRenderTarget(inVR ? feedRT : null);
    renderer.render(postScene, postCam);
    renderer.xr.enabled = true;
    renderer.setRenderTarget(xrTarget);
  }
  if (inVR) renderer.render(vrScene, vrCam);
}

// ================================================================ Meta Quest: a head-locked goggle screen
let lastFeed = 0;
const feedRT = new THREE.WebGLRenderTarget(OW, OH, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
const vrScene = new THREE.Scene(); vrScene.background = new THREE.Color(0);

const GOGGLE_SCALES = [1.8, 2.34, 1.36];
let goggleSize = 0;

  vertexShader: `uniform float uScale; varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * vec4(position.xy * uScale, -1.5, 1.0); }`,
  fragmentShader: `uniform sampler2D map; varying vec2 vUv; void main(){ gl_FragColor = texture2D(map, vUv); }`

goggle.frustumCulled = false; vrScene.add(goggle);
function cycleGoggle(){
  if (!renderer.xr.isPresenting) return;
  goggleSize = (goggleSize + 1) % GOGGLE_SCALES.length;
  goggle.material.uniforms.uScale.value = GOGGLE_SCALES[goggleSize];
  try { localStorage.setItem('dronesim-vr-size', goggleSize); } catch (e) {}
}
if (navigator.xr) navigator.xr.isSessionSupported('immersive-vr').then(ok => {
  if (!ok) return;
  const b = document.createElement('button');
  b.textContent = 'ENTER VR';
  b.style.cssText = 'position:absolute;right:16px;bottom:16px;z-index:4;padding:8px 14px;font:bold 14px monospace;color:#f4f2ec;background:rgba(0,0,0,0.6);border:2px solid #f4f2ec;cursor:pointer';

function frame(now){

  readPads();

openMain();
const autoMap = WORLDS.findIndex(w => w.id === QS.get('map'));

renderer.setAnimationLoop(frame);
