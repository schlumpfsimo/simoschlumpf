const PI = Math.PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
function hash2(x, y){
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct = 4){ let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++){ s += a * vnoise(x * f + i * 17.3, y * f - i * 9.1); f *= 2.03; a *= 0.5; } return s / (1 - Math.pow(0.5, oct)); }
function ridged(x, y, oct = 5){ let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++){ const n = 1 - Math.abs(vnoise(x * f + i * 31.7, y * f + i * 7.7) * 2 - 1); s += a * n * n; f *= 2.07; a *= 0.5; } return s; }
function rng(seed){ return () => { seed = (seed + 0x6D2B79F5) | 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const pairs = f => { const o = []; for (let i = 0; i < f.length; i += 2) o.push([f[i], f[i + 1]]); return o; };
const _v = new THREE.Vector3(), _w = new THREE.Vector3(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _m4 = new THREE.Matrix4();

// ================================================================ scene, light, sky
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(new THREE.Color(0.7, 0.75, 0.8), 0.0005);
const camera = new THREE.PerspectiveCamera(104, W / H, 0.1, 30000);   // a wide FPV lens; the fisheye bend comes in the post
scene.add(camera);
const rt = new THREE.WebGLRenderTarget(RW, RH, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
const hemi = new THREE.HemisphereLight(0xffffff, 0x555555, 1);
const sun = new THREE.DirectionalLight(0xffffff, 1);
scene.add(hemi, sun);
const U_TIME = { value: 0 };
const skyU = { uZen: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uSun: { value: new THREE.Vector3(0, 1, 0) }, uSunCol: { value: new THREE.Color() }, uHaze: { value: 0 }, uTime: U_TIME };
const sky = new THREE.Mesh(new THREE.SphereGeometry(20000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform vec3 uZen, uHor, uSun, uSunCol; uniform float uHaze, uTime; varying vec3 vDir;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(h(i), h(i + vec2(1, 0)), f.x), mix(h(i + vec2(0, 1)), h(i + 1.0), f.x), f.y); }
    void main(){
      vec3 d = normalize(vDir);
      float e = max(d.y, 0.0);
      vec3 c = mix(uHor, uZen, pow(e, 0.55));
      float s = max(dot(d, normalize(uSun)), 0.0);
      c += uSunCol * (pow(s, 600.0) * 2.5 * (1.0 - uHaze * 0.75) + pow(s, 9.0) * 0.25);
      // clouds, or smoke in a war sky
      vec2 p = d.xz / (d.y + 0.12) * 1.6 + vec2(uTime * 0.004, 0.0);
      float cl = n(p) * 0.5 + n(p * 2.1) * 0.3 + n(p * 4.3) * 0.2;
      cl = smoothstep(0.52 - uHaze * 0.25, 0.85, cl) * smoothstep(0.0, 0.25, d.y);
      c = mix(c, mix(vec3(0.95), uHor * 0.55, uHaze), cl * (0.55 + uHaze * 0.35));
      if (d.y < 0.0) c = uHor;
      gl_FragColor = vec4(c, 1.0);
    }`
}));
sky.renderOrder = -1; sky.frustumCulled = false;
scene.add(sky);
// a few point lights follow the fires nearest to the drone
const fireLights = [0, 1, 2, 3].map(() => { const l = new THREE.PointLight(0xff8a3a, 0, 160, 1.6); scene.add(l); return l; });

function setAtmosphere(a){
  scene.fog.color.setRGB(...a.fog); scene.fog.density = a.density;
  skyU.uZen.value.setRGB(...a.zen); skyU.uHor.value.setRGB(...a.hor);

}

  float h1(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
  float n1(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); return mix(mix(h1(i), h1(i + vec2(1, 0)), f.x), mix(h1(i + vec2(0, 1)), h1(i + 1.0), f.x), f.y); }
`;
// ================================================================ facade skins: one window bay (3.1 m) by one storey (3.25 m) per tile, painted into an atlas
// Top row: ground floor; bottom row: upper storeys. Alpha 0 marks glass (the shader draws panes, soot and the fire behind them).
// Taken from photos of Basel: the old town's plastered houses with sandstone window surrounds (with or without shutters),
// the 19th-century blocks with rusticated ground floors and window caps, post-war blocks, and the landmarks.
// 0 neutral plaster (tinted; also the valley and the Donbas)   1 old town: surrounds of grey sandstone   2 old town with shutters
// 3 Gründerzeit block   4 Münster: red sandstone, lancets   5 Rathaus: painted red, gold frieze, arcades
// 6 glass curtain wall (Messeturm)   7 post-war: window bands and parapets   8 sandstone church, round arches   9 blank wall
// (skin 11, drawn in the shader, not the atlas: a white village church, dark only its windows and door)
const ATLAS_N = 10;
const FACADE_TEX = (() => {
  const T = 256, NX = ATLAS_N, c = document.createElement('canvas'); c.width = T * NX; c.height = T * 2;
  const g = c.getContext('2d'), m = document.createElement('canvas'); m.width = c.width; m.height = c.height;
  const gm = m.getContext('2d'); gm.fillStyle = '#fff'; gm.fillRect(0, 0, m.width, m.height); gm.fillStyle = '#000';
  const R = rng(77);
  const rect = (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); };
  const glass = (x, y, w, h) => gm.fillRect(x, y, w, h);
  const grain = (x0, y0, k = 600, a = 0.06) => { for (let i = 0; i < k; i++){ g.fillStyle = R() < 0.5 ? `rgba(0,0,0,${R() * a})` : `rgba(255,255,255,${R() * a})`; g.fillRect(x0 + R() * T, y0 + R() * T, 1 + R() * 3, 1 + R() * 3); } };
  const weather = (x0, y0) => { for (let k = 0; k < 5; k++){ const gx = x0 + R() * T, gr = g.createLinearGradient(0, y0 + T * 0.4, 0, y0 + T); gr.addColorStop(0, 'rgba(40,36,30,0)'); gr.addColorStop(1, 'rgba(40,36,30,0.07)'); g.fillStyle = gr; g.fillRect(gx, y0 + T * 0.4, 3 + R() * 10, T * 0.6); } };
  const ashlar = (x0, y0, col, line, hgt = 28) => { rect(x0, y0, T, T, col); g.strokeStyle = line; g.lineWidth = 2; for (let yy = 0; yy < T; yy += hgt){ g.beginPath(); g.moveTo(x0, y0 + yy); g.lineTo(x0 + T, y0 + yy); g.stroke(); for (let xx = (yy / hgt) % 2 ? 0 : 40; xx < T; xx += 80){ g.beginPath(); g.moveTo(x0 + xx, y0 + yy); g.lineTo(x0 + xx, y0 + yy + hgt); g.stroke(); } } };
  // a window: an optional stone surround, a white wooden frame, casements with a transom, a sill
  const win = (x0, y0, o = {}) => {

// ================================================================ ambience
let ambT = 0, boomT = 8;
function updateAudio(dt){
  if (!AU.ready) return;
  const flying = state === 'fly' && !paused;
  const tf = clamp(P.T / MAXT, 0, 1), on = flying && P.alive && P.armed;
  const f = (P.kind === 'recon' ? 85 + 380 * Math.sqrt(tf) : 110 + 620 * Math.sqrt(tf)) + P.vel.length() * 0.8;
  for (const { o, mult } of AU.pOsc) setP(o.frequency, f * mult, 0.03);
  setP(AU.pGain.gain, on ? 0.035 + 0.12 * tf : 0, 0.03);
  setP(AU.pLp.frequency, 800 + 3000 * tf);
  setP(AU.wind.gain, flying && P.alive ? Math.min(0.25, P.vel.length() / 90 * 0.25) : 0);
  const fx = state === 'fly' ? (P.alive ? Math.max(noise, Math.min(1, feedShock)) * 0.05 : 0.07) : 0.02;
  setP(AU.hiss.gain, fx);
  if (!flying || !world){ for (const n of [AU.rumble, AU.crackle, AU.water, AU.city]) setP(n.gain, 0, 0.3); sirenStop(); return; }
  const war = world.war, agl = P.pos.y - world.groundAt(P.pos.x, P.pos.z), low = clamp(1 - agl / 250, 0.15, 1);
  // nearest fire
  let fd = 1e9; if (war) for (const e of emitters) if (e.kind === 'fire'){ const d = Math.hypot(e.x - P.pos.x, e.y - P.pos.y, e.z - P.pos.z); if (d < fd) fd = d; }
  setP(AU.crackle.gain, war ? clamp(1 - fd / 120, 0, 1) * 0.12 : 0, 0.2);
  setP(AU.rumble.gain, war ? 0.11 * low + 0.03 : 0, 0.5);
  setP(AU.city.gain, world.id === 'basel' && !war ? 0.06 * low : 0, 0.5);
  let wd = 1e9; if (world.riverZ) wd = Math.hypot(Math.abs(P.pos.z - world.riverZ(P.pos.x)), agl); else if (world.waterDist) wd = Math.hypot(world.waterDist(P.pos.x, P.pos.z), agl);
  setP(AU.water.gain, world.id === 'valley' ? clamp(1 - wd / 160, 0, 1) * 0.09 : 0, 0.3);
  ambT -= dt;
  if (ambT <= 0){
    if (world.id === 'valley' || !war){ ambT = 0.4 + Math.random() * 2.5; if (agl < 200) chirp(); }
    else ambT = 1;
    if (world.id === 'valley' && world.cows){ let cd = 1e9; for (const c of world.cows) cd = Math.min(cd, Math.hypot(c[0] - P.pos.x, c[1] - P.pos.y, c[2] - P.pos.z)); if (cd < 260 && Math.random() < 0.7) bell(700 + Math.random() * 300, 0.03 * (1 - cd / 260), 0.9); }
    if (world.id === 'basel' && !war && Math.random() < 0.04) bell(392, 0.04, 4);
  }
  // the war goes on: distant impacts, now and then a siren in Basel
  if (war){
    boomT -= dt;
    if (boomT <= 0){
      boomT = 15 + Math.random() * 25;
      const a = Math.random() * 6.28, d = Math.random() < 0.15 ? 250 + Math.random() * 450 : 700 + Math.random() * 2200, x = P.pos.x + Math.cos(a) * d, z = P.pos.z + Math.sin(a) * d, y = world.groundAt(x, z);
      const fall = d < 700 ? 1.6 : 0;
      if (fall) whistle(_v.set(x, y, z), fall);
      setTimeout(() => {
        if (!world || !world.war) return;
        impact(x, y, z);
        if (d < 700){ addDamage(x, Math.max(y, solidAt(x, z) - 2), z, 1.2, true); damageAt(x, z, 18, 0.85); boom(d, 2.5); feedShock = Math.max(feedShock, clamp(1.6 - d / 450, 0, 1)); }
        else setTimeout(() => thump(clamp(0.5 - d / 7000, 0.12, 0.5)), d / 343 * 1000);
      }, fall * 1000);
    }
    if (world.id === 'basel'){ if (!siren && Math.random() < dt / 300) sirenStart(); if (siren && clock > siren.end) sirenStop(); }
  } else sirenStop();
}
// an impact far away: a flash, a short burst of fire, a dirty cloud
function impact(x, y, z){
  for (let k = 0; k < 14; k++) emit(FIRE, x, y + 2, z, (Math.random() - 0.5) * 12, 6 + Math.random() * 10, (Math.random() - 0.5) * 12, 0.5 + Math.random() * 0.4, 12, 3, 1, 0);
  for (let k = 0; k < 8; k++) emit(SMOKE, x + (Math.random() - 0.5) * 10, y + 3, z + (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 4, 4 + Math.random() * 4, (Math.random() - 0.5) * 4, 20 + Math.random() * 10, 8, 50, 0.7, 0.2 + Math.random() * 0.3);
}

  const b = document.createElement('button');
  b.textContent = 'ENTER VR';
  b.style.cssText = 'position:absolute;right:16px;bottom:16px;z-index:4;padding:8px 14px;font:bold 14px monospace;color:#f4f2ec;background:rgba(0,0,0,0.6);border:2px solid #f4f2ec;cursor:pointer';
  b.onclick = async () => {
    audioInit(); noteInput();
    const cur = renderer.xr.getSession();
    if (cur){ cur.end(); return; }
    try {
      const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
      await renderer.xr.setSession(session);
      setPaused(false); b.textContent = 'EXIT VR';
      session.addEventListener('end', () => { b.textContent = 'ENTER VR'; });
    } catch (e) { b.textContent = 'VR N/A'; }
  };
  document.body.appendChild(b);
}).catch(() => {});

// the feed does not need every pixel: when frames get slow, render fewer of them
const RES = { f: 1, acc: 0, n: 0, good: 0 };
function watchRes(raw){
  if (state !== 'fly' || paused || raw > 0.5) return;
  RES.acc += raw; RES.n++;
  if (RES.acc < 1.5) return;
  const avg = RES.acc / RES.n; RES.acc = 0; RES.n = 0;
  let f = RES.f;
  if (avg > 1 / 38 && f > 0.5) f = Math.max(0.5, f - 0.1);
  else if (avg < 1 / 55){ if (++RES.good > 3 && f < 1){ f = Math.min(1, f + 0.1); RES.good = 0; } }
  else RES.good = 0;
  if (f !== RES.f){ RES.f = f; const w = Math.round(RW * f), h = Math.round(RH * f); rt.setSize(w, h); post.uniforms.uRes.value.set(w, h); }
}
function frame(now){
  const raw = (now - last) / 1000, dt = Math.min(0.05, Math.max(0, raw)); last = now;
  if (!document.hidden) watchRes(raw);
  readPads();
  // exhibition kiosk: back to the start after a long time without input
  if (state === 'fly' && performance.now() - lastInput > IDLE_MS){ location.href = location.pathname + (lang !== 'de' ? '?lang=' + lang : ''); return; }
  if (!paused) update(dt);
  updateAudio(dt);
  showTouch();
  render();
}
openMain();
const autoMap = WORLDS.findIndex(w => w.id === QS.get('map'));
if (QS.has('go') && autoMap >= 0) startWorld(autoMap, ['defend', 'peace'].includes(QS.get('mode')) ? QS.get('mode') : 'explore');
renderer.setAnimationLoop(frame);
if (location.hash === '#dbg') window.__d = { get bandits(){ return bandits; }, aaGuns, P, get world(){ return world; }, startWorld, setWar, camera, THREE, scene, act, get state(){ return state; }, get card(){ return card; }, closeCard, update, render, get emitters(){ return emitters; }, SMOKE, FIRE, GAME, bandits, vehicles, detonate, endRound, BSTATE, damageAt, STATE_TEX, placeDrone, get renderer(){ return renderer; } };
