// ---------------------------------------------------------------- helpers
function hash2(x, y){
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct = 4){
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++){ s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; }
  return s;
}
let seed = 1337;
function rnd(){ seed = (seed + 0x6D2B79F5) | 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const rr = (a, b) => a + (b - a) * rnd();
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gauss = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2832 * Math.random()); };
const _m = new THREE.Matrix4(), _qq = new THREE.Quaternion(), _ee = new THREE.Euler(), _col = new THREE.Color(), _p3 = new THREE.Vector3(), _s3 = new THREE.Vector3();
const _v = new THREE.Vector3(), _w = new THREE.Vector3(), _q = new THREE.Quaternion();

// thermal vision: every lit material gets a heat value; TH blends between visible and white-hot
const TH = { value: 0 };
function thermal(mat, heat, ground = false){
  const heatU = { value: heat };
  mat.userData.heat = heatU;
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = (sh, r) => {
    if (prev) prev.call(mat, sh, r);
    sh.uniforms.uTh = TH; sh.uniforms.uHeat = heatU;
    sh.fragmentShader = 'uniform float uTh;\nuniform float uHeat;\n' + sh.fragmentShader.replace('#include <fog_fragment>', `
      { float lum = dot(gl_FragColor.rgb, vec3(0.333));
        float ht = ${ground ? 'uHeat + (0.42 - lum) * 0.45' : 'uHeat + (lum - 0.4) * 0.15'};
        gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(clamp(ht, 0.0, 1.0)), uTh); }
      #include <fog_fragment>`);
  };
  mat.customProgramCacheKey = () => 'th' + (ground ? 'g' : 'o');
  return mat;
}
const lam = (opts, heat) => thermal(new THREE.MeshLambertMaterial(opts), heat);

// ---------------------------------------------------------------- terrain
// east = +x, north = -z. The mining town is at the origin, the enemy comes from the east.
const SIZE = 16000, SEG = 400, CELL = SIZE / SEG, HALF = SIZE / 2;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
// a dry ravine (balka) winds north-south about 1.5 km east of the town, with brush and trees at the bottom
const balkaX = z => 1500 + 140 * Math.sin(z / 800) + 50 * Math.sin(z / 270);
const BALKA_W = 110, BALKA_D = 16;
// spoil heaps (terrikons) of the coal mines: steep dark cones [x, z, height, radius]
const HEAPS = [[1050, -1250, 90, 210], [-1500, -1300, 70, 180], [2400, 3200, 65, 170], [-900, 2400, 55, 160], [4800, -2600, 80, 200]];
// a pond south-west of the town
const POND = { x: -650, z: 700, rx: 260, rz: 150 };
function baseHeight(x, z){
  const flat = clamp((Math.hypot(x, z) - 300) / 700, 0, 1);
  let h = ((fbm(x / 1700 + 10, z / 1700 + 10) - 0.47) * 70 + Math.sin(z / 1100) * 6) * flat;
  const db = Math.abs(x - balkaX(z));
  h -= BALKA_D * (1 - sstep(BALKA_W * 0.2, BALKA_W * 0.5 + 25, db)) * (0.75 + 0.5 * vnoise(z / 400, 3));
  for (const [hx, hz, hh, hr] of HEAPS){
    const d = Math.hypot(x - hx, z - hz);
    if (d < hr) h += hh * sstep(0, 1, 1 - d / hr);
  }
  return h;
}
const pondE = (x, z) => ((x - POND.x) / POND.rx) ** 2 + ((z - POND.z) / POND.rz) ** 2;
let pondY = Infinity;
for (let k = 0; k < 32; k++){ const a = k / 32 * 6.2832; pondY = Math.min(pondY, baseHeight(POND.x + Math.cos(a) * POND.rx, POND.z + Math.sin(a) * POND.rz)); }
pondY -= 0.8;
const heights = new Float32Array((SEG + 1) * (SEG + 1));
for (let iz = 0; iz <= SEG; iz++) for (let ix = 0; ix <= SEG; ix++){
  const x = -HALF + ix * CELL, z = -HALF + iz * CELL;
  let h = baseHeight(x, z);
  const e = pondE(x, z);
  if (e < 1.5) h = Math.min(h, pondY - 3.5 + (h - pondY + 3.5) * sstep(0.75, 1.5, e));
  heights[iz * (SEG + 1) + ix] = h;
}
function groundAt(x, z){
  const gx = clamp((x + HALF) / CELL, 0, SEG - 0.001), gz = clamp((z + HALF) / CELL, 0, SEG - 0.001);
  const ix = Math.floor(gx), iz = Math.floor(gz), fx = gx - ix, fz = gz - iz;
  const r = SEG + 1;
  const h00 = heights[iz * r + ix], h10 = heights[iz * r + ix + 1], h01 = heights[(iz + 1) * r + ix], h11 = heights[(iz + 1) * r + ix + 1];
  if (fx + fz <= 1) return h00 + (h10 - h00) * fx + (h01 - h00) * fz;
  return h11 + (h01 - h11) * (1 - fx) + (h10 - h11) * (1 - fz);

// the first three are the roads the columns use; F1 and F2 are tracks along the tree lines; S1-S4 are town streets
const ROAD_DEFS = [

  { name: 'F1', w: 3, forest: true, pts: [[5200, -2300], [4000, -1750], [3000, -1350], [2200, -900], [1500, -520], [700, -210], [180, -40], [5, 0]] },
  { name: 'F2', w: 3, forest: true, pts: [[5000, 2600], [3900, 2050], [2900, 1600], [2100, 1000], [1300, 620], [600, 300], [180, 40], [5, 0]] },
  { name: 'S1', w: 6, town: true, pts: [[-440, -170], [0, -170], [440, -170]] },
  { name: 'S2', w: 6, town: true, pts: [[-440, 170], [0, 170], [440, 170]] },

  // the railway from the west past the town and the mine to the east
  { name: 'RAIL', w: 5, rail: true, pts: [[-7900, -1000], [-4000, -850], [-2000, -700], [-600, -570], [400, -570], [900, -700], [2500, -1600], [4500, -2000], [7900, -3300]] },
];
const ROADS = ROAD_DEFS.map(def => {
  const curve = new THREE.CatmullRomCurve3(def.pts.map(([x, z]) => new THREE.Vector3(x, 0, z)), false, 'centripetal');
  const n = Math.max(8, Math.ceil(curve.getLength() / 8));

const obstacles = new Map();
const OCELL = 40;
const okey = (cx, cz) => cx * 100003 + cz;
function addObstacle(o, R){
  for (let cx = Math.floor((o.x - R) / OCELL); cx <= Math.floor((o.x + R) / OCELL); cx++)
    for (let cz = Math.floor((o.z - R) / OCELL); cz <= Math.floor((o.z + R) / OCELL); cz++){
      const k = okey(cx, cz);
      if (!obstacles.has(k)) obstacles.set(k, []);

    }

function obstacleAt(x, y, z){
  const list = obstacles.get(okey(Math.floor(x / OCELL), Math.floor(z / OCELL)));
  if (!list) return null;
  for (const o of list){
    if (y > o.top || (o.tm && o.ti >= o.tm.count)) continue;
    const dx = x - o.x, dz = z - o.z;
    if (o.box){
      const lx = dx * o.c - dz * o.s, lz = dx * o.s + dz * o.c;
      if (Math.abs(lx) < o.hw && Math.abs(lz) < o.hl) return o;

function radialTexture(stops, size = 64){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), gr = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, s] of stops) gr.addColorStop(o, s);

  return new THREE.CanvasTexture(c);
}

function fx(pos, fire, size0, size1, life, vel, opacity = 1, grav = 0, tint = SMOKE_DARK){

function act(a){
  if (a === 'lang') return nextLang();
  if (ended){ if (endPhase() > 7 && (a === 'arm' || a === 'det')) startRound(); return; }
  if (a === 'pause') return setPaused(!paused);
  if (paused && (a === 'restart' || a === 'det')) return startRound();
  if (paused && a === 'vision') return nextLang();  // X on the pause screen: language
  if (a === 'screen') return cycleGoggle();
  if (a === 'vision') return setVision(vision === 'day' ? 'thermal' : 'day');

// gp: a gamepad was used last (for the button names); block: buttons held across a change of screen do not fire;
// skip: the flight school skip button is held
const pad = { active: false, pitch: 0, roll: 0, yaw: 0, thr: 0, climb: 0, thrSeen: false, prev: {}, gp: false, block: false, skip: false };
const padBusy = gp => gp.buttons.some(b => b.pressed) || gp.axes.some(v => Math.abs(v) > 0.3);

  pad.active = false; pad.skip = false;
  const session = renderer.xr.getSession();
  let busy = false;
  if (session){
    for (const src of session.inputSources){
      const gp = src.gamepad;
      if (!gp) continue;
      const ax = gp.axes, bt = gp.buttons;
      pad.active = true;
      if (padBusy(gp)) busy = true;
      if (bt[1] && bt[1].pressed) pad.skip = true;  // grip
      if (src.handedness === 'right'){
        pad.roll = expo(dead(ax[2] || 0)); pad.pitch = -expo(dead(ax[3] || 0));
        edge('A', bt[4] && bt[4].pressed, 'arm'); edge('B', bt[5] && bt[5].pressed, 'det'); edge('RS', bt[3] && bt[3].pressed, 'screen');
      } else if (src.handedness === 'left'){
        pad.yaw = expo(dead(ax[2] || 0)); pad.climb = -dead(ax[3] || 0);
        pad.thr = bt[0] ? bt[0].value : 0;
        edge('X', bt[4] && bt[4].pressed, 'vision'); edge('Y', bt[5] && bt[5].pressed, 'mode'); edge('LS', bt[3] && bt[3].pressed, 'pause');
      }
    }

    for (const gp of navigator.getGamepads()){
      if (!gp || !gp.connected || gp.mapping !== 'standard') continue;
      const ax = gp.axes, bt = gp.buttons;
      pad.active = true;
      if (padBusy(gp)){ busy = true; pad.gp = true; }
      if (bt[8] && bt[8].pressed) pad.skip = true;  // View / Back
      pad.yaw = expo(dead(ax[0])); pad.climb = -dead(ax[1]); pad.roll = expo(dead(ax[2])); pad.pitch = -expo(dead(ax[3]));
      pad.thr = bt[7] ? bt[7].value : 0;

// ---------------------------------------------------------------- player drone (fast bullet-shaped interceptor, 6S battery, camera tilted up 40 degrees)
const G = 9.81, MAXT = 5.4 * G, KDRAG = 0.0034, LDRAG = 0.1;

function die(how){

    explosion(P.pos.clone(), how === 'boom' ? 0.8 : 0.3, P.pos.y - groundAt(P.pos.x, P.pos.z) < 3);
    for (const b of [...bandits]) if (b.state !== 'down' && b.pos.distanceTo(P.pos) < (b.practice ? 25 : 14)) killBandit(b, 'player');

const _up = new THREE.Vector3(), _acc = new THREE.Vector3(), _e = new THREE.Euler(), _qt = new THREE.Quaternion(), _dq = new THREE.Quaternion(), _ax = new THREE.Vector3();
function simStep(dt){
  const acro = P.mode === 'ACRO';
  if (acro){
    const rate = THREE.MathUtils.degToRad(420), yrate = THREE.MathUtils.degToRad(240);
    const tx = -P.sp * rate, tz = -P.sr * rate, ty = -P.sy * yrate;
    const k = 1 - Math.exp(-dt / 0.04);
    P.w.x += (tx - P.w.x) * k; P.w.y += (ty - P.w.y) * k; P.w.z += (tz - P.w.z) * k;

  } else {
    const tilt = THREE.MathUtils.degToRad(75);
    P.psi -= P.sy * THREE.MathUtils.degToRad(130) * dt;
    _qt.setFromEuler(_e.set(-P.sp * tilt, P.psi, -P.sr * tilt, 'YXZ'));
    P.q.slerp(_qt, 1 - Math.exp(-dt * 9));
  }
  _up.set(0, 1, 0).applyQuaternion(P.q);
  let T = 0;
  if (P.armed){
    if (acro) T = P.thr * MAXT;

      const vzt = clamp((keys.KeyW ? 14 : 0) - (keys.KeyS ? 11 : 0) + pad.climb * 14, -11, 14);
      T = clamp((G + 4 * (vzt - P.vel.y) + KDRAG * P.vel.length() * P.vel.y) / Math.max(0.28, _up.y), 0, MAXT);
    }
    const left = 1 - P.used;
    if (left < 0.12) T *= Math.max(0, left / 0.12);

  }
  P.T = T;
  const sp = P.vel.length();
  _acc.copy(_up).multiplyScalar(T);
  _acc.y -= G;
  _acc.addScaledVector(P.vel, -(KDRAG * sp + LDRAG));
  P.vel.addScaledVector(_acc, dt);
  P.pos.addScaledVector(P.vel, dt);

  const gh = groundAt(P.pos.x, P.pos.z) + 0.05;
  if (P.pos.y <= gh){
    if (P.vel.length() > 9){ P.pos.y = gh + 0.3; die('boom'); return; }
    P.pos.y = gh;
    if (P.vel.y < 0) P.vel.y = 0;

    add(boxG(0.12, 0.14, 1.1), 0, 0, 0);
    add(boxG(1.6, 0.03, 0.28), 0, 0.09, 0.1);
    add(boxG(0.6, 0.02, 0.15), 0, 0.02, -0.55);
    add(boxG(0.02, 0.22, 0.15), 0, 0.12, -0.55);

    this.aimP.set(gx, 0, gz);

// free the GPU buffers of a removed model: at an event the page runs all evening without a reload
function disposeTree(o){

    if (m.isMesh){ m.geometry.dispose(); for (const x of [].concat(m.material)) x.dispose(); }
    else if (m.isSprite) m.material.dispose();

}
// a house goes down at the first hit; a panel block takes two small hits or one big one
function hitHouse(h, power){
  if (!h.alive) return;
  h.dmg += power;
  if (!h.block || h.dmg >= 2) return destroyHouse(h);
  explosion(_p3.set(h.x, h.y + 6, h.z), 1.5, true);
  burners.push({ x: h.x + rr(-3, 3), y: h.y + rr(4, h.H - 2), z: h.z + rr(-3, 3), r: 4, until: clock + rr(60, 120), t: 0 });
}
function destroyHouse(h){
  if (!h.alive) return;
  h.alive = false;
  destroyedLog.push(h);
  h.intact.visible = false;
  scene.remove(h.ruin);
  h.ruin.geometry.dispose();
  const r = buildRuin(h, h.frame, true);
  h.ruin = new THREE.Mesh(r.geo, burntMat);
  h.ruin.matrixAutoUpdate = false;
  scene.add(h.ruin);

  explosion(_p3.set(h.x, h.y + 2, h.z), h.block ? 4 : 3, true);
  burners.push({ x: h.x, y: h.y + 1, z: h.z, r: Math.min(14, Math.max(h.w, h.l) * 0.5), until: clock + rr(90, 160), t: 0 });

function killBandit(b, by){

    tScene: { value: rt.texture }, tOSD: { value: osdTex }, uRes: { value: new THREE.Vector2(RW, RH) },
    uTime: { value: 0 }, uNoise: { value: 0 }, uStatic: { value: 0 }, uFlash: { value: 0 }, uK: { value: K }, uGain: { value: 1.3 }, uTherm: { value: 0 }, uBlack: { value: 0 }, uClean: { value: 0 }, uOsdTop: { value: 0 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tScene, tOSD; uniform vec2 uRes;
    uniform float uTime, uNoise, uStatic, uFlash, uK, uGain, uTherm, uBlack, uClean, uOsdTop;
    varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 uv = vUv;
      vec2 px = floor(vUv * uRes);
      float tq = floor(uTime * 30.0);
      float row = floor(uv.y * uRes.y);
      float jit = (h(vec2(row, tq)) - 0.5) * (0.003 + uNoise * 0.06) * step(0.7 - uNoise * 0.6, h(vec2(row * 0.37, tq + 1.7)));
      jit += sin(uv.y * 30.0 + uTime * 2.0) * 0.0008;
      jit *= 1.0 - uClean;
      uv.x += jit;
      vec2 c = uv * 2.0 - 1.0;
      c *= (1.0 + uK * dot(c, c)) / (1.0 + 2.0 * uK);
      vec2 s = c * 0.5 + 0.5;
      vec3 col = texture2D(tScene, s).rgb;
      vec3 smear = texture2D(tScene, s - vec2(1.5 / uRes.x, 0.0)).rgb + texture2D(tScene, s - vec2(3.5 / uRes.x, 0.0)).rgb;
      col = mix(col, smear * 0.5, 0.3);
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      l = clamp(pow(l * uGain, 0.85) * 1.15, 0.0, 1.0);
      vec3 graded = mix(vec3(0.11, 0.10, 0.09), vec3(0.88, 0.85, 0.79), l) * vec3(1.0, 0.965, 0.9);
      vec3 chroma = col - vec3((col.r + col.g + col.b) / 3.0);
      col = mix(graded + chroma * 0.5, vec3(mix(0.03, 0.96, l)), uTherm);
      vec4 o = texture2D(tOSD, vec2(vUv.x + jit, vUv.y));
      col = mix(col, o.rgb, o.a);
      float n = h(px + vec2(tq * 7.13, tq * 3.7));
      col += (n - 0.5) * (0.05 + uNoise * 0.55);
      col += step(1.0 - uNoise * 0.03, h(px * 1.31 + tq)) * 0.8;
      float band = fract(vUv.y + uTime * 0.11);
      col *= 1.0 - 0.06 * smoothstep(0.0, 0.04, band) * smoothstep(0.1, 0.04, band);
      vec2 vc = vUv - 0.5; col *= 1.0 - dot(vc, vc) * 0.85;
      float sn = h(vec2(px.x * 0.5 + tq, px.y * 1.7 + tq * 13.0));
      float ln = h(vec2(row, tq * 1.3));
      col = mix(col, vec3(sn * 0.75 + ln * 0.25) * vec3(0.92, 0.9, 0.86), uStatic);
      vec4 o3 = texture2D(tOSD, vec2(vUv.x + sin(vUv.y * 30.0 + uTime * 2.0) * 0.0008, vUv.y));
      col = mix(col, o3.rgb, o3.a * uOsdTop);
      col = mix(col, vec3(1.0, 0.97, 0.9), uFlash);
      col = mix(col, vec3(0.0), uBlack);
      vec4 o2 = texture2D(tOSD, vUv);
      // end screen and pause menu: text on top of all feed effects, so it stays sharp
      col = mix(col, o2.rgb, o2.a * max(uBlack, uClean));
      gl_FragColor = vec4(col, 1.0);
    }`
});

function undistort(sx, sy){
  let x = sx, y = sy;
  for (let k = 0; k < 8; k++){
    const cx = x * 2 - 1, cy = y * 2 - 1, f = (1 + K * (cx * cx + cy * cy)) / (1 + 2 * K);
    x += sx - (cx * f * 0.5 + 0.5); y += sy - (cy * f * 0.5 + 0.5);
  }
  return [x * W, (1 - y) * H];
}
const _pv = new THREE.Vector3();
function toScreen(p){
  _pv.copy(p).applyMatrix4(camera.matrixWorldInverse);
  const front = _pv.z < 0;
  _pv.applyMatrix4(camera.projectionMatrix);
  const [x, y] = undistort(_pv.x * 0.5 + 0.5, _pv.y * 0.5 + 0.5);
  return [x, y, front];
}

// ---------------------------------------------------------------- OSD
const INK = '#f4f2ec', EDGE = 'rgba(0,0,0,0.75)';
const fmtD = d => d < 1000 ? Math.round(d) + '' : (d / 1000).toFixed(1) + 'K';
function txt(s, x, y, align = 'left'){ oc.textAlign = align; oc.strokeText(s, x, y); oc.fillText(s, x, y); }
function strokeTwice(){ oc.stroke(); oc.lineWidth = 1; oc.strokeStyle = INK; oc.stroke(); oc.lineWidth = 2.5; oc.strokeStyle = EDGE; }
function drawCompass(){
  const f = _v.set(0, 0, -1).applyQuaternion(camera.quaternion);
  if (Math.hypot(f.x, f.z) < 0.05) f.copy(_w.set(0, 1, 0).applyQuaternion(camera.quaternion)).negate();
  const hd = (Math.atan2(f.x, -f.z) * 180 / Math.PI + 360) % 360;
  const cx = W / 2, y = 11, ppd = 1.15, span = 60;
  const lab = { 0: 'N', 90: 'E', 180: 'S', 270: 'W' };
  oc.beginPath();
  for (let d = Math.ceil((hd - span) / 10) * 10; d <= hd + span; d += 10){
    const x = cx + (d - hd) * ppd, dn = (d % 360 + 360) % 360;
    if (dn % 30 === 0) txt(lab[dn] || String(dn), x, y, 'center');
    else { oc.moveTo(x, y - 2); oc.lineTo(x, y + 2); }
  }
  strokeTwice();
  oc.beginPath(); oc.moveTo(cx, y + 6); oc.lineTo(cx - 3, y + 10); oc.lineTo(cx + 3, y + 10); oc.closePath(); oc.stroke(); oc.fill();
  txt(String(Math.round(hd) % 360).padStart(3, '0'), cx, y + 17, 'center');
  // nearest ground target bearing
  let nv = null, nvd = 1e9;
  for (const v of vehicles){ if (!v.alive || v.hidden) continue; const d = Math.hypot(v.pos.x - P.pos.x, v.pos.z - P.pos.z); if (d < nvd){ nvd = d; nv = v; } }
  if (nv){
    const brg = (Math.atan2(nv.pos.x - P.pos.x, -(nv.pos.z - P.pos.z)) * 180 / Math.PI + 360) % 360;
    const off = ((brg - hd + 540) % 360) - 180, x = cx + clamp(off, -span - 4, span + 4) * ppd;
    oc.beginPath(); oc.moveTo(x, y + 4); oc.lineTo(x + 4, y + 8); oc.lineTo(x, y + 12); oc.lineTo(x - 4, y + 8); oc.closePath();
    strokeTwice();
  }
  // village (home) bearing
  if (Math.hypot(P.pos.x, P.pos.z) > 60){
    const brg = (Math.atan2(-P.pos.x, P.pos.z) * 180 / Math.PI + 360) % 360;
    const off = ((brg - hd + 540) % 360) - 180;
    const x = cx + clamp(off, -span - 4, span + 4) * ppd;
    oc.fillStyle = 'rgba(0,0,0,0.6)'; oc.fillRect(x - 4, y + 4, 8, 9); oc.fillStyle = INK;
    txt('H', x, y + 9, 'center');
  }
}
function drawOSD(){
  oc.setTransform(OW / W, 0, 0, OH / H, 0, 0);
  oc.clearRect(0, 0, W, H);
  if (ended){ drawEnd(); return; }
  oc.font = 'bold 9px monospace'; oc.textBaseline = 'middle';
  oc.lineWidth = 2.5; oc.strokeStyle = EDGE; oc.fillStyle = INK;
  if (hitMsg > 0){
    txt('HIT CONFIRMED', W / 2, H / 2 + 54, 'center'); txt(hitWhat, W / 2, H / 2 + 66, 'center');  // under DISARMED and the arm keys
  }
  if (!P.alive) return;
  oc.lineJoin = 'round';
  const blink = (clock * 2.5 | 0) % 2 === 0;

  // artificial horizon (dots on the true horizon)
  const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); f.y = 0;
  if (f.lengthSq() > 1e-4){
    f.normalize();
    for (let a = -4; a <= 4; a++){
      const d = f.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), a * 0.07).multiplyScalar(1000).add(camera.position);
      const [x, y, fr] = toScreen(d);
      if (fr && x > 20 && x < W - 20 && y > 32 && y < H - 15){ oc.fillRect(x - 2, y - 1.5, 4, 3); oc.strokeRect(x - 2, y - 1.5, 4, 3); oc.fillRect(x - 1.5, y - 1, 3, 2); }
    }
  }
  oc.beginPath(); oc.arc(W / 2, H / 2, 4, 0, 7); oc.moveTo(W / 2 - 9, H / 2); oc.lineTo(W / 2 + 9, H / 2); oc.moveTo(W / 2, H / 2 - 7); oc.lineTo(W / 2, H / 2 + 7);
  strokeTwice();
  if (P.vel.length() > 3){
    const [x, y, fr] = toScreen(P.vel.clone().normalize().multiplyScalar(100).add(camera.position));
    if (fr && x > 0 && x < W && y > 0 && y < H){ oc.strokeRect(x - 2, y - 2, 4, 4); oc.fillRect(x - 1, y - 1, 2, 2); }
  }
  drawCompass();

  // radar cue boxes on the enemy drones; recon drones carry a bar that fills while they spot for the artillery
  let near = null, nd = 1e9;
  for (const g of bandits){
    if (g.state === 'down') continue;
    const d = g.pos.distanceTo(camera.position);
    const [x, y, fr] = toScreen(g.pos);
    if (fr && x > 4 && x < W - 4 && y > 4 && y < H - 4){
      const s = clamp(900 / d, 3, 14);
      oc.beginPath();
      for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]){
        oc.moveTo(x + sx * s, y + sy * s * 0.4); oc.lineTo(x + sx * s, y + sy * s); oc.lineTo(x + sx * s * 0.4, y + sy * s);
      }
      strokeTwice();
      txt(fmtD(d), x, y + s + 6, 'center');
      if (g.role === 'recon' && !g.practice){
        const k = clamp(g.spot / SPOT_FULL, 0, 1);
        oc.fillStyle = 'rgba(0,0,0,0.6)'; oc.fillRect(x - 9, y + s + 11, 18, 4);
        oc.fillStyle = INK; oc.fillRect(x - 8, y + s + 12, 16 * k, 2);
      }
    } else if (d < nd){ nd = d; near = g; }
  }
  // ground targets reported by the recon drone: diamond with distance
  for (const v of vehicles){
    if (!v.alive || v.hidden) continue;
    const d = v.pos.distanceTo(camera.position);
    const [x, y, fr] = toScreen(_p3.copy(v.pos).setY(v.pos.y + 1.5));
    if (!fr || x < 4 || x > W - 4 || y < 36 || y > H - 4) continue;
    oc.beginPath(); oc.moveTo(x, y - 6); oc.lineTo(x + 6, y); oc.lineTo(x, y + 6); oc.lineTo(x - 6, y); oc.closePath();
    strokeTwice();
    txt(fmtD(d), x, y + 12, 'center');
  }
  if (near){
    const l = near.pos.clone().applyMatrix4(camera.matrixWorldInverse);
    let ax = l.x, ay = l.y;
    if (l.z > 0 && Math.abs(ax) + Math.abs(ay) < 1e-3) ay = -1;
    const m = Math.hypot(ax, ay) || 1; ax /= m; ay /= m;
    const cx = W / 2 + ax * 130, cy = H / 2 - ay * 88;
    oc.save(); oc.translate(cx, cy); oc.rotate(Math.atan2(-ay, ax));
    oc.beginPath(); oc.moveTo(7, 0); oc.lineTo(-4, -5); oc.lineTo(-4, 5); oc.closePath(); oc.stroke(); oc.fill();
    oc.restore();
    txt(fmtD(nd), cx, cy + (ay > 0 ? 11 : -11), 'center');
  }

  if (!(killBlink > 0 && blink)) txt('KILL ' + kills, 8, 10);
  txt('LEAK ' + leaks, 8, 21);
  txt('AA ' + aaKills, 8, 32);
  if (arty.active && blink) txt('ARTY', 8, 43);
  const mm = Math.floor(P.time / 60), ss = Math.floor(P.time % 60);
  txt(mm + ':' + String(ss).padStart(2, '0'), W - 8, 10, 'right');
  const dist = Math.hypot(P.pos.x, P.pos.z);
  const lq = Math.round(clamp(100 - Math.max(0, dist - LINK_START) / 37, 0, 99));
  if (!(lq < 30 && blink)) txt('LQ ' + lq, W - 8, 21, 'right');
  if (vision === 'thermal') txt('WHT', W - 8, 32, 'right');

  const volts = 25.2 - 5.4 * P.used - 1.0 * (P.T / MAXT);
  if (!(volts < 20.4 && blink)) txt(volts.toFixed(1) + 'V', 8, H - 10);
  txt('THR ' + Math.round(P.T / MAXT * 100), 8, H - 21);
  txt(Math.round(P.vel.length() * 3.6) + ' KMH', W - 8, H - 21, 'right');
  txt(Math.round(P.pos.y - groundAt(P.pos.x, P.pos.z)) + ' M', W - 8, H - 10, 'right');
  txt(P.mode, W / 2, H - 10, 'center');
  txt('H ' + fmtD(dist), W / 2 + 40, H - 10, 'left');
  if (!P.armed && blink) txt('DISARMED', W / 2, H / 2 + 26, 'center');
  if (!P.armed) txt(renderer.xr.isPresenting ? '[A]   [L-STICK]' : '[SPACE]   [P]', W / 2, H / 2 + 38, 'center');
}

}
// wraps a text to lines no wider than max, in the current font
function wrapPx(str, max){
  const out = []; let line = '';
  for (const w of str.split(' ')){
    const t = line ? line + ' ' + w : w;
    if (line && oc.measureText(t).width > max){ out.push(line); line = w; } else line = t;
  }
  if (line) out.push(line);
  return out;
}

// ---------------------------------------------------------------- pause screen: quadcopter schematic
// Betaflight quad X: 1 rear right CW, 2 front right CCW, 3 rear left CCW, 4 front left CW
const MOTORS = [
  { n: 1, x: 122, y: 166, cw: true,  p: 1, r: -1, y_: -1 },
  { n: 2, x: 122, y: 82,  cw: false, p: -1, r: -1, y_: 1 },
  { n: 3, x: 38,  y: 166, cw: false, p: 1, r: 1, y_: 1 },
  { n: 4, x: 38,  y: 82,  cw: true,  p: -1, r: 1, y_: -1 },
];
const propPhase = [0, 0, 0, 0];
let pauseLast = performance.now();
function outlined(draw, w = 1){
  oc.lineWidth = w + 2; oc.strokeStyle = 'rgba(0,0,0,0.8)'; oc.beginPath(); draw(); oc.stroke();
  oc.lineWidth = w; oc.strokeStyle = INK; oc.beginPath(); draw(); oc.stroke();
}
function drawPause(){
  const now = performance.now(), pdt = Math.min(0.05, (now - pauseLast) / 1000); pauseLast = now;
  oc.setTransform(OW / W, 0, 0, OH / H, 0, 0);
  oc.clearRect(0, 0, W, H);
  oc.fillStyle = 'rgba(0,0,0,0.6)'; oc.fillRect(0, 0, W, H);
  oc.font = 'bold 9px monospace'; oc.textBaseline = 'middle'; oc.lineJoin = 'round';
  oc.lineWidth = 2.5; oc.strokeStyle = 'rgba(0,0,0,0.8)'; oc.fillStyle = INK;
  const vr = renderer.xr.isPresenting;
  txt('PAUSE', 80, 12, 'center');
  txt(say(vr ? S.pResumeVR : S.pResumeKb), W - 8, 12, 'right');
  txt(say(vr || pad.gp ? S.pLangVR : S.pLangKb) + ' ' + lang.toUpperCase(), 80, 24, 'center');

  const thr = clamp((keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0) + pad.climb, -1, 1);
  const pit = clamp((keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0) + pad.pitch, -1, 1);
  const rol = clamp((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0) + pad.roll, -1, 1);
  const yaw = clamp((keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + pad.yaw, -1, 1);

  const cx = 80, cy = 124;
  outlined(() => { for (const m of MOTORS){ oc.moveTo(cx, cy); oc.lineTo(m.x, m.y); } }, 2);
  oc.fillStyle = '#000'; oc.fillRect(cx - 12, cy - 18, 24, 36);
  outlined(() => oc.rect(cx - 11, cy - 17, 22, 34));
  outlined(() => oc.rect(cx - 5, cy - 17, 10, 7));
  oc.fillStyle = INK;
  txt('CAM', cx, cy - 4, 'center');
  txt('FC', cx, cy + 8, 'center');
  outlined(() => { oc.moveTo(cx, cy - 26); oc.lineTo(cx, cy - 62); oc.moveTo(cx - 5, cy - 56); oc.lineTo(cx, cy - 62); oc.lineTo(cx + 5, cy - 56); });
  txt(say(S.pFront), cx, cy - 70, 'center');

  MOTORS.forEach((m, i) => {
    const mix = clamp(0.5 + 0.3 * thr + 0.18 * (pit * m.p + rol * m.r + yaw * m.y_), 0.05, 1);
    const dir = m.cw ? 1 : -1;
    propPhase[i] += dir * mix * 40 * pdt;
    outlined(() => oc.arc(m.x, m.y, 20, 0, 6.2832));
    const a = propPhase[i];
    outlined(() => { oc.moveTo(m.x + Math.cos(a) * 18, m.y + Math.sin(a) * 18); oc.lineTo(m.x - Math.cos(a) * 18, m.y - Math.sin(a) * 18); }, 2);
    // rotation arrow (canvas y points down, so a growing angle is clockwise seen from above)
    const a0 = m.y < cy ? 3.6 : 0.5, a1 = a0 + 1.3 * dir, r = 25;
    outlined(() => oc.arc(m.x, m.y, r, Math.min(a0, a1), Math.max(a0, a1)));
    const hx = m.x + Math.cos(a1) * r, hy = m.y + Math.sin(a1) * r, tx = -Math.sin(a1) * dir, ty = Math.cos(a1) * dir;
    outlined(() => { oc.moveTo(hx - tx * 4 + ty * 3, hy - ty * 4 - tx * 3); oc.lineTo(hx, hy); oc.lineTo(hx - tx * 4 - ty * 3, hy - ty * 4 + tx * 3); });
    oc.fillStyle = INK; oc.beginPath(); oc.arc(m.x, m.y, 2 + mix * 5, 0, 6.2832); oc.fill();
    const ly = m.y < cy ? m.y - 33 : m.y + 33;
    txt(m.n + (m.cw ? ' CW ' : ' CCW ') + Math.round(mix * 100) + '%', m.x, ly, 'center');
  });
  if (vr){
    txt(say(S.pVR1), 8, 218);
    txt(say(S.pVR2), 8, 229);
    txt(say(S.pVR3), 162, 229);
  } else {
    txt(say(S.pKb1), 8, 218);
    txt(say(S.pKb2), 8, 229);
  }

  const x0 = 162; let y = 30;
  const row = (on, a, b) => {
    if (on){ oc.fillStyle = 'rgba(244,242,236,0.25)'; oc.fillRect(x0 - 4, y - 6, W - x0, 23); oc.fillStyle = INK; }
    txt(a, x0, y); txt(b, x0 + 32, y + 11); y += 25;
  };
  txt(say(vr ? S.pHoldVR : S.pHoldKb), x0, y); y += 16;
  const keyNames = vr ? ['L ↕', 'R ↕', 'R ↔', 'L ↔'] : ['W S', '↑ ↓', '← →', 'A D'], rows = say(S.pRows);
  [thr, pit, rol, yaw].forEach((v, i) => row(v !== 0, keyNames[i] + '  ' + rows[i][0], rows[i][1]));
  y += 4;
  say(S.pFoot).forEach((l, i) => { txt(l, x0, y); y += [11, 16, 11, 13, 11, 0][i]; });
}

function resetWorld(){
  ended = false;
  for (const b of [...bandits]) b.remove();
  for (const v of vehicles){
    scene.remove(v.grp);
    if (v.turret.parent) v.turret.parent.remove(v.turret);
    disposeTree(v.grp); disposeTree(v.turret);
    if (v.snd) stopSound(v.snd);
    if (v.obs) v.obs.top = -1e9;
  }
  vehicles.length = 0; flying.length = 0; rounds.length = 0; burners.length = 0; pending.length = 0;
  arty.shells.length = 0; arty.t = 8; arty.active = false; arty.final = false;
  for (const p of fxPool) p.s.visible = false;
  for (const h of destroyedLog) restoreHouse(h);
  destroyedLog.length = 0;
  for (const h of houses) h.dmg = 0;
  restoreCentral();
  for (const s of guns){ s.burst = 0; s.target = null; s.alive = true; }
  kills = leaks = aaKills = 0; hitMsg = killBlink = 0; clock = 0;
  nextRecon = FIRST_RECON; nextStrike = FIRST_STRIKE; nextColumn = FIRST_COLUMN; nextTrainer = 20; nextForest = 0;
  respawn(); P.mode = 'ANGL'; staticAmt = 1; flash = 0;
  tut.active = false; tut.drone = null;
  hold.t = 0; hold.ready = false; pad.block = true;
  setVision('day');
  setPaused(false);
}
function startRound(){ resetWorld(); }
function startTutorial(){
  resetWorld();
  tut.active = true; tutStep(1);
}
// event kiosk: the next person starts in the flight school, in the default language
function resetToStart(){
  setLang(DEFAULT_LANG);
  startTutorial();
  noteInput();
}

// ---------------------------------------------------------------- flight school: one step at a time, each waits for the action
const tut = { active: false, step: 0, t: 0, dist: 0, turn: 0, hd: 0, drone: null };
const TUT_STEPS = 9;
const _hd = new THREE.Vector3();
const heading = () => { _hd.set(0, 0, -1).applyQuaternion(P.q); return Math.atan2(-_hd.x, -_hd.z); };
function tutStep(n){
  tut.step = n; tut.t = 0; tut.dist = 0; tut.turn = 0; tut.hd = heading();
  if (n === 6) spawnPracticeDrone();
}
// a slow recon drone that circles low over the fields east of the town
function spawnPracticeDrone(){
  if (tut.drone && tut.drone.grp.parent && tut.drone.state !== 'down') return;
  const cx = START.x + 600, cz = START.z, R = 220, wp = [];
  for (let i = 0; i < 12; i++){ const a = -i / 12 * 6.2832; wp.push([cx + Math.cos(a) * R, cz + Math.sin(a) * R]); }
  const b = new Bandit('zala', wp);
  b.wp = wp; b.wi = 1; b.practice = true; b.goal = null; b.alt = 45; b.speed = 20; b.hp = 1e9;
  b.pos.set(wp[0][0], groundAt(wp[0][0], wp[0][1]) + 50, wp[0][1]);
  b.heading = Math.atan2(wp[1][0] - wp[0][0], wp[1][1] - wp[0][1]);
  bandits.push(b); tut.drone = b;
}
function tutProgress(){
  if (tut.step === 3) return (P.pos.y - groundAt(P.pos.x, P.pos.z)) / 15;
  if (tut.step === 4) return tut.dist / 50;
  if (tut.step === 5) return tut.turn / 6.2;
  return -1;
}
function tutUpdate(dt){
  tut.t += dt;
  if (holdSkip(keys.Enter || pad.skip, dt)) return startRound();
  const s = tut.step, ready = P.alive && P.armed, hd = heading(), dh = hd - tut.hd;
  tut.hd = hd;
  if (ready){ tut.dist += Math.hypot(P.pos.x - _p0.x, P.pos.z - _p0.z); tut.turn += Math.abs(Math.atan2(Math.sin(dh), Math.cos(dh))); }
  if (s === 1){ if (P.armed) tutStep(3); else if (tut.t > 3.5) tutStep(2); }
  else if (s === 2){ if (P.armed) tutStep(3); }
  else if (s >= 3 && s <= 5){ if (ready && tutProgress() >= 1) tutStep(s + 1); }
  else if (s === 6 || s === 7){
    const g = tut.drone;
    if (g && g.state === 'down') tutStep(8);
    else if (!g || !g.grp.parent) spawnPracticeDrone();
    else {
      const d = g.pos.distanceTo(P.pos);
      if (s === 6 && ready && d < 25) tutStep(7);
      else if (s === 7 && (d > 45 || !P.alive)) tutStep(6);
    }
  }
  else if (s === 8 && tut.t > 5) tutStep(9);
  else if (s === 9 && tut.t > 9) startRound();
}
function holdSkip(on, dt){
  if (!on){ hold.ready = true; hold.t = 0; return false; }
  if (!hold.ready) return false;
  hold.t += dt;
  return hold.t >= HOLD_TIME;
}
function drawTutorial(){
  if (!tut.active || ended || paused) return;
  const d = device();
  let s = tut.step;
  if (s >= 3 && s <= 7 && P.alive && !P.armed) s = 2;  // after a crash: start the motors again
  const e = TUT[s], text = say(e.kb ? (d === 'kb' ? e.kb : e.vr) : e);
  drawBox(text, say(S.school) + ' ' + tut.step + '/' + TUT_STEPS, s === tut.step && P.armed ? tutProgress() : -1);
  drawHold(say(d === 'vr' ? S.skipTutVR : d === 'pad' ? S.skipTutPad : S.skipTutKb));
}

// ---------------------------------------------------------------- main loop
const _p0 = new THREE.Vector3(), _rel = new THREE.Vector3(), _dr = new THREE.Vector3();
let noise = 0;
respawn();
setVision('day');

function updateSticks(dt){
  const acro = P.mode === 'ACRO';
  const r = 1 - Math.exp(-dt * (acro ? 7 : 9));
  const tp = clamp((keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0) + pad.pitch, -1, 1);
  const tr = clamp((keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0) + pad.roll, -1, 1);
  const ty = clamp((keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0) + pad.yaw, -1, 1);
  const ra = pad.active ? 1 - Math.exp(-dt * 30) : r;
  P.sp += (tp - P.sp) * ra; P.sr += (tr - P.sr) * ra; P.sy += (ty - P.sy) * ra;
  if (acro && P.armed && pad.active && pad.thrSeen) P.thr = pad.thr;
  else if (acro && P.armed){
    if (keys.KeyW) P.thr = Math.min(1, P.thr + dt * 0.75);
    if (keys.KeyS) P.thr = Math.max(0, P.thr - dt * 0.75);
  }
}

function update(dt){
  clock += dt;
  _p0.copy(P.pos);
  updateSticks(dt);
  if (P.alive){
    const n = Math.ceil(dt / 0.004);
    for (let i = 0; i < n && P.alive; i++) simStep(dt / n);
    if (P.armed) P.time += dt;
  } else if (!ended && clock - P.deadAt > 0.5) respawn();
  updateThreats(dt);
  if (tut.active && !ended) tutUpdate(dt);
  for (const b of [...bandits]) b.update(dt);
  for (const v of vehicles) v.update(dt);

  // intercept check: closest approach of the relative motion during the frame
  if (P.alive && P.armed){
    for (const b of [...bandits]){
      if (b.state === 'down') continue;
      _rel.copy(b.prev).sub(_p0);
      _dr.copy(b.pos).sub(b.prev).sub(_v.copy(P.pos).sub(_p0));
      const t = clamp(-_rel.dot(_dr) / Math.max(1e-6, _dr.lengthSq()), 0, 1);
      if (_rel.addScaledVector(_dr, t).length() < 3.2){ die('boom'); break; }
    }
  }

  updateGuns(dt);
  updateFx(dt);
  updateBurners(dt);
  updateFlying(dt);
  for (const f of horizonFires){ const s = f.base * (0.8 + 0.25 * Math.sin(clock * 7 + f.ph) + 0.1 * Math.random()); f.f.scale.set(s, s * 0.8, 1); }

  camera.position.copy(P.pos).add(_v.set(0, 0.03, -0.04).applyQuaternion(P.q));
  camera.quaternion.copy(P.q).multiply(UPTILT);
  if (P.alive && P.armed){
    const v = 0.0015 + 0.004 * (P.T / MAXT);
    camera.rotateX((Math.random() - 0.5) * v); camera.rotateY((Math.random() - 0.5) * v);
  }
  const dist = Math.hypot(P.pos.x, P.pos.z);
  const lowAlt = clamp((dist - 1500) / 3000, 0, 1) * clamp(1 - (P.pos.y - groundAt(P.pos.x, P.pos.z)) / 40, 0, 1);
  noise = clamp(Math.max(0, dist - LINK_START) / 4000 + lowAlt * 0.5, 0, 1);
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  sunSprite.position.copy(camera.position).addScaledVector(SUN_DIR, 15000);

  flash = Math.max(0, flash - dt * 6);
  if (P.alive) staticAmt = Math.max(0, staticAmt - dt * 4);
  killBlink = Math.max(0, killBlink - dt); hitMsg = Math.max(0, hitMsg - dt);
}

// ---------------------------------------------------------------- Meta Quest: head-locked goggle screen
let lastFeed = 0;
const feedRT = new THREE.WebGLRenderTarget(OW, OH, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
const vrScene = new THREE.Scene();
vrScene.background = new THREE.Color(0);
const vrCam = new THREE.PerspectiveCamera();
// the quad is placed in view space, so it stays fixed to the head in both eyes; base size 1.4 m = 50 degrees at 1.5 m,
// uScale makes it wider (right stick click cycles the sizes)
const GOGGLE_SCALES = [1.8, 2.34, 1.36]; // ~80, ~95, ~65 degrees wide
let goggleSize = 0;
try { goggleSize = (+localStorage.getItem('interceptor-vr-size') || 0) % GOGGLE_SCALES.length; } catch (e) {}
const goggle = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 1.05), new THREE.ShaderMaterial({
  uniforms: { map: { value: feedRT.texture }, uScale: { value: GOGGLE_SCALES[goggleSize] } }, depthTest: false, depthWrite: false,
  vertexShader: `uniform float uScale; varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * vec4(position.xy * uScale, -1.5, 1.0); }`,
  fragmentShader: `uniform sampler2D map; varying vec2 vUv; void main(){ gl_FragColor = texture2D(map, vUv); }`
}));
goggle.frustumCulled = false;
vrScene.add(goggle);
function cycleGoggle(){
  goggleSize = (goggleSize + 1) % GOGGLE_SCALES.length;
  goggle.material.uniforms.uScale.value = GOGGLE_SCALES[goggleSize];
  try { localStorage.setItem('interceptor-vr-size', goggleSize); } catch (e) {}
}
// automatic quality: when the frame rate is too low, draw fewer trees (they are shuffled, so the thinning is even);
// from the third step on, the crowns use a simpler shape. Trees that are not drawn are not solid.
const quality = { level: 0, levels: [1, 0.7, 0.5, 0.35, 0.22], acc: 0, n: 0, cool: 4 };
const CROWN_FULL = new THREE.IcosahedronGeometry(1, 0), CROWN_SIMPLE = new THREE.OctahedronGeometry(1, 0);
function applyQuality(){
  const f = quality.levels[quality.level] * (renderer.xr.isPresenting ? 0.45 : 1);
  for (const m of [treeIM, ...birchIM]) m.count = Math.floor(m.instanceMatrix.count * f);
  bushIM.count = Math.floor(bushIM.instanceMatrix.count * Math.min(1, f * 1.2));
  const crown = quality.level >= 2 || renderer.xr.isPresenting ? CROWN_SIMPLE : CROWN_FULL;
  for (const m of [treeIM, birchIM[1], bushIM]) m.geometry = crown;
}
function watchQuality(rawDt){
  if (paused) return;
  quality.cool -= rawDt; quality.acc += rawDt; quality.n++;
  if (quality.acc < 2) return;
  const avg = quality.acc / quality.n, limit = renderer.xr.isPresenting ? 1 / 55 : 1 / 40;
  quality.acc = 0; quality.n = 0;
  if (quality.cool <= 0 && avg > limit && quality.level < quality.levels.length - 1){ quality.level++; applyQuality(); quality.cool = 3; }
}
const vrQuality = () => applyQuality();
if (navigator.xr) navigator.xr.isSessionSupported('immersive-vr').then(ok => {
  if (!ok) return;
  const b = document.createElement('button');
  b.textContent = 'ENTER VR';
  b.style.cssText = 'position:absolute;right:16px;bottom:16px;z-index:2;padding:8px 14px;font:bold 14px monospace;color:#f4f2ec;background:rgba(0,0,0,0.6);border:2px solid #f4f2ec;cursor:pointer';
  b.onclick = async () => {
    audioInit(); noteInput();
    const cur = renderer.xr.getSession();
    if (cur){ cur.end(); return; }
    try {
      const session = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
      await renderer.xr.setSession(session);
      vrQuality(true); setPaused(false); b.textContent = 'EXIT VR';
      // event kiosk: taking the headset off sends the game back to the flight school for the next person
      session.addEventListener('visibilitychange', () => { if (session.visibilityState === 'hidden') resetToStart(); });
      session.addEventListener('end', () => { vrQuality(false); b.textContent = 'ENTER VR'; resetToStart(); });
    } catch (e) { b.textContent = 'VR N/A'; }
  };
  document.body.appendChild(b);
}).catch(() => {});

function render(){
  post.uniforms.uTime.value = (performance.now() / 1000) % 600;
  post.uniforms.uNoise.value = noise;
  post.uniforms.uStatic.value = P.alive ? staticAmt : 1;
  post.uniforms.uFlash.value = ended ? 0 : flash;
  const black = clamp((endPhase() - 5) / 1.5, 0, 1);
  post.uniforms.uBlack.value = black;
  post.uniforms.uClean.value = paused ? 1 : 0;
  post.uniforms.uOsdTop.value = !P.alive && hitMsg > 0 ? 1 : 0;  // the hit message stays readable over the static

  if (AU.ready){
    const tf = P.T / MAXT, on = P.alive && P.armed && !ended;
    const f = 120 + 760 * Math.sqrt(tf) + P.vel.length() * 0.8;
    for (const { o, mult } of AU.pOsc) setP(o.frequency, f * mult, 0.03);
    setP(AU.pGain.gain, on ? 0.05 + 0.16 * tf : 0, 0.03);
    setP(AU.pLp.frequency, 900 + 3500 * tf);
    setP(AU.wind.gain, P.alive && !ended ? Math.min(0.3, P.vel.length() / 110 * 0.3) : 0);
    setP(AU.hiss.gain, ended ? 0.1 * (1 - black) : P.alive ? noise * 0.04 : 0.07);
  }

  const inVR = renderer.xr.isPresenting, t = performance.now();
  if (!inVR || t - lastFeed > 1000 / 30){
    lastFeed = t;
    drawOSD();
    drawTutorial();
    if (paused) drawPause();
    osdTex.needsUpdate = true;
    const xrTarget = renderer.getRenderTarget();
    renderer.xr.enabled = false;
    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(inVR ? feedRT : null);
    renderer.render(postScene, postCam);
    renderer.xr.enabled = true;
    renderer.setRenderTarget(xrTarget);
  }
  if (inVR) renderer.render(vrScene, vrCam);
}

function frame(now){
  const raw = (now - last) / 1000, dt = Math.min(0.05, raw); last = now;
  if (!document.hidden) watchQuality(Math.min(raw, 0.25));
  readPads();
  if (performance.now() - lastInput > IDLE_MS) resetToStart();
  if (!paused) update(dt);
  render();
}
startTutorial();
renderer.setAnimationLoop(frame);
if (location.hash === '#dbg') window.__d = { startRound, startTutorial, resetToStart, tut, setLang, hold, pad, groundAt, P, bandits, vehicles, houses, central, guns, arty, Bandit, Vehicle, ROADS, camera, THREE, stats, setVision, update, render, spawnColumn, destroyHouse, hitHouse, noColumns(){ nextColumn = 1e9; }, quality, applyQuality,
  vrPreview(){ renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(feedRT); renderer.render(postScene, postCam); renderer.setRenderTarget(null); vrCam.aspect = RW / RH; vrCam.fov = 75; vrCam.updateProjectionMatrix(); renderer.render(vrScene, vrCam); },
  vrQuality,
  get state(){ return { clock, ended, endReason, kills, leaks, aaKills, lang, paused, alive: houses.filter(h => h.village && h.alive).length, step: tut.step }; } };
</script>
