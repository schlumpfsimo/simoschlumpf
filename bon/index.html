<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BON</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 fill=%27%23fff%27/%3E%3Cpath d=%27M14 4h36v48l-6 6-6-6-6 6-6-6-6 6-6-6z%27 fill=%27%23fff%27 stroke=%27%23000%27 stroke-width=%274%27 stroke-linejoin=%27round%27/%3E%3Cpath d=%27M22 18h20M22 28h20M22 38h12%27 stroke=%27%23000%27 stroke-width=%274%27/%3E%3C/svg%3E">
<style>
/* Startseite der Bon-Apps, Stil wie Turbo: weiss, schwarz, Monospace, keine Rundungen, keine Schatten */
:root{ --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace; --muted:#666; color-scheme:light }
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#000;font-family:var(--mono);font-size:14px;line-height:1.45}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #000}
.topbar,main{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:8px}
.brand{font-weight:700;letter-spacing:.15em;white-space:nowrap;text-transform:uppercase}
.brand span{color:var(--muted);font-weight:400;letter-spacing:0;font-size:.75rem;display:block;text-transform:none}
.count{margin-left:auto;font-size:.78rem;color:var(--muted)}
main{padding-top:14px;padding-bottom:40px}
h2{font-size:1rem;margin:0 0 10px;text-transform:uppercase;border-top:1px solid #000;padding-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
a.card{display:flex;flex-direction:column;gap:6px;min-height:110px;border:1px solid #000;padding:12px;color:#000;text-decoration:none;background:#fff}
a.card:hover,a.card:focus-visible{outline:2px solid #000;outline-offset:0}
a.card:active{background:#000;color:#fff}
.card .nr{font-size:.7rem;letter-spacing:.04em;color:var(--muted)}
.card .name{font-weight:700;font-size:1.1rem;text-transform:uppercase;letter-spacing:.1em}
</style>
</head>
<body>
<header class="top">
  <div class="topbar">
    <div class="brand">BON<span>Apps für den Bondrucker</span></div>
    <span class="count" id="count"></span>
  </div>
</header>
<main>
  <h2>Apps</h2>
  <div class="grid" id="apps"></div>
</main>
<script>
// Neue App: Ordner bon/<pfad>/ anlegen und hier eine Zeile ergänzen, vor «Namen».
// Reihenfolge = Reihenfolge der Kacheln. Namen bleibt immer zuletzt.
const APPS = [
  { pfad: 'text', name: 'Text' },
  { pfad: 'bild', name: 'Bild' },
  { pfad: 'depeche', name: 'Dépêche' },
  { pfad: 'rhy', name: 'Rhyschwumm' },
  { pfad: 'spaziergang', name: 'Spaziergang' },
  { pfad: 'menu', name: 'Menü' },
  { pfad: 'postkarte', name: 'Postkarte' },
  { pfad: 'kniffel', name: 'Kniffel' },
  { pfad: 'schiffe', name: 'Schiffe versenken' },
  { pfad: 'glueckskeks', name: 'Glückskeks' },
  { pfad: 'vokabeln', name: 'Vokabeln' },
  { pfad: 'rezept', name: 'Rezept' },
  { pfad: 'namen', name: 'Namen' },
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
document.getElementById('apps').innerHTML = APPS.map((a, i) => `
  <a class="card" href="${esc(a.pfad)}/">
    <span class="nr">${String(i + 1).padStart(2, '0')}</span>
    <span class="name">${esc(a.name)}</span>
  </a>`).join('');
document.getElementById('count').textContent = APPS.length + ' Apps';
</script>
</body>
</html>
