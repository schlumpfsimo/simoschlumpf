<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BON</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 fill=%27%23fff%27/%3E%3Ctext x=%2732%27 y=%2746%27 font-size=%2740%27 text-anchor=%27middle%27 fill=%27%23000%27 font-family=%27monospace%27 font-weight=%27700%27%3EB%3C/text%3E%3C/svg%3E">
<style>
/* Startseite der Bon-Apps, Stil wie Turbo: weiss, schwarz, Monospace, eckig */
:root{ --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace; --muted:#666; color-scheme:light }
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#000;font-family:var(--mono);font-size:14px;line-height:1.45}
header.top{border-bottom:1px solid #000}
.topbar,main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{padding-top:8px;padding-bottom:8px}
.brand{font-weight:700;letter-spacing:.15em;text-transform:uppercase}
.brand span{color:var(--muted);font-weight:400;letter-spacing:0;font-size:.75rem;display:block;text-transform:none}
main{padding-top:14px;padding-bottom:40px;display:flex;flex-direction:column;gap:10px}
a.app{display:block;border:1px solid #000;padding:16px;color:#000;text-decoration:none}
a.app:hover,a.app:focus-visible{background:#000;color:#fff;outline:none}
a.app b{display:block;font-size:1rem;text-transform:uppercase;letter-spacing:.1em}
.app.soon{color:var(--muted);border-style:dashed}
.app{display:block;border:1px solid #000;padding:16px}
.app b{display:block;font-size:1rem;text-transform:uppercase;letter-spacing:.1em}
.app span{display:block;font-size:.8rem;margin-top:4px}
a.app span{display:block;font-size:.8rem;margin-top:4px;opacity:.75}
</style>
</head>
<body>
<header class="top">
  <div class="topbar"><div class="brand">BON<span>Apps für den Bondrucker</span></div></div>
</header>
<main>
  <a class="app" href="text/"><b>Text</b><span>Titel und Text eingeben, über die Bon-Post drucken. Geht auch vom Handy.</span></a>
  <a class="app" href="bild/"><b>Bild</b><span>Bild wählen, es wird direkt per USB gedruckt und danach gelöscht. Nur in Chrome am Mac.</span></a>
</main>
</body>
</html>
