const ALLE = Object.entries(SPRUECHE).flatMap(([k, l]) => l.map(t => ({ k, t })));

// «Französisch für den Keks»: ein Wort, das nach Glück, Basel oder Zvieri schmeckt
const WOERTER = [
  ['le bonheur', 'das Glück'], ['la flânerie', 'das Umherschlendern'], ['le goûter', 'das Zvieri'],
  ['la tartine', 'das Butterbrot'], ['l’éclaircie', 'die Aufhellung'], ['le clin d’œil', 'das Augenzwinkern'],
  ['le parapluie', 'der Regenschirm'], ['la marmotte', 'das Murmeltier'], ['le papillon', 'der Schmetterling'],
  ['la gourmandise', 'die Naschlust'], ['le coup de cœur', 'die Liebe auf den ersten Blick'], ['la grasse matinée', 'das Ausschlafen'],
  ['le rêve', 'der Traum'], ['la lueur', 'der Schimmer'], ['la douceur', 'die Sanftheit'], ['la sieste', 'das Nickerchen'],
  ['le fou rire', 'der Lachanfall'], ['la boussole', 'der Kompass'], ['l’étoile filante', 'die Sternschnuppe'],
  ['la luciole', 'das Glühwürmchen'], ['le chuchotement', 'das Flüstern'], ['le grenier', 'der Estrich'],
  ['la fête', 'das Fest'], ['le pique-nique', 'das Picknick'], ['le soupir', 'der Seufzer'], ['l’escargot', 'die Schnecke'],
  ['le tournesol', 'die Sonnenblume'], ['la confiture', 'die Konfitüre'], ['la rive', 'das Ufer'], ['le pont', 'die Brücke'],
  ['la péniche', 'das Rheinschiff'], ['la trottinette', 'das Trottinett'], ['le nuage', 'die Wolke'],
  ['l’arc-en-ciel', 'der Regenbogen'], ['la promenade', 'der Spaziergang'], ['la bise', 'das Küsschen (und der kalte Wind)'],
  ['le flocon', 'die Schneeflocke'], ['chouette !', 'super!'], ['volontiers', 'gern'], ['la rencontre', 'die Begegnung'],
  ['le hasard', 'der Zufall'], ['la veilleuse', 'das Nachtlicht'], ['le hérisson', 'der Igel'], ['la cerise', 'die Kirsche'],
  ['la gaufre', 'die Waffel'], ['le phare', 'der Leuchtturm'], ['l’amitié', 'die Freundschaft'], ['le souvenir', 'die Erinnerung'],
  ['la cabane', 'die Hütte'], ['le feu de camp', 'das Lagerfeuer'], ['la rêverie', 'die Träumerei'], ['doucement', 'sachte'],
  ['les retrouvailles', 'das Wiedersehen'], ['le câlin', 'die Umarmung'], ['la miette', 'der Krümel'], ['le biscuit', 'der Keks'],
  ['la chance', 'das Glück (beim Würfeln)'], ['le soleil', 'die Sonne'], ['la baignade', 'das Baden im Fluss'],
  ['le marché', 'der Markt'], ['la vitrine', 'das Schaufenster'], ['le tram', 'das Tram'], ['la fanfare', 'die Blaskapelle'],
];

// ---------------------------------------------------------------- Auswahl, ohne Wiederholung
const ZUFALL = n => crypto.getRandomValues(new Uint32Array(1))[0] % n;
const kennung = t => { let h = 2166136261; for (const c of t) h = Math.imul(h ^ c.codePointAt(0), 16777619); return (h >>> 0).toString(36); };
const GEDAECHTNIS = 120;   // so viele zuletzt gezeigte Sprüche merkt sich die Seite
let zuletzt = (() => { try { const a = JSON.parse(store.get('keks.zuletzt', '[]')); return Array.isArray(a) ? a : []; } catch { return []; } })();

let sorte = ['alle', 'w', 'h', 'x', 'b'].includes(store.get('keks.sorte', 'alle')) ? store.get('keks.sorte', 'alle') : 'alle';
let extra = ['alles', 'zahlen', 'nur'].includes(store.get('keks.extra', 'alles')) ? store.get('keks.extra', 'alles') : 'alles';
let anzahl = Math.min(MAX_KEKSE, Math.max(1, parseInt(store.get('keks.anzahl', '1'), 10) || 1));

// Nimmt Sprüche, die zuletzt nicht vorkamen. Ist die Sorte erschöpft, zählt nur noch die jüngere Vergangenheit.
function spruecheZiehen(n){
  const pool = sorte === 'alle' ? ALLE : ALLE.filter(s => s.k === sorte);
  const out = [];
  for (let i = 0; i < n; i++) {
    const schon = new Set(out.map(s => kennung(s.t)));
    let k = zuletzt.length, wahl = [];
    for (;;) {
      const sperre = new Set(zuletzt.slice(zuletzt.length - k));
      wahl = pool.filter(s => !schon.has(kennung(s.t)) && !sperre.has(kennung(s.t)));
      if (wahl.length || k === 0) break;
      k = k > 1 ? k >> 1 : 0;
    }
    if (!wahl.length) wahl = pool;   // mehr Kekse als Sprüche in der Sorte
    out.push(wahl[ZUFALL(wahl.length)]);
  }
  zuletzt = [...zuletzt.filter(h => !out.some(s => kennung(s.t) === h)), ...out.map(s => kennung(s.t))].slice(-GEDAECHTNIS);
  store.set('keks.zuletzt', JSON.stringify(zuletzt));
  return out;
}

// Sechs Glückszahlen aus 1 bis 42, wie beim Schweizer Lotto
function glueckszahlen(){
  const z = new Set();
  while (z.size < 6) z.add(1 + ZUFALL(42));
  return [...z].sort((a, b) => a - b);
}

function kekseBacken(){
  const sprueche = spruecheZiehen(anzahl);
  const woerter = [];
  return sprueche.map(s => {
    let w;
    do w = WOERTER[ZUFALL(WOERTER.length)]; while (woerter.includes(w) && woerter.length < WOERTER.length);
    woerter.push(w);
    return { spruch: s.t, zahlen: glueckszahlen(), wort: w };
  });
}

// ---------------------------------------------------------------- Setzen
// Zeilen gleichmässig verteilen: so schmal wie möglich, ohne eine Zeile mehr zu brauchen
function umbrechen(g, text, f, breite){
  g.font = f;
  const woerter = text.split(/\s+/).filter(Boolean);
  const brich = b => {
    const zeilen = []; let z = '';
    for (const w of woerter) {
      const probe = z ? z + ' ' + w : w;
      if (z && g.measureText(probe).width > b) { zeilen.push(z); z = w; } else z = probe;
    }
    if (z) zeilen.push(z);
    return zeilen;
  };
  let zeilen = brich(breite);
  if (zeilen.length > 1) {
    const n = zeilen.length;
    let lo = breite * 0.4, hi = breite;
    while (hi - lo > 4) { const m = (lo + hi) / 2; if (brich(m).length > n) lo = m; else hi = m; }
    zeilen = brich(hi);
  }
  return zeilen.map(t => ({ t, w: g.measureText(t).width }));
}

// Kleine Grossbuchstaben mit Sperrung, von Hand gesetzt (letterSpacing kann nicht jeder Browser auf der Leinwand)
function gesperrt(g, text, f, sp){
  g.font = f;
  const zeichen = [...text], ws = zeichen.map(c => g.measureText(c).width);
  return { zeichen, ws, w: ws.reduce((a, b) => a + b, 0) + sp * (zeichen.length - 1), sp, f };
}

function setzen(g, keks){
  const ops = [], mitte = BREITE / 2;
  let y = 6;
  // Kopf: Linie, Keks, Linie
  const ks = 84;
  ops.push({ art: 'keks', cx: mitte, cy: y + ks * 0.42, s: ks });
  for (const seite of [-1, 1]) {
    const innen = mitte + seite * (ks * 0.5 + 30), aussen = mitte + seite * 200;
    ops.push({ art: 'rect', x: Math.min(innen, aussen), y: Math.round(y + ks * 0.42) - 1, w: Math.abs(aussen - innen), h: 2 });
    ops.push({ art: 'raute', x: aussen + seite * 9, y: Math.round(y + ks * 0.42), r: 5 });
  }
  y += ks * 0.82 + 22;
  // Spruch, kursiv und zentriert
  const fs = F.serif(36), zh = 46;
  for (const z of umbrechen(g, keks.spruch, fs, INNEN - 16)) {
    ops.push({ art: 'text', t: z.t, x: mitte - z.w / 2, y: y + 34, f: fs });
    y += zh;
  }
  y += 6;
  if (extra === 'nur') return { ops, H: Math.ceil(y + 8) };
  // Trenner: drei kleine Rauten
  y += 14;
  for (const dx of [-22, 0, 22]) ops.push({ art: 'raute', x: mitte + dx, y, r: dx ? 3.5 : 5 });
  y += 20;
  const etikett = text => {
    const e = gesperrt(g, text, F.sans(15, 700), 4);
    ops.push({ art: 'gesperrt', ...e, x: mitte - e.w / 2, y: y + 14 });
    y += 24;
  };
  etikett('GLÜCKSZAHLEN');
  const zell = 70, fz = F.sans(32, 700);
  g.font = fz;
  keks.zahlen.forEach((n, i) => {
    const t = String(n), w = g.measureText(t).width;
    ops.push({ art: 'text', t, x: mitte + (i - 2.5) * zell - w / 2, y: y + 32, f: fz });
  });
  y += 44;
  if (extra === 'alles') {
    y += 14;
    etikett('FRANZÖSISCH FÜR DEN KEKS');
    const fw = F.serif(28), fd = F.sans(22, 500);
    g.font = fw; const ww = g.measureText(keks.wort[0]).width;
    const strich = '  –  ';
    g.font = fd; const sw = g.measureText(strich).width, dw = g.measureText(keks.wort[1]).width;
    if (ww + sw + dw <= INNEN) {
      let x = mitte - (ww + sw + dw) / 2;
      ops.push({ art: 'text', t: keks.wort[0], x, y: y + 28, f: fw }); x += ww;
      ops.push({ art: 'text', t: strich + keks.wort[1], x, y: y + 28, f: fd });
      y += 38;
    } else {
      ops.push({ art: 'text', t: keks.wort[0], x: mitte - ww / 2, y: y + 28, f: fw }); y += 36;
      ops.push({ art: 'text', t: keks.wort[1], x: mitte - dw / 2, y: y + 24, f: fd }); y += 32;
    }
  }
  return { ops, H: Math.ceil(y + 8) };
}

// ---------------------------------------------------------------- Zeichnen
// Der Glückskeks von der Seite: gefaltete Halbmondform mit Kniff in der Mitte und Zettel, der herausschaut
function keksZeichnen(g, cx, cy, s){
  const r = s / 2;
  g.save();
  g.lineJoin = 'round'; g.lineCap = 'round';
  // Aussenform als schwarze Fläche: runder Rücken, unten zwei Flügel mit dem Kniff dazwischen
  const ny = cy + r * 0.12;   // Kniff
  g.beginPath();
  g.moveTo(cx - r, cy + r * 0.38);
  g.bezierCurveTo(cx - r * 1.05, cy - r * 0.9, cx + r * 1.05, cy - r * 0.9, cx + r, cy + r * 0.38);
  g.bezierCurveTo(cx + r * 0.92, cy + r * 0.78, cx + r * 0.3, cy + r * 0.8, cx, ny);
  g.bezierCurveTo(cx - r * 0.3, cy + r * 0.8, cx - r * 0.92, cy + r * 0.78, cx - r, cy + r * 0.38);
  g.closePath();
  g.fillStyle = '#000'; g.fill();
  // Falz: weisser Bogen vom Kniff hinauf zum Rücken
  g.strokeStyle = '#fff'; g.lineWidth = Math.max(3, r * 0.09);
  g.beginPath(); g.moveTo(cx, ny); g.bezierCurveTo(cx - r * 0.18, cy - r * 0.15, cx - r * 0.05, cy - r * 0.42, cx + r * 0.12, cy - r * 0.5); g.stroke();
  // Der Zettel schaut aus dem Kniff heraus, schräg nach rechts unten
  g.translate(cx + r * 0.02, ny + r * 0.06); g.rotate(0.32);
  g.fillStyle = '#fff'; g.strokeStyle = '#000'; g.lineWidth = 3;
  g.beginPath(); g.rect(0, -r * 0.14, r * 1.25, r * 0.28); g.fill(); g.stroke();
  g.fillStyle = '#000';
  for (const dx of [0.42, 0.62, 0.82, 1.02]) g.fillRect(r * dx, -1.5, r * 0.12, 3);
  g.restore();
}

function raute(g, x, y, r){
  g.beginPath(); g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y); g.closePath(); g.fill();
}

async function schriftenLaden(text){
  await Promise.all([F.serif(20), F.sans(20, 500), F.sans(20, 700)].map(f => document.fonts.load(f, text).catch(() => {})));
}

// Einen Keks setzen, zeichnen und mit der festen Schwelle wie der Mac rastern: Die Vorschau ist der Druck
function zettel(keks){
  const c = document.createElement('canvas');
  const g = c.getContext('2d', { willReadFrequently: true });
  const { ops, H } = setzen(g, keks);
  c.width = BREITE; c.height = H;
  g.fillStyle = '#fff'; g.fillRect(0, 0, BREITE, H);
  g.fillStyle = '#000'; g.textBaseline = 'alphabetic';
  for (const o of ops) {
    if (o.art === 'rect') g.fillRect(Math.round(o.x), Math.round(o.y), Math.round(o.w), o.h);
    else if (o.art === 'raute') raute(g, o.x, o.y, o.r);
    else if (o.art === 'keks') keksZeichnen(g, o.cx, o.cy, o.s);
    else if (o.art === 'text') { g.font = o.f; g.fillText(o.t, o.x, o.y); }
    else if (o.art === 'gesperrt') { g.font = o.f; let x = o.x; o.zeichen.forEach((z, i) => { g.fillText(z, x, o.y); x += o.ws[i] + o.sp; }); }
    g.fillStyle = '#000';
  }
  const img = g.getImageData(0, 0, BREITE, H), px = img.data, bpr = BREITE >> 3, bits = new Uint8Array(bpr * H);
  for (let j = 0, i = 0; j < BREITE * H; j++, i += 4) {
    const schwarz = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2] < SCHWELLE;
    if (schwarz) bits[(j / BREITE | 0) * bpr + ((j % BREITE) >> 3)] |= 0x80 >> (j & 7);
    px[i] = px[i + 1] = px[i + 2] = schwarz ? 0 : 255;
  }
  g.putImageData(img, 0, 0);
  return { canvas: c, raster: { W: BREITE, H, bits } };
}

let kekse = [];   // [{ spruch, zahlen, wort, canvas, raster }] genau das, was die Vorschau zeigt

async function zeigen(){
  await schriftenLaden(kekse.map(k => k.spruch + ' ' + k.wort.join(' ')).join(' ') + ' GLÜCKSZAHLEN FRANZÖSISCH FÜR DEN KEKS 0123456789–');
  for (const k of kekse) Object.assign(k, zettel(k));
  const stapel = $('stapel');
  stapel.replaceChildren(...kekse.map((k, i) => {
    const p = document.createElement('div'); p.className = 'papier';
    k.canvas.setAttribute('aria-label', `Zettel ${i + 1}: ${k.spruch}`); k.canvas.setAttribute('role', 'img');
    p.append(k.canvas); return p;
  }));
  const cm = kekse.map(k => k.raster.H / 80 + 2);   // + etwa 2 cm Rand oben wegen dem Messer
  $('mass').textContent = kekse.length === 1 ? `Zettel etwa ${cm[0].toFixed(0)} cm lang`
    : `${kekse.length} Zettel, je etwa ${[...new Set([Math.min(...cm), Math.max(...cm)].map(x => x.toFixed(0)))].join('–')} cm`;
  $('drucken').textContent = kekse.length === 1 ? 'Keks drucken' : `${kekse.length} Kekse drucken`;
  $('neu').textContent = kekse.length === 1 ? 'Anderer Spruch' : 'Andere Sprüche';
}

let laeuft = Promise.resolve();
const neuBacken = () => (laeuft = laeuft.then(() => { kekse = kekseBacken(); return zeigen(); }));
// Nur das Kleingedruckte ändert sich, die Sprüche bleiben
const neuSetzen = () => (laeuft = laeuft.then(zeigen));

// ---------------------------------------------------------------- Einstellungen
function segment(id, wert, setze){
  const el = $(id);
  const mark = () => el.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === wert())));
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.dataset.v === wert()) return; setze(b.dataset.v); mark(); });
  mark();
}
segment('sorte', () => sorte, v => { sorte = v; store.set('keks.sorte', v); msg(''); neuBacken(); });
segment('extra', () => extra, v => { extra = v; store.set('keks.extra', v); neuSetzen(); });

function anzahlSetzen(n){
  n = Math.min(MAX_KEKSE, Math.max(1, n));
  if (n === anzahl && kekse.length === n) return;
  anzahl = n; store.set('keks.anzahl', String(n));
  $('anzahl').textContent = n; $('weniger').disabled = n <= 1; $('mehr').disabled = n >= MAX_KEKSE;
  laeuft = laeuft.then(() => {
    // Vorhandene Kekse behalten, nur ergänzen oder wegnehmen
    if (kekse.length > n) kekse = kekse.slice(0, n);
    else if (kekse.length < n) {
      const alt = anzahl; anzahl = n - kekse.length;
      const dazu = kekseBacken(); anzahl = alt;
      kekse = [...kekse, ...dazu];
    }
    return zeigen();
  });
}
$('weniger').addEventListener('click', () => anzahlSetzen(anzahl - 1));
$('mehr').addEventListener('click', () => anzahlSetzen(anzahl + 1));
$('anzahl').textContent = anzahl; $('weniger').disabled = anzahl <= 1; $('mehr').disabled = anzahl >= MAX_KEKSE;
$('neu').addEventListener('click', () => { msg(''); neuBacken(); });

// ---------------------------------------------------------------- 1-Bit-Raster -> Bon-HTML
// Der Mac rendert Bon-HTML mit Chrome auf 576 Punkte und macht es mit fester Schwelle schwarz-weiss.
// Ein fertig gerastertes 1-Bit-PNG in genau dieser Breite kommt so Punkt für Punkt unverändert an.
async function bonHtml(raster, canvas){
  const mm = (raster.H * 72 / raster.W).toFixed(3);   // feste Höhe: Der Mac misst den Bon, bevor das Bild geladen ist
  return `<img src="${await pngDataUrl(raster, canvas)}" style="display:block;width:72mm;height:${mm}mm;image-rendering:pixelated">`;
}

// Kleines 1-Bit-Graustufen-PNG (Weiss = 1), deutlich kleiner als ein Canvas-PNG
async function pngDataUrl({ W, H, bits }, canvas){
  if (!('CompressionStream' in window)) return canvas.toDataURL('image/png');
  const bpr = W >> 3, raw = new Uint8Array((bpr + 1) * H);
  for (let y = 0; y < H; y++) for (let i = 0; i < bpr; i++) raw[y * (bpr + 1) + 1 + i] = ~bits[y * bpr + i] & 255;
  const idat = new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate'))).arrayBuffer());
  const ihdr = new Uint8Array(13), v = new DataView(ihdr.buffer);
  v.setUint32(0, W); v.setUint32(4, H); ihdr[8] = 1;   // 1 Bit, Graustufen
  const blob = new Blob([Uint8Array.of(137, 80, 78, 71, 13, 10, 26, 10), chunk('IHDR', ihdr), chunk('IDAT', idat), chunk('IEND', new Uint8Array(0))], { type: 'image/png' });
  return new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = fail; r.readAsDataURL(blob); });
}

function chunk(type, data){
  const out = new Uint8Array(12 + data.length), v = new DataView(out.buffer);
  v.setUint32(0, data.length);
  for (let i = 0; i < 4; i++) out[4 + i] = type.charCodeAt(i);
  out.set(data, 8);
  v.setUint32(8 + data.length, crc32(out.subarray(4, 8 + data.length)));
  return out;
}

const CRC = Array.from({ length: 256 }, (_, n) => { for (let k = 0; k < 8; k++) n = n & 1 ? 0xedb88320 ^ (n >>> 1) : n >>> 1; return n >>> 0; });
function crc32(d){ let c = 0xffffffff; for (const b of d) c = CRC[(c ^ b) & 255] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }

// ---------------------------------------------------------------- Senden
// text/plain: einfache Anfrage ohne CORS-Preflight, Apps Script liest den Body trotzdem als JSON
async function bonpost(daten){
  const r = await fetch(BONPOST, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: KEY, ...daten }) });
  return r.json();
}

// Jeder Keks ist ein eigener Bon: Die Bon-Post druckt sie nacheinander, das Messer schneidet jeden ab
$('drucken').addEventListener('click', async () => {
  ['drucken', 'neu', 'weniger', 'mehr'].forEach(id => $(id).disabled = true);
  let gesendet = 0;
  try {
    await laeuft;   // sicher genau das drucken, was die Vorschau zeigt
    if (!kekse.length) throw new Error('kein Keks da');
    const n = kekse.length;
    for (const k of kekse) {
      msg(n === 1 ? 'Sende …' : `Sende ${gesendet + 1} von ${n} …`);
      const d = await bonpost({ inhalt: await bonHtml(k.raster, k.canvas), titel: n === 1 ? 'Glückskeks' : `Glückskeks ${gesendet + 1}/${n}`, quelle: 'website-glueckskeks' });
      if (!d.ok) throw new Error(d.fehler || 'unbekannter Fehler');
      gesendet++;
    }
    msg(n === 1 ? 'Gesendet. Der Keks kommt innert einer Minute.' : `Gesendet: ${n} Kekse. Sie kommen innert ein, zwei Minuten.`, 'ok');
    await neuBacken();   // der nächste Druck bringt neue Sprüche
  } catch (e) {
    msg((gesendet ? `${gesendet} gesendet, dann ` : '') + 'Fehler: ' + e.message, 'err');
    if (gesendet) { kekse = kekse.slice(gesendet); await neuSetzen(); }   // nur die fehlenden nochmals anbieten
  } finally {
    ['drucken', 'neu'].forEach(id => $(id).disabled = false);
    $('weniger').disabled = anzahl <= 1; $('mehr').disabled = anzahl >= MAX_KEKSE;
  }
});

neuBacken();
</script>
