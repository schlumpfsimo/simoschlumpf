name: Bon – Ölpreis

# Holt alle drei Stunden die Ölpreise für die Dépêche, siehe .github/scripts/bon-maerkte.mjs
on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bon-maerkte
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/bon-maerkte.mjs
      - name: Commit
        run: |
          git add bon/depeche/maerkte.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898333+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bon: Ölpreis'
          # Der Feed schreibt auch auf main: bei Bedarf nachziehen und nochmals versuchen
          for i in 1 2 3; do git push && exit 0; git pull --rebase; sleep 5; done
          exit 1
