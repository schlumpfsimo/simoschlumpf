<body>
<div id="lock">
  <svg class="stars" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <filter id="warp" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="n">
          <animate attributeName="baseFrequency" dur="14s" values="0.012 0.02;0.02 0.012;0.012 0.02" repeatCount="indefinite"/>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="46" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <symbol id="star" viewBox="-10 -10 20 20"><polygon points="0,-10 2.9,-4 9.5,-3.1 4.8,1.4 5.9,8.1 0,5 -5.9,8.1 -4.8,1.4 -9.5,-3.1 -2.9,-4" fill="#ffd617"/></symbol>
    </defs>
    <g id="ring" filter="url(#warp)" opacity="0.95" style="transform-origin:500px 350px"></g>
  </svg>
  <form id="lockform" autocomplete="off">
    <h1 class="title">TURBO</h1>
    <p class="sub">NATIONALRAT · BILATERALE III</p>
    <div class="code" id="code" role="group" aria-label="Zahlencode"><div class="cell cursor"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
    <input id="pw" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" aria-label="Zahlencode">
    <button type="submit" class="btn-open">Öffnen</button>
    <p class="err" id="lockerr"></p>
    <label class="rem"><input type="checkbox" id="remember" checked> auf diesem Gerät angemeldet bleiben</label>
  </form>
</div>

<div id="app">
  <header class="top">
    <div class="topbar">
      <div class="brand">TURBO<span>Nationalrat · Bilaterale III</span></div>
      <nav class="tabs" id="tabs"></nav>
      <span class="who" id="who" title="Name für den Änderungsverlauf"><span class="sync" id="syncdot"></span><span id="whoname">–</span></span>
      <button class="iconbtn" id="themebtn" title="Hell/Dunkel">◐</button>
      <button class="iconbtn" id="lockbtn" title="Sperren">⎋</button>
    </div>
  </header>
  <div class="banner hidden" id="banner"></div>
  <main id="main"></main>
  <nav class="bottom" id="bottomnav"></nav>
</div>
