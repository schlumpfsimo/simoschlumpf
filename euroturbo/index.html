<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Turbo – Nationalrat &amp; Bilaterale III</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%231d4ed8%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2736%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27700%27%3ET%3C/text%3E%3C/svg%3E">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Interaktive Datenbank der Mitglieder des Schweizer Nationalrats mit Kommissionen, Kontakten und Positionen zu den Bilateralen III.">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#1d4ed8; --accent-ink:#ffffff;
  --ja:#15803d; --ja-bg:#dcfce7; --eja:#4d7c0f; --eja-bg:#ecfccb; --offen:#6b7280; --offen-bg:#e5e7eb; --enein:#c2410c; --enein-bg:#ffedd5; --nein:#b91c1c; --nein-bg:#fee2e2;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 1px 8px rgba(0,0,0,.04);
  --radius:12px; --nav-h:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0f1115; --card:#171a21; --ink:#e5e7eb; --muted:#9ca3af; --line:#2a2f3a; --accent:#60a5fa; --accent-ink:#0b1220;
    --ja:#4ade80; --ja-bg:#14532d; --eja:#bef264; --eja-bg:#365314; --offen:#d1d5db; --offen-bg:#374151; --enein:#fdba74; --enein-bg:#7c2d12; --nein:#fca5a5; --nein-bg:#7f1d1d; }
}
:root[data-theme="dark"]{ --bg:#0f1115; --card:#171a21; --ink:#e5e7eb; --muted:#9ca3af; --line:#2a2f3a; --accent:#60a5fa; --accent-ink:#0b1220;
  --ja:#4ade80; --ja-bg:#14532d; --eja:#bef264; --eja-bg:#365314; --offen:#d1d5db; --offen-bg:#374151; --enein:#fdba74; --enein-bg:#7c2d12; --nein:#fca5a5; --nein-bg:#7f1d1d; }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem}
h1{font-size:1.4rem} h2{font-size:1.15rem;margin-top:1.25rem} h3{font-size:1rem}
.muted{color:var(--muted)} .small{font-size:.85rem}
/* ---------- lock ---------- */
#lock{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}
#lock form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;max-width:380px;width:100%;box-shadow:var(--shadow)}
#lock input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;font-size:1.1rem;letter-spacing:.2em;margin:10px 0}
#lock button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:600}
#lock .err{color:var(--nein);min-height:1.4em}
/* ---------- app shell ---------- */
#app{display:none}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) 0 0}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1280px;margin:0 auto}
.brand{font-weight:700;white-space:nowrap}
.brand span{color:var(--muted);font-weight:400}
nav.tabs{display:flex;gap:4px;margin-left:auto}
nav.tabs a{padding:8px 12px;border-radius:8px;color:var(--ink);font-weight:500;white-space:nowrap}
nav.tabs a.active{background:var(--accent);color:var(--accent-ink)}
nav.tabs a:hover{text-decoration:none}
.iconbtn{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px}
main{max-width:1280px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 24px)}
@media (min-width:900px){ main{padding-bottom:40px} }
nav.bottom{display:none}
@media (max-width:899px){
  nav.tabs{display:none}
  nav.bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
  nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;color:var(--muted);padding:4px 6px;border-radius:8px;min-width:56px}
  nav.bottom a.active{color:var(--accent)}
  nav.bottom a:hover{text-decoration:none}
  nav.bottom svg{width:22px;height:22px}
}
/* ---------- controls ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 14px}
.filterbtn{display:none}
@media (max-width:899px){ .filterbtn{display:inline-block} .toolbar.collapsible > .f{display:none} .toolbar.collapsible.open > .f{display:block} }
.toolbar input[type=search],.toolbar select,.inp{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-width:0}
.toolbar input[type=search]{flex:1 1 220px}
.toolbar select{flex:0 1 auto;max-width:100%}
.btn{padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.sm{padding:4px 10px;font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.78rem;background:var(--offen-bg);color:var(--ink);border:1px solid transparent;white-space:nowrap}
.chip.k{background:transparent;border-color:var(--line)}
.chip.lead{border-color:var(--accent);color:var(--accent)}
.chip.fr{color:#fff}
.st{font-weight:600}
.st.ja{background:var(--ja-bg);color:var(--ja)} .st.eher_ja{background:var(--eja-bg);color:var(--eja)} .st.offen{background:var(--offen-bg);color:var(--offen)} .st.eher_nein{background:var(--enein-bg);color:var(--enein)} .st.nein{background:var(--nein-bg);color:var(--nein)}
.st.override{outline:2px dashed currentColor;outline-offset:1px}
/* ---------- cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.card.person{display:grid;grid-template-columns:64px 1fr;gap:12px;cursor:pointer}
.card.person:hover{border-color:var(--accent)}
.avatar{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--offen-bg)}
.avatar.lg{width:120px;height:120px;border-radius:16px}
.pname{font-weight:600;font-size:1.02rem}
.psub{color:var(--muted);font-size:.85rem}
.section{margin-top:18px}
.kv{display:grid;grid-template-columns:minmax(120px,160px) 1fr;gap:4px 12px;font-size:.93rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
@media (max-width:520px){ .kv{grid-template-columns:1fr} .kv dt{margin-top:6px} }
.list{list-style:none;margin:0;padding:0}
.list li{padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;background:var(--card);border-radius:var(--radius);overflow:hidden}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{background:var(--bg);font-weight:600;position:sticky;top:0}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);max-height:75vh}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--offen-bg);margin:4px 0}
.bar div{height:100%}
.bar .ja{background:var(--ja)} .bar .eher_ja{background:var(--eja)} .bar .offen{background:var(--offen)} .bar .eher_nein{background:var(--enein)} .bar .nein{background:var(--nein)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px}
.phead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.phead .meta{flex:1 1 260px}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{padding:6px 0 10px 16px;position:relative}
.timeline li::before{content:"";position:absolute;left:-7px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.timeline .d{font-weight:600;font-size:.85rem}
.matrix td.cell{text-align:center;padding:4px;cursor:pointer;font-size:.75rem;font-weight:600;min-width:52px}
.matrix td.cell.ja{background:var(--ja-bg);color:var(--ja)} .matrix td.cell.eher_ja{background:var(--eja-bg);color:var(--eja)} .matrix td.cell.offen{background:var(--offen-bg);color:var(--offen)} .matrix td.cell.eher_nein{background:var(--enein-bg);color:var(--enein)} .matrix td.cell.nein{background:var(--nein-bg);color:var(--nein)}
.matrix td.cell.override{box-shadow:inset 0 0 0 2px currentColor}
.matrix th.rot{writing-mode:vertical-rl;transform:rotate(180deg);padding:10px 6px;font-size:.78rem;max-height:160px}
.matrix td.name{white-space:nowrap;position:sticky;left:0;background:var(--card);z-index:1}
.matrix th.name{position:sticky;left:0;z-index:2;background:var(--bg)}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:var(--card)}
summary{cursor:pointer;font-weight:600}
textarea.note{width:100%;min-height:80px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.popover{position:fixed;z-index:50;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.2);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:200px}
.popover button{text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:transparent}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;z-index:60;font-size:.9rem}
.counter{font-size:.85rem;color:var(--muted);margin-left:auto}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.stat .card{padding:10px 12px}
.stat .n{font-size:1.5rem;font-weight:700}
.warn{background:var(--enein-bg);color:var(--enein);padding:10px 12px;border-radius:10px;font-size:.88rem}
.srtable td:first-child{white-space:nowrap}
</style>
</head>
<body>
<div id="lock">
  <form id="lockform" autocomplete="off">
    <h1>Turbo</h1>
    <p class="muted small">Nationalrat · Kommissionen · Bilaterale III</p>
    <label for="pw" class="small">Passwort</label>
    <input id="pw" type="password" inputmode="numeric" autofocus aria-label="Passwort">
    <label class="small" style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" id="remember" checked> auf diesem Gerät angemeldet bleiben</label>
    <button type="submit">Öffnen</button>
    <p class="err" id="lockerr"></p>
  </form>
</div>

<div id="app">
  <header class="top">
    <div class="topbar">
      <div class="brand">Turbo <span>· Nationalrat &amp; Bilaterale III</span></div>
      <nav class="tabs" id="tabs"></nav>
      <button class="iconbtn" id="themebtn" title="Hell/Dunkel">◐</button>
      <button class="iconbtn" id="lockbtn" title="Sperren">⎋</button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="bottom" id="bottomnav"></nav>
</div>

<script>
'use strict';
/* ===================== Crypto / Unlock ===================== */
const PW_KEY = 'turbo.pw';
let DATA = null;
async function decryptBlob(buf, password){
  const dv = new DataView(buf);
  const hlen = dv.getUint32(0);
  const header = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, hlen)));
  const ct = new Uint8Array(buf, 4 + hlen);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const keyMat = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(header.salt), iterations: header.iter, hash: 'SHA-256' }, keyMat, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(header.iv) }, key, ct);
  let bytes = plain;
  if (header.gz) {
    if (!('DecompressionStream' in window)) throw new Error('Browser zu alt (DecompressionStream fehlt).');
    const ds = new DecompressionStream('gzip');
    bytes = await new Response(new Blob([plain]).stream().pipeThrough(ds)).arrayBuffer();
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
async function tryUnlock(password, remember){
  const res = await fetch('data.enc', { cache: 'no-cache' });
  if (!res.ok) throw new Error('Datendatei nicht gefunden (' + res.status + ').');
  const buf = await res.arrayBuffer();
  DATA = await decryptBlob(buf, password);
  try { (remember ? localStorage : sessionStorage).setItem(PW_KEY, password); } catch (e) {}
  document.getElementById('lock').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  boot();
}
document.getElementById('lockform').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('lockerr'); err.textContent = '';
  const btn = ev.target.querySelector('button'); btn.disabled = true; btn.textContent = 'Entschlüssle …';
  try { await tryUnlock(document.getElementById('pw').value.trim(), document.getElementById('remember').checked); }
  catch (e) { err.textContent = /OperationError|decrypt/i.test(String(e)) ? 'Falsches Passwort.' : ('Fehler: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'Öffnen'; }
});
(async () => {
  let saved = null; try { saved = localStorage.getItem(PW_KEY) || sessionStorage.getItem(PW_KEY); } catch (e) {}
  if (saved) { try { await tryUnlock(saved, !!localStorage.getItem(PW_KEY)); } catch (e) { try { localStorage.removeItem(PW_KEY); sessionStorage.removeItem(PW_KEY); } catch (_) {} } }
})();
document.getElementById('lockbtn').addEventListener('click', () => { try { localStorage.removeItem(PW_KEY); sessionStorage.removeItem(PW_KEY); } catch (e) {} location.reload(); });
document.getElementById('themebtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : (cur === 'light' ? '' : 'dark');
  if (next) document.documentElement.setAttribute('data-theme', next); else document.documentElement.removeAttribute('data-theme');
  try { localStorage.setItem('turbo.theme', next); } catch (e) {}
});
try { const t = localStorage.getItem('turbo.theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}

/* ===================== Helpers ===================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STANCE_LABEL = { ja: 'Ja', eher_ja: 'eher Ja', offen: 'offen', eher_nein: 'eher Nein', nein: 'Nein' };
const STANCE_SHORT = { ja: 'JA', eher_ja: 'eJ', offen: '?', eher_nein: 'eN', nein: 'NEIN' };
const STANCES = ['ja', 'eher_ja', 'offen', 'eher_nein', 'nein'];
const fmtDate = d => d ? d.split('-').reverse().join('.') : '';
const age = d => { if (!d) return ''; const b = new Date(d), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; };
const frColor = f => (DATA.fraktionen[f] || {}).farbe || '#888';
const frChip = m => `<span class="chip fr" style="background:${frColor(m.fraktion)}">${esc(m.partei)}</span>`;
let toastT; function toast(msg){ let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2200); }

/* ---- local overrides (Positionen & Notizen) ---- */
const OV_KEY = 'turbo.overrides', NOTE_KEY = 'turbo.notes';
const loadJ = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const saveJ = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('Speichern nicht möglich (Browser-Speicher).'); } };
let OVERRIDES = loadJ(OV_KEY, {}); let NOTES = loadJ(NOTE_KEY, {});
function effStance(m, f){ const o = OVERRIDES[m.id] && OVERRIDES[m.id][f]; return o ? { stance: o.stance, basis: 'manuell', override: true, note: o.note || '' } : { ...m.positionen[f], override: false }; }
function setOverride(mid, f, stance, note){ OVERRIDES[mid] ||= {}; if (stance === null) { delete OVERRIDES[mid][f]; if (!Object.keys(OVERRIDES[mid]).length) delete OVERRIDES[mid]; } else OVERRIDES[mid][f] = { stance, note: note || '', ts: new Date().toISOString() }; saveJ(OV_KEY, OVERRIDES); }

/* ---- aggregation ---- */
function aggregate(members, f){ const c = { ja: 0, eher_ja: 0, offen: 0, eher_nein: 0, nein: 0 }; for (const m of members) c[effStance(m, f).stance]++; return c; }
function barHtml(c){ const n = Object.values(c).reduce((a, b) => a + b, 0) || 1; return `<div class="bar" title="${esc(Object.entries(c).map(([k, v]) => STANCE_LABEL[k] + ': ' + v).join(', '))}">${STANCES.map(s => `<div class="${s}" style="width:${100 * c[s] / n}%"></div>`).join('')}</div>`; }
const legendHtml = () => `<div class="legend">${STANCES.map(s => `<span><i style="background:var(--${s.replace('_', '-') === 'eher-ja' ? 'eja' : s.replace('_', '-') === 'eher-nein' ? 'enein' : s})"></i>${STANCE_LABEL[s]}</span>`).join('')}<span><i style="border:2px dashed var(--muted);background:transparent"></i>manuell überschrieben</span></div>`;
function sumLine(c){ const pro = c.ja + c.eher_ja, con = c.nein + c.eher_nein; return `<span class="st chip ja">${pro} Ja/eher Ja</span> <span class="st chip offen">${c.offen} offen</span> <span class="st chip nein">${con} Nein/eher Nein</span>`; }

/* ===================== Routing ===================== */
const ROUTES = [
  { id: 'liste', label: 'Nationalrat', icon: '👥' },
  { id: 'kommissionen', label: 'Kommissionen', icon: '🏛' },
  { id: 'bilaterale', label: 'Bilaterale III', icon: '🇪🇺' },
  { id: 'positionen', label: 'Positionen', icon: '📊' },
  { id: 'info', label: 'Info', icon: 'ℹ' },
];
function navHtml(active){
  document.getElementById('tabs').innerHTML = ROUTES.map(r => `<a href="#/${r.id}" class="${active === r.id ? 'active' : ''}">${r.label}</a>`).join('');
  document.getElementById('bottomnav').innerHTML = ROUTES.map(r => `<a href="#/${r.id}" class="${active === r.id ? 'active' : ''}"><span style="font-size:20px">${r.icon}</span>${r.label}</a>`).join('');
}
function route(){
  const h = location.hash.replace(/^#\/?/, '') || 'liste';
  const [view, arg] = h.split('/');
  const main = document.getElementById('main');
  window.scrollTo(0, 0);
  if (view === 'person') { navHtml('liste'); renderPerson(main, +arg); }
  else if (view === 'kommission') { navHtml('kommissionen'); renderKommission(main, +arg); }
  else if (view === 'kommissionen') { navHtml(view); renderKommissionen(main); }
  else if (view === 'bilaterale') { navHtml(view); renderBilaterale(main); }
  else if (view === 'positionen') { navHtml(view); renderPositionen(main); }
  else if (view === 'info') { navHtml(view); renderInfo(main); }
  else { navHtml('liste'); renderListe(main); }
}
function boot(){ window.addEventListener('hashchange', route); route(); }

/* ===================== Liste ===================== */
const LIST_STATE = loadJ('turbo.list', { q: '', fr: '', kt: '', ko: '', fr_id: 'stab', st: '', sort: 'name', g: '' });
function renderListe(main){
  const D = DATA, S = LIST_STATE;
  const kantone = [...new Set(D.members.map(m => m.kanton))].sort();
  const komm = D.kommissionen.filter(k => k.typ === 'Ständig' || k.bilaterale).sort((a, b) => a.kurz.localeCompare(b.kurz));
  main.innerHTML = `
    <h1>Nationalrat <span class="muted small">${D.members.length} Mitglieder · Stand ${fmtDate((D.meta.quelleStand || '').slice(0, 10))}</span></h1>
    <div class="toolbar collapsible" id="ltb">
      <input type="search" id="q" placeholder="Suche: Name, Kanton, Partei, Kommission, Bürgerort, Beruf …" value="${esc(S.q)}">
      <button class="btn sm filterbtn" id="ftog">Filter ▾</button>
      <select class="f" id="fr"><option value="">Alle Fraktionen</option>${Object.entries(D.fraktionen).map(([k, v]) => `<option value="${k}" ${S.fr === k ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>
      <select class="f" id="kt"><option value="">Alle Kantone</option>${kantone.map(k => `<option ${S.kt === k ? 'selected' : ''}>${k}</option>`).join('')}</select>
      <select class="f" id="ko"><option value="">Alle Kommissionen</option>${komm.map(k => `<option value="${k.nr}" ${S.ko == k.nr ? 'selected' : ''}>${esc(k.kurz)} – ${esc(k.name)}</option>`).join('')}</select>

      <select class="f" id="fr_id" title="Angezeigte Frage">${D.bilaterale.fragen.map(f => `<option value="${f.id}" ${S.fr_id === f.id ? 'selected' : ''}>Position: ${esc(f.label)}</option>`).join('')}</select>

    <div class="grid" id="cards"></div>`;
  const apply = () => {
    const q = S.q.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    let list = D.members.filter(m => {
      if (S.fr && m.fraktion !== S.fr) return false;
      if (S.kt && m.kanton !== S.kt) return false;
      if (S.g && m.geschlecht !== S.g) return false;
      if (S.ko && !m.kommissionen.some(k => k.nr == S.ko)) return false;
      if (S.st && effStance(m, S.fr_id).stance !== S.st) return false;
      if (q) { const hay = norm([m.vorname, m.name, m.kanton, m.kantonName, m.partei, m.parteiName, m.fraktionName, m.kommissionen.map(k => k.kurz + ' ' + k.name).join(' '), m.buergerorte.join(' '), m.berufe.map(b => b.beruf + ' ' + (b.arbeitgeber || '')).join(' '), m.mitarbeitende.map(x => x.name).join(' ')].join(' ')); if (!q.split(/\s+/).every(w => hay.includes(w))) return false; }
      return true;
    });
    const key = { name: m => m.name + ' ' + m.vorname, kanton: m => m.kanton + m.name, fraktion: m => m.fraktion + m.name, position: m => STANCES.indexOf(effStance(m, S.fr_id).stance) + m.name }[S.sort];
    list.sort((a, b) => key(a).localeCompare(key(b), 'de'));

    document.getElementById('cards').innerHTML = list.map(m => {
      const p = effStance(m, S.fr_id);
      return `<a class="card person" href="#/person/${m.id}">

          <div class="chips" style="margin-top:6px">${m.kommissionen.filter(k => k.typ === 'Ständig').map(k => `<span class="chip k ${['APK-N','SPK-N','WAK-N','UREK-N','SGK-N','WBK-N','KVF-N','FK-N'].includes(k.kurz) ? 'lead' : ''}" title="${esc(k.name)} – ${esc(k.funktion)}">${esc(k.kurz)}${k.funktion !== 'Mitglied' ? ' ★' : ''}</span>`).join('')}</div>
          <div style="margin-top:6px"><span class="chip st ${p.stance} ${p.override ? 'override' : ''}">${STANCE_LABEL[p.stance]}</span> <span class="small muted">${esc(fq.label)}</span></div>
        </div></a>`;
    }).join('') || '<p class="muted">Keine Treffer.</p>';
    saveJ('turbo.list', S);
  };
  for (const id of ['q', 'fr', 'kt', 'ko', 'g', 'fr_id', 'st', 'sort']) document.getElementById(id).addEventListener('input', e => { S[id] = e.target.value; apply(); });
  document.getElementById('ftog').addEventListener('click', () => { const t = document.getElementById('ltb'); t.classList.toggle('open'); document.getElementById('ftog').textContent = t.classList.contains('open') ? 'Filter ▴' : 'Filter ▾'; });
  document.getElementById('reset').addEventListener('click', () => { Object.assign(S, { q: '', fr: '', kt: '', ko: '', st: '', sort: 'name', g: '' }); renderListe(main); });
  apply();
}

function vcard(m){
  const email = m.kontakt.find(c => c.typ === 'Email'), tel = m.kontakt.filter(c => /Natel|Telefon/.test(c.typ)), web = m.kontakt.find(c => c.typ === 'Homepage'), ad = m.adressen[0];
  const lines = ['BEGIN:VCARD', 'VERSION:3.0', `N:${m.name};${m.vorname};;;`, `FN:${m.vorname} ${m.name}`, `ORG:Nationalrat;${m.partei} ${m.kanton}`, `TITLE:Nationalrat/Nationalrätin (${m.partei}, ${m.kanton})`];
  if (email) lines.push(`EMAIL;TYPE=WORK:${email.wert}`);
  for (const t of tel) lines.push(`TEL;TYPE=${/Natel/.test(t.typ) ? 'CELL' : 'WORK'}:${t.wert}`);
  if (web) lines.push(`URL:${/^https?:/.test(web.wert) ? web.wert : 'https://' + web.wert}`);
  if (ad) lines.push(`ADR;TYPE=HOME:;;${ad.zeilen.join(', ')};${ad.ort};${ad.kanton || ''};${ad.plz || ''};Schweiz`);
  lines.push(`NOTE:Kommissionen: ${m.kommissionen.map(k => k.kurz).join(', ')}`, `PHOTO;VALUE=URI:${m.foto}`, 'END:VCARD');
  return lines.join('\r\n');
}
function linkify(c){
  const v = esc(c.wert);
  if (c.typ === 'Email') return `<a href="mailto:${v}">${v}</a>`;
  if (/Natel|Telefon/.test(c.typ)) return `<a href="tel:${v.replace(/\s/g, '')}">${v}</a>`;
  if (c.typ === 'Homepage' || /^(www\.|https?:)/i.test(c.wert)) return `<a href="${/^https?:/.test(c.wert) ? v : 'https://' + v}" target="_blank" rel="noopener">${v}</a>`;
  return v;
}

function openOverride(ev, m, f, after){

    <button data-s="__reset">Berechneten Wert verwenden</button><button data-s="__close">Schliessen</button>`;
  document.body.appendChild(pop);
  const r = ev.target.getBoundingClientRect();
  pop.style.left = Math.min(r.left, window.innerWidth - 240) + 'px';
  pop.style.top = Math.min(r.bottom + 6, window.innerHeight - pop.offsetHeight - 10) + 'px';
  pop.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const s = b.dataset.s;
    if (s === '__close') { pop.remove(); return; }
    if (s === '__reset') setOverride(m.id, f, null); else setOverride(m.id, f, s, pop.querySelector('#ovnote').value);
    pop.remove(); toast('Gespeichert (lokal)'); after();
  }));
  setTimeout(() => document.addEventListener('click', function h(e){ if (!pop.contains(e.target)) { pop.remove(); document.removeEventListener('click', h); } }), 0);
}

    <div class="stat">${Object.entries(byFr).sort((a, b) => b[1].length - a[1].length).map(([f, l]) => `<div class="card"><div class="n" style="color:${frColor(f)}">${l.length}</div><div class="small muted">${esc((D.fraktionen[f] || {}).name || f)}</div></div>`).join('')}</div>
    ${fragen.length ? `<div class="card"><h3>Voraussichtliche Mehrheiten in der ${esc(k.kurz)} (${ms.length} Mitglieder)</h3>${fragen.map(f => { const c = aggregate(ms, f.id); return `<div style="margin:8px 0"><b>${esc(f.label)}</b> <span class="small muted">(${f.kommission === k.kurz ? 'federführend' : 'Mitbericht'})</span>${barHtml(c)}${sumLine(c)}</div>`; }).join('')}${legendHtml()}</div>` : ''}
    <div class="tablewrap" style="margin-top:12px"><table class="t"><thead><tr><th>Mitglied</th><th>Fraktion</th><th>Kanton</th><th>Funktion</th>${fragen.map(f => `<th>${esc(f.label)}</th>`).join('')}</tr></thead>
      <tbody>${ms.sort((a, b) => order.indexOf(a.funktion) - order.indexOf(b.funktion) || a.fraktion.localeCompare(b.fraktion) || a.name.localeCompare(b.name)).map(m => `<tr><td><a href="#/person/${m.id}">${esc(m.vorname)} ${esc(m.name)}</a></td><td>${frChip(m)}</td><td>${esc(m.kanton)}</td><td>${esc(m.funktion)}</td>${fragen.map(f => { const p = effStance(m, f.id); return `<td><span class="chip st ${p.stance} ${p.override ? 'override' : ''}">${STANCE_LABEL[p.stance]}</span></td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ===================== Bilaterale ===================== */
function renderBilaterale(main){
  const D = DATA, B = D.bilaterale, G = B.geschaeft;
  main.innerHTML = `<h1>${esc(G.nummer)} – ${esc(G.titel)}</h1>
    <p class="small muted">${esc(G.typ)} · Erstrat ${esc(G.erstrat)} · Botschaft vom ${fmtDate(G.botschaft)} · Federführung NR: ${esc(G.federfuehrung_nr)}</p>
    <div class="card"><b>Stand:</b> ${esc(G.status)}<br><b>Behandlungsfrist NR:</b> ${esc(G.behandlungsfrist_nr)}
      <div class="chips" style="margin-top:8px">${Object.entries(G.links).map(([k, u]) => `<a class="chip k" href="${esc(u)}" target="_blank" rel="noopener">${esc(k.replace(/_/g, ' '))} ↗</a>`).join('')}</div></div>

    <h2>Voraussichtliche Mehrheiten im Nationalrat (200 Mitglieder)</h2>
    <div class="card">${B.fragen.map(f => { const c = aggregate(D.members, f.id); return `<div style="margin:10px 0"><b>${esc(f.label)}</b> <span class="small muted">· ${esc(f.frage)} · ${esc(f.kommission)}${f.mitbericht.length ? ' + ' + esc(f.mitbericht.join('/')) : ''}</span>${barHtml(c)}${sumLine(c)}</div>`; }).join('')}${legendHtml()}<p class="small muted">Einschätzungen, keine amtlichen Angaben. Details und manuelle Korrekturen unter «Positionen».</p></div>

    <h2>Entwürfe (Teilgeschäfte)</h2>
    ${B.entwuerfe.map(e => `<details><summary>Entwurf ${e.nr} · ${esc(e.kurz)} <span class="muted small">· ${esc(e.kategorie)} · ${esc(e.kommission_nr)}${e.mitbericht_nr.length ? ' + Mitbericht ' + esc(e.mitbericht_nr.join(', ')) : ''}</span></summary>
      <p><b>${esc(e.titel)}</b>${e.bbl ? ` <span class="muted small">(${esc(e.bbl)})</span>` : ''}</p>
      <dl class="kv">
        <dt>Inhalt</dt><dd>${esc(e.inhalt)}</dd>
        ${e.mitbericht_detail ? `<dt>Mitberichte</dt><dd>${esc(e.mitbericht_detail)}</dd>` : ''}
        <dt>Stand Nationalrat</dt><dd>${esc(e.status_nr)}</dd>
        <dt>Ständerat</dt><dd>${e.sr.datum ? esc(e.sr.datum) : '–'}${e.sr.eintreten ? ' · Eintreten ' + esc(e.sr.eintreten) : ''}${e.sr.gesamtabstimmung ? ' · Gesamtabstimmung ' + esc(e.sr.gesamtabstimmung) : ''}${e.sr.aenderungen.length ? '<ul class="small">' + e.sr.aenderungen.map(a => `<li>${esc(a)}</li>`).join('') + '</ul>' : ''}</dd>
        <dt>Referendum</dt><dd>${esc(e.referendum)}</dd>
      </dl></details>`).join('')}

    <h2>Fraktions- und Parteilinien (Basis der Einschätzung)</h2>
    <div class="tablewrap"><table class="t"><thead><tr><th>Fraktion/Partei</th>${B.fragen.map(f => `<th>${esc(f.label)}</th>`).join('')}<th>Quelle</th></tr></thead><tbody>
      ${[...Object.entries(B.fraktionslinien), ...Object.entries(B.parteilinien)].filter(([k]) => !k.startsWith('_')).map(([k, v]) => `<tr><td><b>${esc(k)}</b></td>${B.fragen.map(f => `<td><span class="chip st ${v[f.id] || 'offen'}">${STANCE_LABEL[v[f.id] || 'offen']}</span></td>`).join('')}<td class="small">${esc(v.quelle || '')}</td></tr>`).join('')}
    </tbody></table></div>

    <h2>Chronologie</h2>
    <ul class="timeline">${B.timeline.slice().sort((a, b) => b.datum.localeCompare(a.datum)).map(t => `<li><div class="d">${fmtDate(t.datum)} · ${esc(t.wer)}</div><div class="small">${esc(t.text)} ${t.url ? `<a href="${esc(t.url)}" target="_blank" rel="noopener">↗</a>` : ''}</div></li>`).join('')}</ul>

    <h2>Namentliche Abstimmungen des Nationalrats (als Indikator verwendet)</h2>
    <div class="tablewrap"><table class="t"><thead><tr><th>Datum</th><th>Geschäft</th><th>Deutung</th><th>Ergebnis</th></tr></thead><tbody>
      ${D.votes.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '')).map(v => `<tr><td>${fmtDate(v.date)}</td><td><a href="https://www.parlament.ch/de/ratsbetrieb/suche-curia-vista/geschaeft?AffairId=${esc(String(v.business || '').replace('.', ''))}" target="_blank" rel="noopener">${esc(v.label)}</a><div class="small muted">${esc(v.title || '')}${v.subject ? ' · ' + esc(v.subject) : ''}</div></td><td class="small">Ja = ${v.deutung === 'pro' ? 'EU-paketnah' : 'EU-skeptisch'} · Frage «${esc((B.fragen.find(f => f.id === v.thema) || {}).label || v.thema)}»</td><td class="small">${Object.entries(v.ergebnis).filter(([k]) => ['Ja', 'Nein', 'Enthaltung'].includes(k)).map(([k, n]) => `${k} ${n}`).join(' · ')}</td></tr>`).join('')}
    </tbody></table></div>

    <h2>Verwandte Geschäfte</h2>
    <ul class="list small">${B.verwandte.map(v => `<li><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.nummer)}</a> ${esc(v.titel)} <span class="muted">· ${esc(v.status)}</span></li>`).join('')}</ul>
    <h2>Quellen</h2>
    <ul class="list small">${B.quellen.map(q => `<li><a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.titel)} ↗</a></li>`).join('')}</ul>`;
}

/* ===================== Positionen (Matrix) ===================== */
const POS_STATE = loadJ('turbo.pos', { q: '', fr: '', ko: '' });
function renderPositionen(main){
  const D = DATA, S = POS_STATE, F = D.bilaterale.fragen;
  const komm = D.kommissionen.filter(k => k.bilaterale);
  main.innerHTML = `<h1>Positionsmatrix</h1>
    <p class="small muted">Klick auf eine Zelle, um die Einschätzung manuell zu setzen (lokal gespeichert, exportierbar). Umrandete Zellen sind manuell überschrieben.</p>
    <div class="toolbar">
      <input type="search" id="pq" placeholder="Name filtern …" value="${esc(S.q)}">
      <select id="pfr"><option value="">Alle Fraktionen</option>${Object.entries(D.fraktionen).map(([k, v]) => `<option value="${k}" ${S.fr === k ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select>
      <select id="pko"><option value="">Ganzer Nationalrat</option>${komm.map(k => `<option value="${k.nr}" ${S.ko == k.nr ? 'selected' : ''}>${esc(k.kurz)}</option>`).join('')}</select>
      <button class="btn sm" id="exp">Export CSV</button><button class="btn sm" id="expj">Export JSON (Überschreibungen)</button>
      <label class="btn sm" style="display:inline-block">Import JSON<input type="file" id="imp" accept="application/json" class="hidden"></label>
      <button class="btn sm" id="clr">Überschreibungen löschen</button>
      <span class="counter" id="pcount"></span>
    </div>
    ${legendHtml()}
    <div class="tablewrap" style="margin-top:10px"><table class="t matrix" id="mx"></table></div>`;
  const draw = () => {
    const q = S.q.trim().toLowerCase();
    let list = D.members.filter(m => (!S.fr || m.fraktion === S.fr) && (!S.ko || m.kommissionen.some(k => k.nr == S.ko)) && (!q || (m.vorname + ' ' + m.name + ' ' + m.kanton + ' ' + m.partei).toLowerCase().includes(q)));
    list.sort((a, b) => a.fraktion.localeCompare(b.fraktion) || a.name.localeCompare(b.name, 'de'));
    document.getElementById('pcount').textContent = `${list.length} Mitglieder`;
    const aggs = F.map(f => aggregate(list, f.id));
    document.getElementById('mx').innerHTML = `<thead><tr><th class="name">Mitglied</th><th>Fr.</th><th>Kt.</th>${F.map(f => `<th class="rot" title="${esc(f.frage)}">${esc(f.label)}</th>`).join('')}</tr>
      <tr><th class="name small">Σ Ja/eher Ja · offen · Nein/eher Nein</th><th></th><th></th>${aggs.map(c => `<th class="small" style="text-align:center;white-space:nowrap"><span style="color:var(--ja)">${c.ja + c.eher_ja}</span> · ${c.offen} · <span style="color:var(--nein)">${c.nein + c.eher_nein}</span></th>`).join('')}</tr></thead>
      <tbody>${list.map(m => `<tr><td class="name"><a href="#/person/${m.id}">${esc(m.name)} ${esc(m.vorname)}</a></td><td><span class="chip fr" style="background:${frColor(m.fraktion)}">${esc(m.partei)}</span></td><td>${esc(m.kanton)}</td>${F.map(f => { const p = effStance(m, f.id); return `<td class="cell ${p.stance} ${p.override ? 'override' : ''}" data-m="${m.id}" data-f="${f.id}" title="${esc(STANCE_LABEL[p.stance])} (${esc(p.basis)})${p.note ? ' – ' + esc(p.note) : ''}">${STANCE_SHORT[p.stance]}</td>`; }).join('')}</tr>`).join('')}</tbody>`;
    document.querySelectorAll('#mx td.cell').forEach(td => td.addEventListener('click', ev => openOverride(ev, D.members.find(m => m.id === +td.dataset.m), td.dataset.f, draw)));
    saveJ('turbo.pos', S);
  };
  document.getElementById('pq').addEventListener('input', e => { S.q = e.target.value; draw(); });
  document.getElementById('pfr').addEventListener('input', e => { S.fr = e.target.value; draw(); });
  document.getElementById('pko').addEventListener('input', e => { S.ko = e.target.value; draw(); });
  document.getElementById('exp').addEventListener('click', () => {
    const rows = [['Name', 'Vorname', 'Partei', 'Fraktion', 'Kanton', 'Kommissionen', 'E-Mail', ...F.map(f => f.label), ...F.map(f => f.label + ' (Basis)'), 'Notiz']];
    for (const m of D.members) rows.push([m.name, m.vorname, m.partei, m.fraktion, m.kanton, m.kommissionen.filter(k => k.typ === 'Ständig').map(k => k.kurz).join(' '), (m.kontakt.find(c => c.typ === 'Email') || {}).wert || '', ...F.map(f => STANCE_LABEL[effStance(m, f.id).stance]), ...F.map(f => effStance(m, f.id).basis), NOTES[m.id] || '']);
    const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g, '""') + '"').join(';')).join('\r\n');
    dl(new Blob([csv], { type: 'text/csv;charset=utf-8' }), 'turbo-positionen.csv');
  });
  document.getElementById('expj').addEventListener('click', () => dl(new Blob([JSON.stringify({ overrides: OVERRIDES, notes: NOTES, exportiert: new Date().toISOString() }, null, 1)], { type: 'application/json' }), 'turbo-ueberschreibungen.json'));
  document.getElementById('imp').addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()); if (j.overrides) { OVERRIDES = { ...OVERRIDES, ...j.overrides }; saveJ(OV_KEY, OVERRIDES); } if (j.notes) { NOTES = { ...NOTES, ...j.notes }; saveJ(NOTE_KEY, NOTES); } toast('Importiert'); draw(); } catch (err) { toast('Import fehlgeschlagen'); } });
  document.getElementById('clr').addEventListener('click', () => { if (confirm('Alle manuellen Überschreibungen auf diesem Gerät löschen?')) { OVERRIDES = {}; saveJ(OV_KEY, OVERRIDES); draw(); } });
  draw();
}
function dl(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

/* ===================== Info ===================== */
function renderInfo(main){
  const D = DATA;
  const nOv = Object.values(OVERRIDES).reduce((a, o) => a + Object.keys(o).length, 0);
  main.innerHTML = `<h1>Info</h1>
    <div class="card">
      <dl class="kv">
        <dt>Datenstand parlament.ch</dt><dd>${esc((D.meta.quelleStand || '').replace('T', ' ').slice(0, 16))} UTC</dd>
        <dt>Datei erstellt</dt><dd>${esc(D.meta.erstellt.replace('T', ' ').slice(0, 16))} UTC</dd>
        <dt>Mitglieder</dt><dd>${D.meta.anzahl}</dd>
        <dt>Lokale Überschreibungen</dt><dd>${nOv} Positionen · ${Object.keys(NOTES).filter(k => NOTES[k]).length} Notizen (nur in diesem Browser)</dd>
      </dl>
    </div>
    <div class="card section">
      <h3>Quellen</h3>
      <p class="small">Stammdaten, Kontakte, Adressen, Kommissionen, Interessenbindungen und persönliche Mitarbeitende stammen aus der öffentlichen OData-Schnittstelle des Parlaments (ws.parlament.ch) und sind identisch mit den Angaben auf parlament.ch. Fotos werden direkt von parlament.ch geladen.</p>
      <p class="small">Die Angaben zu Geschäft 26.023 stammen aus Curia Vista, den Medienmitteilungen der Kommissionen, der Zuteilung des Büros des Nationalrats (Stand 01.06.2026), der Sitzungsplanung der APK-N sowie den SDA-Berichten zur Ständeratsdebatte vom 28.09.–01.10.2026.</p>
      <h3>Einschätzung des Abstimmungsverhaltens</h3>
      <p class="small">Jede Frage (Teilgeschäft bzw. Streitpunkt) erhält pro Mitglied eine Einschätzung in fünf Stufen. Reihenfolge: (1) manuelle Überschreibung, (2) belegtes individuelles Signal (Vorstoss, Medienzitat, Kommissionsbeschluss), (3) Fraktions- oder Parteilinie, bei klar abweichendem namentlichem Abstimmungsverhalten um eine Stufe angepasst. Die Einschätzungen sind Arbeitshypothesen für die Kontaktarbeit, keine Prognosen.</p>
      <h3>Aktualisierung</h3>
      <p class="small">Im Repository unter <code>_turbo_src/</code>: <code>fetch_members.py</code>, <code>fetch_votes.py</code>, <code>build.mjs</code>. Signale in <code>signals.json</code>, Dossier in <code>bilaterale.json</code> pflegen, dann neu bauen.</p>
      <p class="small warn">Die Daten sind verschlüsselt abgelegt und werden erst nach Passworteingabe im Browser entschlüsselt. Es gibt keine Benutzerkonten; manuelle Änderungen bleiben lokal im Browser und können als JSON exportiert/importiert werden.</p>
    </div>`;
}
