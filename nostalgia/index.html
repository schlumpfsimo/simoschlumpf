<script type="module">
import * as THREE from 'three';

const D = window.BASEL;
const PI = Math.PI;
const touch = matchMedia('(pointer:coarse)').matches;

// ------------------------------------------------------------------ utils

const pairs = a => { const r = []; for (let i = 0; i < a.length - 1; i += 2) r.push([a[i], a[i + 1]]); return r; };

// ------------------------------------------------------------------ river
// Local metres: x east, z south, origin Oberer Rheinweg (47.5580 N, 7.5935 E).
const RIV = pairs(D.R);

// ------------------------------------------------------------------ terrain heights
// Grossbasel: Münsterhügel ~24 m above the water, falling to Schifflände and the Birsig valley.
const HILL = [[-90,170,24],[-60,128,23],[-140,118,23],[-20,220,23],[60,280,22],[120,330,18],[200,300,13],[300,300,7],[420,330,6],

// ------------------------------------------------------------------ textures (painted in code)

const TEX = {
  facade: canvasTex(64, (g, s) => {
    g.fillStyle = '#f1ece2'; g.fillRect(0, 0, s, s); grain(g, s, 18);
    g.fillStyle = '#7e8a74'; g.fillRect(14, 14, 8, 30); g.fillRect(42, 14, 8, 30);         // shutters
    g.fillStyle = '#e6dfd2'; g.fillRect(21, 12, 22, 34);                                     // frame
    g.fillStyle = '#3d4247'; g.fillRect(23, 14, 18, 30);                                     // glass
    g.fillStyle = '#5b636a'; g.fillRect(23, 14, 18, 6);
    g.fillStyle = '#e6dfd2'; g.fillRect(31, 14, 2, 30); g.fillRect(23, 27, 18, 2);
    g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(21, 46, 22, 2);
  }),
  plaster: canvasTex(64, (g, s) => { g.fillStyle = '#efe9de'; g.fillRect(0, 0, s, s); grain(g, s, 22, 5); }),
  roof: canvasTex(64, (g, s) => {
    g.fillStyle = '#e9ddd2'; g.fillRect(0, 0, s, s); grain(g, s, 26, 7);
    for (let y = 0; y < s; y += 8){ g.fillStyle = 'rgba(60,30,20,.35)'; g.fillRect(0, y, s, 2);
      for (let x = (y / 8) % 2 ? 4 : 0; x < s; x += 8){ g.fillStyle = 'rgba(60,30,20,.18)'; g.fillRect(x, y, 1, 8); } }
  }),
  stone: canvasTex(64, (g, s) => {
    g.fillStyle = '#ddd6ca'; g.fillRect(0, 0, s, s); grain(g, s, 30, 9);
    g.fillStyle = 'rgba(40,35,30,.35)';
    for (let y = 0; y < s; y += 11){ g.fillRect(0, y, s, 1.5); for (let x = (y % 22) ? 9 : 0; x < s; x += 18) g.fillRect(x, y, 1.5, 11); }
  }),
  sand: canvasTex(64, (g, s) => {
    g.fillStyle = '#c9776a'; g.fillRect(0, 0, s, s); grain(g, s, 26, 11);
    g.fillStyle = 'rgba(70,30,25,.3)';
    for (let y = 0; y < s; y += 8){ g.fillRect(0, y, s, 1); for (let x = (y % 16) ? 6 : 0; x < s; x += 13) g.fillRect(x, y, 1, 8); }
  }),
  sandWin: canvasTex(64, (g, s) => {
    g.fillStyle = '#c9776a'; g.fillRect(0, 0, s, s); grain(g, s, 26, 13);
    g.fillStyle = 'rgba(70,30,25,.3)'; for (let y = 0; y < s; y += 8) g.fillRect(0, y, s, 1);
    g.fillStyle = '#2f3134'; g.beginPath(); g.moveTo(22, 58); g.lineTo(22, 22); g.quadraticCurveTo(32, 4, 42, 22); g.lineTo(42, 58); g.fill();
    g.fillStyle = '#9b5a4e'; g.fillRect(31, 14, 2, 44);
  }),
  munster: canvasTex(128, (g, s) => {
    // glazed tiles in a lozenge pattern
    const cols = ['#c49a2c', '#3e6a43', '#2b2621', '#8d3b2d'];
    g.fillStyle = '#6d4a36'; g.fillRect(0, 0, s, s);
    const n = 8, w = s / n;
    for (let i = -1; i <= n; i++) for (let j = -1; j <= n * 2; j++){
      const cx = i * w + (j % 2 ? w / 2 : 0), cy = j * w / 2;
      g.fillStyle = cols[(((i + j) % 4) + 4) % 4 === 0 ? 0 : ((j % 2) ? 1 : (i % 2 ? 2 : 3))];
      g.beginPath(); g.moveTo(cx, cy - w / 2); g.lineTo(cx + w / 2, cy); g.lineTo(cx, cy + w / 2); g.lineTo(cx - w / 2, cy); g.fill();
    }

  }),
  ground: canvasTex(64, (g, s) => {
    g.fillStyle = '#e4dfd6'; g.fillRect(0, 0, s, s); grain(g, s, 34, 19);
    g.fillStyle = 'rgba(60,55,50,.12)';
    for (let i = 0; i < 40; i++){ const r = rng(i * 7 + 1); g.fillRect(r() * s, r() * s, 6, 1); }
  }),
  wood: canvasTex(32, (g, s) => { g.fillStyle = '#e8e2d8'; g.fillRect(0, 0, s, s); g.fillStyle = 'rgba(0,0,0,.25)'; for (let y = 0; y < s; y += 6) g.fillRect(0, y, s, 1); grain(g, s, 20, 23); }),
  ripple: canvasTex(128, (g, s) => {
    const d = g.createImageData(s, s);
    for (let y = 0; y < s; y++) for (let x = 0; x < s; x++){
      const n = vnoise(x / 6, y / 22) * .55 + vnoise(x / 2.5, y / 9) * .3 + vnoise(x / 1.2, y / 3) * .15;
      const i = (y * s + x) * 4; d.data[i] = d.data[i + 1] = d.data[i + 2] = n * 255; d.data[i + 3] = 255;

// ------------------------------------------------------------------ geometry builder

const GEO = {};

function signedArea(pts){ let s = 0; for (let i = 0; i < pts.length; i++){ const a = pts[i], b = pts[(i + 1) % pts.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; }

    const tx = lerp(best[0], cx, .18), tz = lerp(best[1], cz, .18), ty = southH(tx, tz);
    const sq = ngon(tx, tz, 4.6, 4, o.c ? Math.atan2(o.s, o.c) + PI / 4 : 0);

    pyramid(geo('roof'), sq, ty + 34, [tx, ty + 45, tz], lin('#6e4236'));

}

    const q = segNear(p[0], p[1], line[i], line[i + 1]), d = Math.hypot(p[0] - q[0], p[1] - q[1]);

  }

// ------------------------------------------------------------------ terrain

    let y, c;

// ------------------------------------------------------------------ input
const keys = {};
const ui = { sit: document.getElementById('sit'), mute: document.getElementById('mute'), zone: document.getElementById('zone'), help: document.getElementById('help'), stick: document.getElementById('stick'), intro: document.getElementById('intro') };
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyE') toggleSit(); if (e.code === 'KeyM') toggleMute(); if (started) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; });
const joy = { id: null, x: 0, y: 0, ox: 0, oy: 0 }, look = { id: null, lx: 0, ly: 0 };
let camYaw = 0, camPitch = .12, lookIdle = 0;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  if (!started) return;
  if (e.pointerType === 'touch' && e.clientX < innerWidth * .45 && joy.id === null){
    joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = joy.y = 0;
    ui.stick.style.display = 'block'; ui.stick.style.left = e.clientX + 'px'; ui.stick.style.top = e.clientY + 'px';
  } else if (look.id === null){ look.id = e.pointerId; look.lx = e.clientX; look.ly = e.clientY; }
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId === joy.id){
    let dx = (e.clientX - joy.ox) / 45, dy = (e.clientY - joy.oy) / 45; const l = Math.hypot(dx, dy); if (l > 1){ dx /= l; dy /= l; }
    joy.x = dx; joy.y = dy; ui.stick.firstChild.style.transform = `translate(${dx * 35}px,${dy * 35}px)`;
  } else if (e.pointerId === look.id){
    camYaw -= (e.clientX - look.lx) * .006; camPitch = clamp(camPitch + (e.clientY - look.ly) * .004, -.25, .6);
    look.lx = e.clientX; look.ly = e.clientY; lookIdle = 0;
  }
});
const up = e => { if (e.pointerId === joy.id){ joy.id = null; joy.x = joy.y = 0; ui.stick.style.display = 'none'; } if (e.pointerId === look.id) look.id = null; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
ui.sit.addEventListener('pointerdown', e => { e.stopPropagation(); toggleSit(); });
ui.mute.addEventListener('pointerdown', e => { e.stopPropagation(); toggleMute(); });

// ------------------------------------------------------------------ player state
const st = { mode: 'sit', yaw: 0, ph: 0, speed: 0, sitT: 0 };
{
  const p = bankPoint([65, -38], 6.5);
  player.position.set(p[0], northH(6.5), p[1]);
  st.yaw = Math.atan2(MU.cx - p[0], MU.cz - p[1]);
  camYaw = st.yaw;
}
function walkable(x, z){
  if (inRiver(x, z) || !isNorth(x, z)) return false;
  if (waterDist(x, z) < 0.7) return false;
  const n = polyNear([x, z], ORW); if (n.d > 24 || (n.end && n.d > 5)) return false;
  for (const b of NORTH_BLDG){
    let c = false;
    for (let i = 0, j = b.length - 1; i < b.length; j = i++){ const a = b[i], q = b[j]; if ((a[1] > z) !== (q[1] > z) && x < (q[0] - a[0]) * (z - a[1]) / (q[1] - a[1]) + a[0]) c = !c; }
    if (c) return false;
  }
  return true;
}
const canSit = () => { const d = waterDist(player.position.x, player.position.z); return d > 2.5 && d < 13; };
function toggleSit(){
  if (!started) return;
  if (st.mode === 'sit'){ st.mode = 'walk'; camYaw = st.yaw; }
  else if (canSit()){
    st.mode = 'sit'; st.sitT = 0;
    const [, q] = waterNear(player.position.x, player.position.z);
    const toM = Math.atan2(MU.cx - player.position.x, MU.cz - player.position.z), toW = Math.atan2(q[0] - player.position.x, q[1] - player.position.z);
    let d = toM - toW; d = Math.atan2(Math.sin(d), Math.cos(d)); st.yaw = toW + clamp(d, -.9, .9);
  }
}

// ------------------------------------------------------------------ zones, GTA style
const ZONES = [[-110, 'Mittlere Brücke'], [10, 'Oberer Rheinweg'], [95, 'Münsterfähri'], [215, 'Oberer Rheinweg'], [999, 'Wettsteinbrücke']];
let zoneNow = '', zoneTimer = 0;
function zoneAt(x){ for (const [lim, n] of ZONES) if (x < lim) return n; return ''; }
function showZone(n){ ui.zone.textContent = n; ui.zone.classList.add('on'); clearTimeout(zoneTimer); zoneTimer = setTimeout(() => ui.zone.classList.remove('on'), 3500); }

// ------------------------------------------------------------------ sound
let AC = null, master = null, muted = true, river = null;
function initAudio(){
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = 0; master.connect(AC.destination);
  const buf = AC.createBuffer(1, AC.sampleRate * 4, AC.sampleRate), d = buf.getChannelData(0);
  let b = 0; for (let i = 0; i < d.length; i++){ b = (b + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = b * 3.5; }
  const wbuf = AC.createBuffer(1, AC.sampleRate * 3, AC.sampleRate), wd = wbuf.getChannelData(0);
  for (let i = 0; i < wd.length; i++) wd[i] = Math.random() * 2 - 1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
  river = AC.createGain(); river.gain.value = .5;
  src.connect(lp).connect(river).connect(master); src.start();
  const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = .07; lg.gain.value = 140; lfo.connect(lg).connect(lp.frequency); lfo.start();
  // lapping near the bank
  const ws = AC.createBufferSource(); ws.buffer = wbuf; ws.loop = true;
  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = .8;
  const lap = AC.createGain(); lap.gain.value = 0; ws.connect(bp).connect(lap).connect(master); ws.start();
  const lfo2 = AC.createOscillator(), lg2 = AC.createGain(); lfo2.frequency.value = .31; lg2.gain.value = .018; lfo2.connect(lg2).connect(lap.gain); lfo2.start();
  river.userData = { lap };
  // a little room for the bells
  const dl = AC.createDelay(1); dl.delayTime.value = .23; const fb = AC.createGain(); fb.gain.value = .35; const wet = AC.createGain(); wet.gain.value = .5;
  const bus = AC.createGain(); bus.connect(master); bus.connect(dl); dl.connect(fb).connect(dl); dl.connect(wet).connect(master);
  AC.bus = bus;
  scheduleBells(8); scheduleSwifts(5);
}
function bell(t, f, g = .06){
  for (const [m, a, dec] of [[.5, .5, 7], [1, 1, 5], [1.2, .5, 3.5], [1.5, .35, 3], [2, .4, 2.5], [2.6, .2, 1.8], [3.0, .15, 1.4]]){
    const o = AC.createOscillator(), v = AC.createGain(); o.frequency.value = f * m;
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g * a, t + .01); v.gain.exponentialRampToValueAtTime(.0001, t + dec);
    o.connect(v).connect(AC.bus); o.start(t); o.stop(t + dec + .1);
  }
}
function scheduleBells(delay){
  setTimeout(() => {
    if (AC){ const n = 2 + Math.floor(Math.random() * 4), f = Math.random() < .5 ? 233 : 196;
      for (let i = 0; i < n; i++) bell(AC.currentTime + i * 2.6, f, .05); }
    scheduleBells(45 + Math.random() * 60);
  }, delay * 1000);
}
function tramBell(){
  if (!AC || muted) return;
  for (const dt of [0, .22]) bell(AC.currentTime + dt, 1350, .012);
}
function scheduleSwifts(delay){
  setTimeout(() => {
    if (AC){
      // Mauersegler: a ragged burst of high screams
      let t = AC.currentTime; const n = 4 + Math.floor(Math.random() * 7);
      for (let i = 0; i < n; i++){
        const o = AC.createOscillator(), v = AC.createGain(), f = 5200 + Math.random() * 1800; o.type = 'sawtooth';
        o.frequency.setValueAtTime(f, t); o.frequency.linearRampToValueAtTime(f * .78, t + .16);
        const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 45; lg.gain.value = 600; lfo.connect(lg).connect(o.frequency);
        const hp = AC.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 5600; hp.Q.value = 2;
        v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(.006, t + .02); v.gain.linearRampToValueAtTime(0, t + .17);
        o.connect(hp).connect(v).connect(master); o.start(t); o.stop(t + .2); lfo.start(t); lfo.stop(t + .2);
        t += .07 + Math.random() * .16;
      }
    }
    scheduleSwifts(9 + Math.random() * 22);
  }, delay * 1000);
}
function toggleMute(){
  if (!AC) initAudio();
  muted = !muted; AC.resume();
  master.gain.setTargetAtTime(muted ? 0 : .9, AC.currentTime, .6);
  ui.mute.textContent = muted ? 'Ton an' : 'Ton aus';
}

// ------------------------------------------------------------------ resize
let W = 0, H = 0;
function resize(){
  const pr = Math.min(window.devicePixelRatio || 1, clamp(560 / innerHeight, .45, 1));
  renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight, false);
  W = Math.round(innerWidth * pr); H = Math.round(innerHeight * pr);
  for (const r of [rtScene, ...rtAcc]) r.setSize(W, H);
  outMat.uniforms.uRes.value.set(W, H);
  camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 68 : 52; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ------------------------------------------------------------------ start
let started = false;
document.getElementById('go').textContent = touch ? 'Antippen zum Beginnen' : 'Klicken zum Beginnen';
ui.intro.addEventListener('pointerdown', () => {
  if (started) return; started = true;
  ui.intro.classList.add('hide');
  toggleMute();
  ui.sit.style.display = 'block';
  ui.help.innerHTML = touch ? 'Links ziehen: gehen · rechts ziehen: Blick' : 'WASD / Pfeile: gehen · Shift: rennen · Maus ziehen: Blick<br>E: sitzen / aufstehen · M: Ton';
  ui.help.classList.add('on'); setTimeout(() => ui.help.classList.remove('on'), 9000);
});

// ------------------------------------------------------------------ loop
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), tmp = new THREE.Vector3();
let first = true, T = 0;
const MU_LOOK = new THREE.Vector3(MU.cx, MU.y + 18, MU.cz);
function update(dt){
  T += dt;
  // --- player
  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp) iz += 1; if (keys.KeyS || keys.ArrowDown) iz -= 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1; if (keys.KeyD || keys.ArrowRight) ix += 1;
  ix += joy.x; iz -= joy.y;
  const il = Math.hypot(ix, iz);
  if (started && st.mode === 'sit' && il > .2){ st.mode = 'walk'; camYaw = st.yaw; }
  const run = keys.ShiftLeft || keys.ShiftRight || il > .95 && joy.id !== null;
  if (st.mode !== 'sit' && il > .1){
    const fx = Math.sin(camYaw), fz = Math.cos(camYaw), k = Math.min(il, 1) / il;
    const mx = (fx * iz - fz * ix) * k, mz = (fz * iz + fx * ix) * k;
    const sp = run ? 4.6 : 1.7, target = Math.atan2(mx, mz);
    let d = target - st.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); st.yaw += d * Math.min(1, dt * 9);
    st.speed = lerp(st.speed, sp * Math.min(il, 1), Math.min(1, dt * 6));
    const nx = player.position.x + mx * st.speed * dt, nz = player.position.z + mz * st.speed * dt;
    if (walkable(nx, nz)){ player.position.x = nx; player.position.z = nz; }
    else if (walkable(nx, player.position.z)) player.position.x = nx;
    else if (walkable(player.position.x, nz)) player.position.z = nz;
    st.ph += dt * st.speed * 3.6;
    st.mode = run ? 'run' : 'walk';
    if (look.id === null) lookIdle += dt;
    if (lookIdle > 1.2){ let dy = st.yaw - camYaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); camYaw += dy * Math.min(1, dt * 1.2); }
  } else if (st.mode !== 'sit'){ st.speed = 0; st.ph = 0; st.mode = 'walk'; }
  player.position.y = lerp(player.position.y, northH(waterDist(player.position.x, player.position.z)), Math.min(1, dt * 10));
  player.rotation.y = st.yaw;
  pose(player, st.mode === 'sit' ? 'sit' : st.mode, st.ph);
  ui.sit.textContent = st.mode === 'sit' ? 'Aufstehen' : 'Sitzen';
  ui.sit.style.opacity = st.mode === 'sit' || canSit() ? 1 : .35;
  const z = zoneAt(player.position.x); if (started && z !== zoneNow){ zoneNow = z; showZone(z); }

  // --- camera
  const head = tmp.set(player.position.x, player.position.y + 1.45, player.position.z);
  let wantPos, wantLook;
  if (st.mode === 'sit'){
    st.sitT += dt;
    // a slow drift between an over-the-shoulder view of the Münster and his profile
    const f = [Math.sin(st.yaw), Math.cos(st.yaw)], r = [-f[1], f[0]];
    const th = .45 + (1 - Math.cos(st.sitT * 2 * PI / 70)) * .5 * 1.05 + (look.id !== null || lookIdle < 4 ? 0 : 0);
    const R = 3.1 + (1 - Math.cos(st.sitT * 2 * PI / 70)) * .3;
    const dir = [-f[0] * Math.cos(th) + r[0] * Math.sin(th), -f[1] * Math.cos(th) + r[1] * Math.sin(th)];
    wantPos = new THREE.Vector3(head.x + dir[0] * R, head.y - .15 + (th - .45) * .2, head.z + dir[1] * R);
    const k = smooth(clamp((th - .45) / 1.05, 0, 1)) * .93;
    const dM = MU_LOOK.clone().sub(wantPos).normalize(), dH = new THREE.Vector3(head.x + f[0] * .6, head.y - .1, head.z + f[1] * .6).sub(wantPos).normalize();
    wantLook = wantPos.clone().add(dM.lerp(dH, k).normalize().multiplyScalar(20));
    wantLook.y -= (1 - k) * 1.2;
  } else {
    const d = 5.2;
    wantPos = new THREE.Vector3(head.x - Math.sin(camYaw) * d * Math.cos(camPitch), head.y + .5 + Math.sin(camPitch) * d, head.z - Math.cos(camYaw) * d * Math.cos(camPitch));
    wantLook = new THREE.Vector3(head.x + Math.sin(camYaw) * 4, head.y - .2, head.z + Math.cos(camYaw) * 4);
    const gy = groundH(wantPos.x, wantPos.z); if (wantPos.y < gy + .6) wantPos.y = gy + .6;
  }
  const k = first ? 1 : Math.min(1, dt * (st.mode === 'sit' ? 1.6 : 5));
  camPos.lerp(wantPos, k); camLook.lerp(wantLook, k); first = false;
  camera.position.copy(camPos); camera.lookAt(camLook);
  const fov = (innerWidth < innerHeight ? 68 : 52) - (st.mode === 'sit' ? (innerWidth < innerHeight ? 18 : 16) : 0);
  if (Math.abs(camera.fov - fov) > .01){ camera.fov = lerp(camera.fov, fov, first ? 1 : Math.min(1, dt * 1.5)); camera.updateProjectionMatrix(); }

  // --- sun & shadow follow the player (snapped to texels)
  const snap = 220 / 2048, sx = Math.round(player.position.x / snap) * snap, sz = Math.round(player.position.z / snap) * snap;
  sun.target.position.set(sx, 5, sz); sun.position.set(sx + SUN.x * 300, 5 + SUN.y * 300, sz + SUN.z * 300);

  // --- the ferry: across, pause, back
  const cyc = 140, tt = T % cyc, half = cyc / 2;
  let fp = tt < half ? clamp((tt - 12) / (half - 12), 0, 1) : 1 - clamp((tt - half - 12) / (half - 12), 0, 1);
  fp = smooth(fp);
  const going = tt < half;
  const fx = lerp(FERRY.A[0], FERRY.B[0], fp), fz = lerp(FERRY.A[1], FERRY.B[1], fp);
  const bow = Math.atan2(FERRY.u[0], FERRY.u[1]) + (going ? 1 : -1) * .55;  // nosed into the current
  ferry.position.set(fx, .05 + Math.sin(T * 1.3) * .04, fz); ferry.rotation.y = bow + PI / 2;
  const cA = FERRY.cA, cB = FERRY.cB, ca = new THREE.Vector3(...cA), cb = new THREE.Vector3(...cB);
  const pul = ca.clone().lerp(cb, clamp(fp * .96 + .02, 0, 1));
  const rp = rope.geometry.attributes.position; rp.setXYZ(0, pul.x, pul.y, pul.z); rp.setXYZ(1, fx, 2.3, fz); rp.needsUpdate = true;

  // --- trams
  for (const tr of trams){
    const per = 95, p = ((T / per + tr.phase) % 1), B = tr.B;
    const s = tr.dir > 0 ? p : 1 - p, t = lerp(-40, B.len + 40, s);
    const c = B.at(clamp(t, 0, B.len), tr.dir * 3.2);
    tr.t.visible = t > -10 && t < B.len + 10;
    tr.t.position.set(c[0], B.y(clamp(t, 0, B.len)) - (B === BRIDGES.mittlere ? .9 : 0), c[1]);
    tr.t.rotation.y = -Math.atan2(B.dir[1], B.dir[0]);
    if (p < .03 && !tr.rang){ tr.rang = true; tramBell(); } if (p > .5) tr.rang = false;
  }
  // --- swimmers drift downstream
  for (const s of swimmers){
    const dd = ((T * 1.25 + s.userData.f * swimLen) % swimLen);
    const [x, zz, a] = alongLine(swimLine, dd);
    s.position.set(x + Math.cos(a) * s.userData.off, Math.sin(T * 2 + s.userData.f * 9) * .04, zz - Math.sin(a) * s.userData.off);
    s.rotation.y = a;
  }
  for (const g of gulls){
    const u = g.userData, a = T * u.sp + u.ph;
    g.position.set(u.c[0] + Math.cos(a) * u.r, u.h + Math.sin(T * .7 + u.ph) * 2, u.c[1] + Math.sin(a) * u.r);
    g.rotation.set(0, -a, Math.sin(T * 5 + u.ph) * .35);
  }
  water.material.uniforms.uTime.value = T;

  // --- sound: lapping louder near the water
  if (AC && river){ const d = waterDist(player.position.x, player.position.z); river.userData.lap.gain.setTargetAtTime(clamp(1 - d / 14, 0, 1) * .05, AC.currentTime, .5); }
}
let rtI = 0;
function frame(){
  const dt = Math.min(clock.getDelta(), .1);
  update(dt);
  renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
  quad.material = accMat; accMat.uniforms.tCur.value = rtScene.texture; accMat.uniforms.tPrev.value = rtAcc[rtI].texture;
  accMat.uniforms.k.value = st.mode === 'sit' ? .3 : .45;
  renderer.setRenderTarget(rtAcc[1 - rtI]); renderer.render(post.scene, post.cam);
  quad.material = outMat; outMat.uniforms.tSrc.value = rtAcc[1 - rtI].texture; outMat.uniforms.uTime.value = T;
  renderer.setRenderTarget(null); renderer.render(post.scene, post.cam);
  rtI = 1 - rtI;
  requestAnimationFrame(frame);
}
frame();
window.__ready = true; window.__st = st;
</script>
</body>
