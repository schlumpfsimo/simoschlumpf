<!doctype html>
<html lang="de">
<head>

<title>Nostalgia – Basel, Oberer Rheinweg</title>
<meta name="description" content="Ein Sommerabend am Kleinbasler Rheinbord, gegenüber dem Münster.">
<style>
  html,body{margin:0;height:100%;background:#1b1a18;overflow:hidden;touch-action:none;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh;image-rendering:auto}
  #intro{position:fixed;inset:0;cursor:pointer;background:rgba(20,18,15,.35);transition:opacity 2.2s}
  #intro h1{margin:0;font:600 clamp(40px,8vw,92px)/.95 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.02em}
  #intro p{margin:.9em 0 0;font-size:clamp(14px,1.6vw,18px);opacity:.85;max-width:46ch;line-height:1.45}
  #intro .go{margin-top:1.6em;font-size:13px;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
  #intro.hide{opacity:0;pointer-events:none}
  #zone{position:fixed;right:clamp(16px,4vw,48px);bottom:clamp(70px,12vh,120px);color:#e9eef2;
    font:italic 700 clamp(22px,3.4vw,38px)/1 Georgia,"Times New Roman",serif;letter-spacing:.01em;
    -webkit-text-stroke:1.5px #111;paint-order:stroke fill;text-shadow:2px 2px 0 #111;
    opacity:0;transition:opacity 1.2s;pointer-events:none}
  #zone.on{opacity:0}
  #help{position:fixed;left:16px;top:14px;color:#f3ead8;font-size:12px;opacity:.0;transition:opacity 1.5s;
    text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;line-height:1.5}
  #help.on{opacity:0}
  .btn{position:fixed;border:1.5px solid rgba(243,234,216,.7);color:#f3ead8;background:rgba(20,18,15,.25);
    font:600 12px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;
    padding:12px 16px;border-radius:2px;display:none}
  #sit{right:16px;bottom:16px}
  #mute{display:none}
  #stick{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border:1.5px solid rgba(243,234,216,.5);
    border-radius:50%;display:none;pointer-events:none}
  #stick i{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
    background:rgba(243,234,216,.55)}
  #credit{position:fixed;left:16px;bottom:10px;color:#f3ead8;opacity:.45;font-size:10px;pointer-events:auto}
  #credit a{color:inherit}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#f3ead8;padding:24px;text-align:center}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/SkeletonUtils.js';

const D = window.BASEL, DBG = new URLSearchParams(location.search);
const COLL = { circles: [], boxes: [] };   // [x, z, r] and [cx, cz, halfW, halfL, yaw]

const PI = Math.PI;
const touch = matchMedia('(pointer:coarse)').matches;

// ------------------------------------------------------------------ utils
function rng(seed){ return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
const rand = rng(1979);
const pairs = a => { const r = []; for (let i = 0; i < a.length - 1; i += 2) r.push([a[i], a[i + 1]]); return r; };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = t => t * t * (3 - 2 * t);
const lin = hex => { const c = new THREE.Color(hex); return [c.r, c.g, c.b]; };
function hash2(x, z){ const s = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, z){
  const ix = Math.floor(x), iz = Math.floor(z), fx = smooth(x - ix), fz = smooth(z - iz);
  return lerp(lerp(hash2(ix, iz), hash2(ix + 1, iz), fx), lerp(hash2(ix, iz + 1), hash2(ix + 1, iz + 1), fx), fz);
}

// ------------------------------------------------------------------ river
// Local metres: x east, z south, origin Oberer Rheinweg (47.5580 N, 7.5935 E).
const RIV = pairs(D.R);
const SEGS = RIV.map((a, i) => [a, RIV[(i + 1) % RIV.length]]);
const RIV_CCW = RIV.reduce((s, a, i) => { const b = RIV[(i + 1) % RIV.length]; return s + a[0] * b[1] - b[0] * a[1]; }, 0) > 0;
const BK = 24, buckets = new Map();
for (const s of SEGS){
  const [a, b] = s;
  for (let x = Math.floor(Math.min(a[0], b[0]) / BK); x <= Math.floor(Math.max(a[0], b[0]) / BK); x++)
    for (let z = Math.floor(Math.min(a[1], b[1]) / BK); z <= Math.floor(Math.max(a[1], b[1]) / BK); z++){
      const k = x + ',' + z; if (!buckets.has(k)) buckets.set(k, []); buckets.get(k).push(s);
    }
}
const bands = new Map();
for (const s of SEGS){
  const [a, b] = s;
  for (let z = Math.floor(Math.min(a[1], b[1]) / 8); z <= Math.floor(Math.max(a[1], b[1]) / 8); z++){
    if (!bands.has(z)) bands.set(z, []); bands.get(z).push(s);
  }
}
function inRiver(x, z){
  const l = bands.get(Math.floor(z / 8)); if (!l) return false;
  let c = false;
  for (const [a, b] of l) if ((a[1] > z) !== (b[1] > z) && x < (b[0] - a[0]) * (z - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
  return c;
}
function segNear(px, pz, a, b){
  const dx = b[0] - a[0], dz = b[1] - a[1], L = dx * dx + dz * dz;
  const t = L ? clamp(((px - a[0]) * dx + (pz - a[1]) * dz) / L, 0, 1) : 0;
  return [a[0] + t * dx, a[1] + t * dz];
}
// distance to the river edge (capped), plus the nearest edge point
function waterNear(x, z){
  const bx = Math.floor(x / BK), bz = Math.floor(z / BK);
  let best = 60, q = null;
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++){
    const l = buckets.get((bx + i) + ',' + (bz + j)); if (!l) continue;
    for (const [a, b] of l){ const p = segNear(x, z, a, b), d = Math.hypot(x - p[0], z - p[1]); if (d < best){ best = d; q = p; } }
  }
  return [best, q];
}
const waterDist = (x, z) => waterNear(x, z)[0];
// river axis: land with z below the axis is Kleinbasel
const AX = [[-900, -760], [-450, -380], [-300, -240], [0, -7], [400, 190], [900, 435]];
function axisZ(x){
  for (let i = 0; i < AX.length - 1; i++) if (x <= AX[i + 1][0]) return lerp(AX[i][1], AX[i + 1][1], (x - AX[i][0]) / (AX[i + 1][0] - AX[i][0]));
  return AX[AX.length - 1][1];
}
const isNorth = (x, z) => z < axisZ(x);

// ------------------------------------------------------------------ terrain heights
// Grossbasel: Münsterhügel ~24 m above the water, falling to Schifflände and the Birsig valley.
const HILL = [[-90,170,24],[-60,128,23],[-140,118,23],[-20,220,23],[60,280,22],[120,330,18],[200,300,13],[300,300,7],[420,330,6],
  [-200,60,20],[-240,0,17],[-290,-60,11],[-340,-130,7],[-385,-190,6],[-430,-100,6],[-410,60,8],[-330,170,10],[-250,250,14],
  [-120,320,21],[0,420,21],[150,450,16],[-620,0,10],[-520,-300,7],[300,500,14],[-300,450,16],[600,500,8]];
function southH(x, z){
  let w = 0, s = 0;
  for (const [px, pz, h] of HILL){ const d2 = (x - px) ** 2 + (z - pz) ** 2 + 1; const k = 1 / (d2 * d2); w += k; s += k * h; }
  return s / w;
}
const PROM = 6.0; // Kleinbasel promenade level above the water
function northH(d){ if (d < 2.5) return 1.0; if (d < 13) return 1.0 + smooth((d - 2.5) / 10.5) * (PROM - 1.0); return PROM; }
function camGround(x, z){ const g = groundH(x, z); if (!isNorth(x, z) || inRiver(x, z)) return g; const d = waterDist(x, z); return g + (d > 2.2 && d < 13.2 ? .55 : .15); }
function groundH(x, z){
  if (inRiver(x, z)) return isNorth(x, z) ? -1.6 : -3;
  return isNorth(x, z) ? northH(waterDist(x, z)) : southH(x, z);
}

// ------------------------------------------------------------------ textures (painted in code)
function canvasTex(size, draw, opts = {}){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); draw(g, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = opts.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
  t.anisotropy = 2; t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
  return t;
}
function grain(g, s, amt, seed = 3){
  const r = rng(seed), d = g.getImageData(0, 0, s, s);
  for (let i = 0; i < d.data.length; i += 4){ const n = (r() - .5) * amt; d.data[i] += n; d.data[i + 1] += n; d.data[i + 2] += n; }
  g.putImageData(d, 0, 0);
}
// ---- painting helpers: everything is drawn small and blurred by the GPU, like a 2001 texture sheet
function blotches(g, s, n, rgb, a, r0, r1, seed){
  const r = rng(seed);
  for (let i = 0; i < n; i++){
    const x = r() * s, y = r() * s, rad = r0 + r() * (r1 - r0);
    const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
}
function streaks(g, s, n, rgb, a, seed, y0 = 0){
  const r = rng(seed);
  for (let i = 0; i < n; i++){
    const x = r() * s, w = 1 + r() * 3, h = s * (.25 + r() * .6);
    const gr = g.createLinearGradient(0, y0, 0, y0 + h); gr.addColorStop(0, `rgba(${rgb},${a})`); gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr; g.fillRect(x, y0, w, h);
  }
}
function ashlar(g, s, rows, cols, light, dark, jointA, seed){
  const r = rng(seed), h = s / rows, w = s / cols;
  for (let j = 0; j < rows; j++) for (let i = -1; i <= cols; i++){
    const x = i * w + ((j % 2) ? w / 2 : 0), y = j * h, t = r();
    g.fillStyle = `rgb(${light.map((v, k) => Math.round(lerp(v, dark[k], t)))})`; g.fillRect(x, y, w, h);
    g.fillStyle = `rgba(30,22,18,${jointA})`; g.fillRect(x, y, w, 1.5); g.fillRect(x, y, 1.5, h);
    g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(x + 1.5, y + 1.5, w - 1.5, 1);
  }
}
function plasterBase(g, s, base, seed){
  g.fillStyle = base; g.fillRect(0, 0, s, s); grain(g, s, 16, seed);
  blotches(g, s, 7, '120,100,80', .18, 10, 30, seed + 1); blotches(g, s, 5, '255,255,250', .25, 8, 24, seed + 2);
  streaks(g, s, 6, '70,60,50', .16, seed + 3);
}
function windowAt(g, x, y, w, h, o){
  if (o.shutters){ g.fillStyle = o.shutters; g.fillRect(x - 12, y, 11, h); g.fillRect(x + w + 1, y, 11, h);
    g.fillStyle = 'rgba(0,0,0,.2)'; for (let k = y + 3; k < y + h; k += 4){ g.fillRect(x - 12, k, 11, 1); g.fillRect(x + w + 1, k, 11, 1); } }
  g.fillStyle = o.surround; g.fillRect(x - 4, y - 4, w + 8, h + 7);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x - 4, y - 4, w + 8, 2);                      // lintel shadow
  g.fillStyle = '#2d343c'; g.fillRect(x, y, w, h);
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, 'rgba(176,196,210,.9)'); gr.addColorStop(.45, 'rgba(120,140,155,.35)'); gr.addColorStop(1, 'rgba(60,50,40,.1)');
  g.fillStyle = gr; g.fillRect(x, y, w, h);                                                 // the sky in the glass
  g.fillStyle = 'rgba(235,225,205,.5)'; g.fillRect(x + 2, y + h * .55, w * .4, h * .45);    // a curtain
  g.fillStyle = '#efeae0'; g.fillRect(x + w / 2 - 1.5, y, 3, h); g.fillRect(x, y + h * .4, w, 2.5);
  g.fillStyle = '#e4ddd0'; g.fillRect(x - 6, y + h + 2, w + 12, 3);                          // sill
  g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(x - 6, y + h + 5, w + 12, 3);
  streaks(g, w + 12, 3, '60,50,40', .2, x * 7 + y, y + h + 8);
}
function facadeTile(g, s, o){
  plasterBase(g, s, '#f1ece2', o.seed || 29);
  if (o.pair){ windowAt(g, 26, 28, 28, 64, o); windowAt(g, 74, 28, 28, 64, o); } else windowAt(g, 44, 28, 40, 64, o);
  if (o.course){ g.fillStyle = 'rgba(150,110,95,.55)'; g.fillRect(0, 118, s, 6); }
}
const TEX = {
  facade: canvasTex(128, (g, s) => facadeTile(g, s, { shutters: '#6b8262', surround: '#ebe4d8', seed: 29 })),
  facade2: canvasTex(128, (g, s) => facadeTile(g, s, { surround: '#c48a78', course: true, seed: 31 })),
  facade3: canvasTex(128, (g, s) => facadeTile(g, s, { surround: '#dbd3c3', pair: true, shutters: '#86897f', seed: 37 })),
  plaster: canvasTex(64, (g, s) => plasterBase(g, s, '#efe9de', 5)),
  roof: canvasTex(64, (g, s) => {
    g.fillStyle = '#6b4536'; g.fillRect(0, 0, s, s);
    const r = rng(7);
    for (let y = 0; y < s; y += 8) for (let x = (y / 8) % 2 ? -4 : 0; x < s; x += 8){
      const t = r(); g.fillStyle = `rgb(${Math.round(lerp(215, 150, t))},${Math.round(lerp(150, 85, t))},${Math.round(lerp(120, 65, t))})`;
      g.fillRect(x + 1, y + 1, 7, 7); g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x + 1, y + 6, 7, 2);
    }
    blotches(g, s, 6, '90,110,70', .35, 4, 10, 8); grain(g, s, 18, 9);
  }),
  stone: canvasTex(64, (g, s) => { ashlar(g, s, 6, 3, [224, 215, 198], [188, 178, 160], .5, 11); blotches(g, s, 5, '80,70,60', .25, 6, 16, 12); grain(g, s, 16, 13); }),
  sand: canvasTex(64, (g, s) => { ashlar(g, s, 8, 4, [214, 142, 124], [180, 112, 98], .22, 14); streaks(g, s, 5, '70,40,35', .2, 15); grain(g, s, 16, 16); }),
  sandWin: canvasTex(64, (g, s) => {
    ashlar(g, s, 8, 4, [214, 142, 124], [180, 112, 98], .22, 14); streaks(g, s, 5, '70,40,35', .2, 15);
    g.fillStyle = '#2b2d32'; g.beginPath(); g.moveTo(21, 58); g.lineTo(21, 22); g.quadraticCurveTo(32, 2, 43, 22); g.lineTo(43, 58); g.fill();
    const gr = g.createLinearGradient(0, 10, 0, 58); gr.addColorStop(0, 'rgba(150,170,190,.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(21, 8, 22, 50);
    g.fillStyle = '#a8625a'; g.fillRect(31, 14, 2, 44); g.fillRect(21, 36, 22, 2);
    grain(g, s, 14, 16);
  }),
  munster: canvasTex(128, (g, s) => {
    // glazed tiles in a lozenge pattern
    const cols = ['#c49a2c', '#3e6a43', '#2b2621', '#8d3b2d'];
    g.fillStyle = '#6d4a36'; g.fillRect(0, 0, s, s);
    const n = 8, w = s / n;
    for (let i = -1; i <= n; i++) for (let j = -1; j <= n * 2; j++){
      const cx = i * w + (j % 2 ? w / 2 : 0), cy = j * w / 2;
      g.fillStyle = cols[(((i + j) % 4) + 4) % 4 === 0 ? 0 : ((j % 2) ? 1 : (i % 2 ? 2 : 3))];
      g.beginPath(); g.moveTo(cx, cy - w / 2); g.lineTo(cx + w / 2, cy); g.lineTo(cx, cy + w / 2); g.lineTo(cx - w / 2, cy); g.fill();
    }
    grain(g, s, 20, 17);
  }),
  ground: canvasTex(128, (g, s) => {
    // cobbles
    g.fillStyle = '#8f877a'; g.fillRect(0, 0, s, s);
    const r = rng(19), n = 10, w = s / n;
    for (let j = 0; j < n; j++) for (let i = -1; i <= n; i++){
      const x = i * w + ((j % 2) ? w / 2 : 0) + 1, y = j * w + 1, t = r();
      g.fillStyle = `rgb(${Math.round(lerp(205, 165, t))},${Math.round(lerp(198, 158, t))},${Math.round(lerp(185, 145, t))})`;
      g.beginPath(); g.roundRect(x, y, w - 2, w - 2, 3); g.fill();
      g.fillStyle = 'rgba(255,255,255,.15)'; g.fillRect(x + 1, y + 1, w - 4, 2);
    }
    blotches(g, s, 8, '60,55,50', .3, 8, 22, 20); grain(g, s, 14, 21);
  }),
  grass: canvasTex(128, (g, s) => {
    g.fillStyle = '#7b8256'; g.fillRect(0, 0, s, s);
    blotches(g, s, 14, '150,150,80', .35, 8, 22, 22); blotches(g, s, 12, '60,80,40', .4, 6, 18, 23); blotches(g, s, 5, '160,140,100', .3, 6, 14, 24);
    const r = rng(25); g.fillStyle = 'rgba(40,60,30,.5)';
    for (let i = 0; i < 260; i++){ const x = r() * s, y = r() * s; g.fillRect(x, y, 1, 2 + r() * 3); }
    g.fillStyle = 'rgba(200,210,140,.45)';
    for (let i = 0; i < 160; i++){ const x = r() * s, y = r() * s; g.fillRect(x, y, 1, 1 + r() * 3); }
    grain(g, s, 14, 26);
  }),
  wood: canvasTex(64, (g, s) => {
    g.fillStyle = '#e8e2d8'; g.fillRect(0, 0, s, s);
    const r = rng(23);
    for (let y = 0; y < s; y += 8){ const t = r(); g.fillStyle = `rgba(90,60,30,${.08 + t * .18})`; g.fillRect(0, y, s, 8); g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(0, y, s, 1);
      if (r() < .4){ g.fillStyle = 'rgba(80,50,25,.5)'; g.beginPath(); g.ellipse(r() * s, y + 4, 3, 2, 0, 0, PI * 2); g.fill(); } }
    grain(g, s, 18, 27);
  }),
  skin: canvasTex(64, (g, s) => { g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s); grain(g, s, 12, 36); blotches(g, s, 6, '200,120,90', .18, 6, 18, 37); }),
  jacket: canvasTex(64, (g, s) => {
    // bleu de travail: seams, a placket, two chest pockets, worn pale at the folds
    g.fillStyle = '#4b6a93'; g.fillRect(0, 0, s, s); grain(g, s, 18, 33);
    blotches(g, s, 7, '140,165,195', .3, 6, 16, 34); blotches(g, s, 4, '30,45,70', .25, 6, 14, 35);
    g.fillStyle = 'rgba(10,25,50,.5)'; g.fillRect(31, 0, 2, s); g.fillRect(15, 0, 1, s); g.fillRect(48, 0, 1, s);
    for (let y = 8; y < s; y += 12){ g.fillStyle = '#d8d2c0'; g.fillRect(31, y, 2, 2); }
    g.fillStyle = 'rgba(10,25,50,.45)'; g.fillRect(4, 10, 20, 2); g.fillRect(40, 10, 20, 2); g.fillRect(4, 10, 1, 14); g.fillRect(23, 10, 1, 14); g.fillRect(40, 10, 1, 14); g.fillRect(59, 10, 1, 14);
  }),
  wavelets: canvasTex(128, (g, s) => {
    // Colville's water: rows of small crescents, light on top, shadow beneath
    g.fillStyle = '#808080'; g.fillRect(0, 0, s, s);
    const r = rng(41);
    for (let row = 0; row < 16; row++) for (let i = 0; i < 9; i++){
      const x = (i + (row % 2) * .5 + (r() - .5) * .3) * s / 8, y = (row + .5) * s / 16, w = 7 + r() * 5;
      g.strokeStyle = '#d8d8d8'; g.lineWidth = 2; g.beginPath(); g.arc(x, y + 3, w, PI * 1.15, PI * 1.85); g.stroke();
      g.strokeStyle = '#3a3a3a'; g.lineWidth = 1.5; g.beginPath(); g.arc(x, y + 1, w * .9, PI * .2, PI * .8); g.stroke();
    }
  }, { linear: true }),
  ripple: canvasTex(128, (g, s) => {
    const d = g.createImageData(s, s);

// ------------------------------------------------------------------ terrain
function buildTerrain(){
  const H = 760, S = 3, N = Math.round(2 * H / S) + 1;
  const pos = new Float32Array(N * N * 3), col = new Float32Array(N * N * 3), uv = new Float32Array(N * N * 2), kind = new Uint8Array(N * N), gr = new Uint8Array(N * N);
  const C = { pave: lin('#d8d2c6'), grass: lin('#ffffff'), low: lin('#bdb6a8'), under: lin('#5d6b57'), south: lin('#cbc5b8'), pfalz: lin('#d6cbb4') };
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++){
    const x = -H + i * S, z = -H + j * S, k = j * N + i, w = inRiver(x, z), n = isNorth(x, z);
    let y, c;
    if (n){
      const d = waterDist(x, z);
      y = w ? Math.max(-1.6, 1.0 - d * 0.9) : northH(d);
      gr[k] = !w && d > 2.2 && d < 13 ? 1 : 0;
      c = w ? C.under : d < 2.5 ? C.low : gr[k] ? C.grass : C.pave;
      kind[k] = w ? 0 : 1;
    } else {
      y = w ? -3 : southH(x, z);
      c = Math.hypot(x - MU.cx, z - MU.cz) < 70 ? C.pfalz : C.south;
      kind[k] = w ? 0 : 2;
    }
    const v = .9 + vnoise(x / 3, z / 3) * .2;
    pos.set([x, y, z], k * 3); col.set([c[0] * v, c[1] * v, c[2] * v], k * 3); uv.set([x / 2, z / 2], k * 2);
  }
  const idx = [[], []];
  for (let j = 0; j < N - 1; j++) for (let i = 0; i < N - 1; i++){
    const a = j * N + i, b = a + 1, c = a + N, d = c + 1, ks = [kind[a], kind[b], kind[c], kind[d]];
    if (ks.every(v => v === 0)) continue;
    if (ks.includes(2) && ks.includes(0)) continue;          // the stone river wall covers this
    if (ks.includes(1) && ks.includes(2)) continue;
    idx[gr[a] + gr[b] + gr[c] + gr[d] >= 2 ? 1 : 0].push(a, c, b, b, c, d);
  }
  const group = new THREE.Group();
  idx.forEach((ix, which) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); g.setIndex(ix); g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ map: which ? TEX.grass : TEX.ground, vertexColors: true }));
    m.receiveShadow = true; group.add(m);
  });
  return group;
}

  fragmentShader: `varying vec3 vW; varying vec4 vR; uniform float uTime; uniform vec3 uSun, uDeep, uSky, uSunCol; uniform sampler2D tRip, tRefl, tWav;

      vec3 refl = texture2DProj(tRefl, rc).rgb; refl = floor(refl * 14.) / 14.;

{

    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(n, 3)); return g;
  })();

  const tm = new THREE.InstancedMesh(trunk, new THREE.MeshLambertMaterial({ color: '#4d4237' }), pts.length);
  const M4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), greens = ['#5c6a44', '#55633f', '#66714a', '#5e6c47', '#6f7650', '#4f5e3e'].map(c => new THREE.Color(c));

    if (isNorth(x, z) && waterDist(x, z) < 30) COLL.circles.push([x, z, .45]);
    M4.compose(new THREE.Vector3(x, y - .2, z), q.identity(), new THREE.Vector3(1.4, th + s * .5, 1.4)); tm.setMatrixAt(i, M4);
    e.set(0, r() * PI * 2, 0); q.setFromEuler(e);

  });
  const bm = new THREE.InstancedMesh(crown, new THREE.MeshLambertMaterial({ emissive: '#3a4a22', emissiveIntensity: .3 }), BUSHES.length);
  BUSHES.forEach(([x, y, z, s], i) => {
    const r = rng(i * 7 + 3); e.set(0, r() * PI * 2, 0); q.setFromEuler(e);
    M4.compose(new THREE.Vector3(x, y + s * .55, z), q, new THREE.Vector3(s, s * (s > 2.5 ? 1.3 : .8), s)); bm.setMatrixAt(i, M4);

  for (const m of [cm, tm, bm]){ m.castShadow = m.receiveShadow = true; scene.add(m); }
}

// ------------------------------------------------------------------ people
function makePerson(o){
  const g = new THREE.Group(), mats = {};
  const M = c => mats[c] || (mats[c] = new THREE.MeshLambertMaterial({ color: c }));
  const Ms = o.skinTex ? new THREE.MeshLambertMaterial({ map: o.skinTex, color: o.skin }) : M(o.skin);
  const add = (geom, mat, parent, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geom, mat.isMaterial ? mat : M(mat)); m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m; };
  // a tapered limb segment hanging down from its joint; profile = [[radius, t], ...]
  const limb = (prof, len, mat, parent, x = 0, y = 0, z = 0, sz = 1) => {
    const pts = prof.map(([r, t]) => new THREE.Vector2(r, -t * len)); const q = new THREE.LatheGeometry(pts, 12); q.scale(1, 1, sz); return add(q, mat, parent, x, y, z);
  };
  const ball = (rx, ry, rz, mat, parent, x = 0, y = 0, z = 0) => { const q = new THREE.SphereGeometry(1, 14, 10); q.scale(rx, ry, rz); return add(q, mat, parent, x, y, z); };
  const joint = (parent, x, y, z) => { const j = new THREE.Group(); j.position.set(x, y, z); parent.add(j); return j; };
  const hip = joint(g, 0, .96, 0);
  ball(.19, .12, .14, o.trousers, hip, 0, -.02, 0);                                            // pelvis
  const legs = [-1, 1].map(s => {
    const th = joint(hip, s * .1, -.03, 0);
    limb([[.1, 0], [.098, .3], [.08, .75], [.07, 1]], .46, o.trousers, th, 0, 0, 0, 1.05);     // thigh
    const kn = joint(th, 0, -.46, 0);
    ball(.072, .07, .075, o.trousers, kn);
    limb([[.068, 0], [.072, .2], [.06, .6], [.045, 1]], .44, o.trousers, kn);                 // shin, calf bulge
    ball(.055, .11, .06, o.trousers, kn, 0, -.14, -.03);
    const sh = ball(.075, .05, .14, o.shoes, kn, 0, -.455, .05); sh.scale.set(.075, .055, .135);
    ball(.08, .045, .07, o.shoes, kn, 0, -.46, -.01);                                           // heel
    return { th, kn, s };
  });
  const body = joint(hip, 0, 0, 0);
  // the torso lathed from hips to neck: waist, chest, broad shoulders
  const torso = (() => {
    const prof = [[.17, 0], [.19, .06], [.175, .2], [.2, .38], [.225, .52], [.245, .6], [.2, .66], [.09, .7]].map(([r, t]) => new THREE.Vector2(r, t * .74));
    const q = new THREE.LatheGeometry(prof, 16); q.scale(1, 1, .66);
    const m = new THREE.Mesh(q, o.cloth ? new THREE.MeshLambertMaterial({ map: o.cloth }) : M(o.jacket)); m.position.y = .02; m.castShadow = true; body.add(m); return m;
  })();
  torso.rotation.y = PI;
  for (const s of [-1, 1]) ball(.09, .07, .085, o.jacket, body, s * .22, .46, 0);               // deltoids
  add(new THREE.CylinderGeometry(.07, .08, .09, 10), Ms, body, 0, .55, .01);                 // neck
  add(new THREE.CylinderGeometry(.09, .085, .06, 10), o.collar || o.jacket, body, 0, .53, 0);  // collar
  if (o.pocket) for (const s of [-1, 1]) add(new THREE.BoxGeometry(.1, .09, .012), o.pocket, body, s * .09, .32, .135);
  const arms = [-1, 1].map(s => {
    const sh = joint(body, s * .26, .46, 0);
    limb([[.062, 0], [.064, .3], [.052, 1]], .3, o.jacket, sh);                                 // upper arm
    const el = joint(sh, 0, -.3, 0);
    ball(.05, .05, .05, o.jacket, el);
    limb([[.052, 0], [.056, .25], [.04, 1]], .27, o.jacket, el);                                // forearm
    add(new THREE.CylinderGeometry(.045, .042, .03, 10), o.jacket, el, 0, -.27, 0);             // cuff
    const hand = ball(.045, .085, .028, Ms, el, 0, -.33, .005); hand.rotation.x = .15;          // big hands
    ball(.016, .045, .02, Ms, el, s * .04, -.3, .01);                                           // thumb
    return { sh, el, s };
  });
  const head = joint(body, 0, .595, .01);
  const skull = ball(.093, .112, .104, Ms, head, 0, .07, 0);
  ball(.08, .075, .09, Ms, head, 0, -.02, .012);                                                // jaw
  ball(.07, .05, .07, Ms, head, 0, .01, .03);                                                   // cheeks
  ball(.085, .035, .07, Ms, head, 0, .095, .03);                                                // brow ridge
  ball(.018, .028, .028, Ms, head, 0, .035, .11);                                               // nose
  ball(.012, .006, .006, '#4d2e24', head, 0, .018, .128);
  for (const s of [-1, 1]){
    ball(.016, .028, .012, Ms, head, s * .095, .05, -.01);                                      // ears
    ball(.0115, .007, .006, '#1f1a18', head, s * .035, .06, .104);                              // eyes
    add(new THREE.BoxGeometry(.036, .007, .012), '#5a3f30', head, s * .036, .085, .1).rotation.z = s * -.1;  // brows
    if (o.moustache){ const m = ball(.03, .011, .014, o.moustache, head, s * .022, -.0, .108); m.rotation.z = s * .25; }
  }
  // the buzz cut: nearly bald, just a darker shadow on the skull
  { const hg = new THREE.SphereGeometry(1.012, 16, 9, 0, PI * 2, 0, PI * .5); hg.scale(.093, .112, .104); const m = add(hg, o.hair, head, 0, .07, 0); m.rotation.x = -.35; }
  g.userData = { hip, legs, arms, body, head };
  return g;
}
function pose(p, mode, ph = 0){
  const { hip, legs, arms, body } = p.userData;
  if (mode === 'sit'){
    hip.position.y = .46; body.rotation.x = .14;
    for (const l of legs){ l.th.rotation.set(-1.5, 0, l.s * .14); l.kn.rotation.x = 1.2; }
    for (const a of arms){ a.sh.rotation.set(-.2, 0, a.s * .3); a.el.rotation.x = -.2; }
    return;
  }
  const amp = mode === 'run' ? .8 : .45;
  hip.position.y = .96 - (mode === 'run' ? .05 : 0) + Math.abs(Math.cos(ph)) * .025;
  body.rotation.x = mode === 'run' ? .18 : .07;
  legs.forEach((l, i) => {
    const s = Math.sin(ph + (i ? PI : 0));
    l.th.rotation.set(s * amp, 0, l.s * .02);
    l.kn.rotation.x = .08 + Math.max(0, Math.sin(ph + (i ? PI : 0) - 1.3)) * amp * 1.4;
  });
  arms.forEach((a, i) => {
    a.sh.rotation.set(Math.sin(ph + (i ? 0 : PI)) * amp * .8, 0, a.s * .07);
    a.el.rotation.x = mode === 'run' ? -1.2 : -.22;

      n.start(t); n.stop(t + 3.1); }
    setTimeout(carPass, 15000 + Math.random() * 30000); };
  setTimeout(carPass, 9000);
  scheduleBells(8); scheduleSwifts(5);
}
function bell(t, f, g = .06){
  for (const [m, a, dec] of [[.5, .5, 7], [1, 1, 5], [1.2, .5, 3.5], [1.5, .35, 3], [2, .4, 2.5], [2.6, .2, 1.8], [3.0, .15, 1.4]]){
    const o = AC.createOscillator(), v = AC.createGain(); o.frequency.value = f * m;
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(g * a, t + .01); v.gain.exponentialRampToValueAtTime(.0001, t + dec);
    o.connect(v).connect(AC.bus); o.start(t); o.stop(t + dec + .1);
  }
}
function scheduleBells(delay){
  setTimeout(() => {
    if (AC){ const n = 2 + Math.floor(Math.random() * 4), f = Math.random() < .5 ? 233 : 196;
      for (let i = 0; i < n; i++) bell(AC.currentTime + i * 2.6, f, .05); }
    scheduleBells(45 + Math.random() * 60);
  }, delay * 1000);
}
function tramBell(){
  if (!AC || muted) return;
  for (const dt of [0, .22]) bell(AC.currentTime + dt, 1350, .012);
}
function scheduleSwifts(delay){
  setTimeout(() => {
    if (AC){
      // Mauersegler: a ragged burst of high screams
      let t = AC.currentTime; const n = 4 + Math.floor(Math.random() * 7);
      for (let i = 0; i < n; i++){
        const o = AC.createOscillator(), v = AC.createGain(), f = 5200 + Math.random() * 1800; o.type = 'sawtooth';
        o.frequency.setValueAtTime(f, t); o.frequency.linearRampToValueAtTime(f * .78, t + .16);
        const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 45; lg.gain.value = 600; lfo.connect(lg).connect(o.frequency);
        const hp = AC.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 5600; hp.Q.value = 2;
        v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(.006, t + .02); v.gain.linearRampToValueAtTime(0, t + .17);
        o.connect(hp).connect(v).connect(master); o.start(t); o.stop(t + .2); lfo.start(t); lfo.stop(t + .2);
        t += .07 + Math.random() * .16;
      }
    }
    scheduleSwifts(9 + Math.random() * 22);
  }, delay * 1000);
}
function toggleMute(){
  if (!AC) initAudio();
  muted = !muted; AC.resume();
  master.gain.setTargetAtTime(muted ? 0 : .9, AC.currentTime, .6);
}

// ------------------------------------------------------------------ resize
let W = 0, H = 0;
function resize(){
  const pr = Math.min(window.devicePixelRatio || 1, clamp(440 / innerHeight, .36, 1));
  renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight, false);
  W = Math.ceil(innerWidth * pr / 8) * 8; H = Math.ceil(innerHeight * pr / 8) * 8;
  for (const r of [rtScene, ...rtAcc]) r.setSize(W, H);
  rtRefl.setSize(W / 2, H / 2);
  outMat.uniforms.uRes.value.set(W, H);
  camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 82 : 72; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ------------------------------------------------------------------ start
let started = false;
ui.intro.addEventListener('pointerdown', () => {
  if (started) return; started = true;
  ui.intro.classList.add('hide');
  toggleMute();
  ui.help.innerHTML = touch ? 'Links ziehen: gehen · rechts ziehen: Blick' : 'WASD / Pfeile: gehen · Shift: rennen · Maus ziehen: Blick<br>E: sitzen / aufstehen · M: Ton';
  ui.help.classList.add('on'); setTimeout(() => ui.help.classList.remove('on'), 9000);
});

// ------------------------------------------------------------------ loop
const clock = new THREE.Clock();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), tmp = new THREE.Vector3();
let first = true, T = 0;
const MU_LOOK = new THREE.Vector3(MU.cx, MU.y + 18, MU.cz);
// the cinematic camera: stand still long enough and it cuts to fixed wide angles, like the old games
const CIN = { on: false, idle: 0, next: 0, pos: new THREE.Vector3() };
function cinCut(){
  const a = Math.random() * PI * 2, d = 7 + Math.random() * 8, px = player.position.x + Math.sin(a) * d, pz = player.position.z + Math.cos(a) * d;
  CIN.pos.set(px, Math.max(camGround(px, pz) + .8, player.position.y + 1 + Math.random() * 4), pz);
  CIN.on = true; CIN.next = T + 6 + Math.random() * 3; camPos.copy(CIN.pos); camLook.set(player.position.x, player.position.y + 1, player.position.z);
}
function update(dt){
  T += dt;
  // --- player
  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp) iz += 1; if (keys.KeyS || keys.ArrowDown) iz -= 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1; if (keys.KeyD || keys.ArrowRight) ix += 1;
  ix += joy.x; iz -= joy.y;
  const il = Math.hypot(ix, iz);
  if (started && st.mode === 'sit' && il > .2){ st.mode = 'walk'; camYaw = st.yaw; camPitch = .12; player.userData.head.visible = true; rigHead(true); }
  const run = keys.ShiftLeft || keys.ShiftRight || il > .95 && joy.id !== null;
  if (st.mode !== 'sit' && il > .1){
    const fx = Math.sin(camYaw), fz = Math.cos(camYaw), k = Math.min(il, 1) / il;
    const mx = (fx * iz - fz * ix) * k, mz = (fz * iz + fx * ix) * k;
    const sp = run ? 4.6 : 1.7, target = Math.atan2(mx, mz);
    let d = target - st.yaw; d = Math.atan2(Math.sin(d), Math.cos(d)); st.yaw += d * Math.min(1, dt * 9);
    st.speed = lerp(st.speed, sp * Math.min(il, 1), Math.min(1, dt * 6));
    const nx = player.position.x + mx * st.speed * dt, nz = player.position.z + mz * st.speed * dt;
    if (walkable(nx, nz)){ player.position.x = nx; player.position.z = nz; }
    else if (walkable(nx, player.position.z)) player.position.x = nx;
    else if (walkable(player.position.x, nz)) player.position.z = nz;
    st.ph += dt * st.speed * 3.6;
    st.mode = run ? 'run' : 'walk';
    if (look.id === null) lookIdle += dt;
    if (lookIdle > 1.2){ let dy = st.yaw - camYaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); camYaw += dy * Math.min(1, dt * .9); }
  } else if (st.mode !== 'sit'){ st.speed = 0; st.ph = 0; st.mode = 'walk'; }
  for (const P of PEDS){ const dx = player.position.x - P.g.position.x, dz = player.position.z - P.g.position.z, d = Math.hypot(dx, dz); if (d < .7 && d > 1e-3){ const nx = player.position.x + dx / d * (.7 - d), nz = player.position.z + dz / d * (.7 - d); if (walkable(nx, nz)){ player.position.x = nx; player.position.z = nz; } } }
  const gnd = northH(waterDist(player.position.x, player.position.z));
  if (st.jump){ player.position.y += st.jump.vy * dt; st.jump.vy -= 11 * dt; if (st.jump.vy < 0 && player.position.y <= gnd){ player.position.y = gnd; st.jump = null; } }
  else player.position.y = lerp(player.position.y, gnd, Math.min(1, dt * 10));
  player.rotation.y = st.yaw;
  if (RIG.ready) rigPose(st.jump ? 'jump' : st.mode, dt, st.speed); else pose(player, st.mode === 'sit' ? 'sit' : st.mode, st.ph);
  updatePeds(dt); updateCars(T);
  const z = zoneAt(player.position.x); if (started && z !== zoneNow){ zoneNow = z; showZone(z); }

  // --- camera
  const head = tmp.set(player.position.x, player.position.y + 1.45, player.position.z);
  let wantPos, wantLook;
  if (st.mode !== 'sit'){
    if (il < .1 && look.id === null && !st.jump) CIN.idle += dt; else { CIN.idle = 0; CIN.on = false; }
    if (CIN.idle > 9 && (!CIN.on || T > CIN.next)) cinCut();
  } else { CIN.on = false; CIN.idle = 0; }
  if (st.mode === 'sit'){
    if (st.sitT === 0){ camYaw = st.yaw; camPitch = 0; lookIdle = 0; }
    st.sitT += dt;
    // first person: his own knees and shoes over the water, the Münster ahead; a slow look around
    const yaw = st.yaw + Math.sin(st.sitT * 2 * PI / 90) * .22 + (camYaw - st.yaw) * (look.id !== null || lookIdle < 6 ? 1 : Math.max(0, 1 - (lookIdle - 6) / 8));
    const pitch = -.42 + Math.sin(st.sitT * 2 * PI / 60 + 1) * .3 + (look.id !== null || lookIdle < 6 ? camPitch : camPitch * Math.max(0, 1 - (lookIdle - 6) / 8));
    const eye = new THREE.Vector3(player.position.x - Math.sin(st.yaw) * .06, player.position.y + .44 + .86 + .1, player.position.z - Math.cos(st.yaw) * .06);
    wantPos = eye;
    wantLook = new THREE.Vector3(eye.x + Math.sin(yaw) * Math.cos(pitch) * 10, eye.y + Math.sin(pitch) * 10, eye.z + Math.cos(yaw) * Math.cos(pitch) * 10);
  } else {
    const d = 3.0;
    wantPos = new THREE.Vector3(head.x - Math.sin(camYaw) * d * Math.cos(camPitch), head.y + .2 + Math.sin(camPitch) * d, head.z - Math.cos(camYaw) * d * Math.cos(camPitch));
    wantLook = new THREE.Vector3(head.x + Math.sin(camYaw) * 5, head.y - .35, head.z + Math.cos(camYaw) * 5);
    const gy = camGround(wantPos.x, wantPos.z); if (wantPos.y < gy + .7) wantPos.y = gy + .7;
    if (CIN.on){ wantPos = CIN.pos; wantLook = new THREE.Vector3(head.x, head.y - .4, head.z); }
  }
  const k = first ? 1 : Math.min(1, dt * (st.mode === 'sit' ? 2.5 : CIN.on ? 1.2 : 3.2));
  camPos.lerp(wantPos, k); camLook.lerp(wantLook, k); first = false;
  camera.position.copy(camPos); camera.lookAt(camLook);
  if (window.__CAM){ const c = window.__CAM; camera.position.set(c[0], c[1], c[2]); camera.lookAt(c[3], c[4], c[5]); }
  if (DBG.has('closeup')){ const a = +DBG.get('closeup') || 0, hy = player.position.y + (st.mode === 'sit' ? .9 : 1.45); camera.position.set(player.position.x + Math.sin(st.yaw + a) * 1.7, hy + .1, player.position.z + Math.cos(st.yaw + a) * 1.7); camera.lookAt(player.position.x, hy - .25, player.position.z); }
  const fov = (innerWidth < innerHeight ? 82 : 72) - (st.mode === 'sit' ? 0 : 2);
  if (Math.abs(camera.fov - fov) > .01){ camera.fov = lerp(camera.fov, fov, first ? 1 : Math.min(1, dt * 1.5)); camera.updateProjectionMatrix(); }

  // --- sun & shadow follow the player (snapped to texels)
  const snap = 220 / 2048, sx = Math.round(player.position.x / snap) * snap, sz = Math.round(player.position.z / snap) * snap;
  sun.target.position.set(sx, 5, sz); sun.position.set(sx + SUN.x * 300, 5 + SUN.y * 300, sz + SUN.z * 300);

  // --- the ferry: across, pause, back
  const cyc = 140, tt = T % cyc, half = cyc / 2;
  let fp = tt < half ? clamp((tt - 12) / (half - 12), 0, 1) : 1 - clamp((tt - half - 12) / (half - 12), 0, 1);
  fp = smooth(fp);
  const going = tt < half;
  const fx = lerp(FERRY.A[0], FERRY.B[0], fp), fz = lerp(FERRY.A[1], FERRY.B[1], fp);
  const bow = Math.atan2(FERRY.u[0], FERRY.u[1]) + (going ? 1 : -1) * .55;  // nosed into the current
  ferry.position.set(fx, .05 + Math.sin(T * 1.3) * .04, fz); ferry.rotation.y = bow + PI / 2;
  const cA = FERRY.cA, cB = FERRY.cB, ca = new THREE.Vector3(...cA), cb = new THREE.Vector3(...cB);
  const pul = ca.clone().lerp(cb, clamp(fp * .96 + .02, 0, 1));
  const rp = rope.geometry.attributes.position; rp.setXYZ(0, pul.x, pul.y, pul.z); rp.setXYZ(1, fx, 2.3, fz); rp.needsUpdate = true;

  // --- trams
  for (const tr of trams){
    const per = 95, p = ((T / per + tr.phase) % 1), B = tr.B;
    const s = tr.dir > 0 ? p : 1 - p, t = lerp(-40, B.len + 40, s);
    const c = B.at(clamp(t, 0, B.len), tr.dir * 3.2);
    tr.t.visible = t > -10 && t < B.len + 10;
    tr.t.position.set(c[0], B.y(clamp(t, 0, B.len)) - (B === BRIDGES.mittlere ? .9 : 0), c[1]);
    tr.t.rotation.y = -Math.atan2(B.dir[1], B.dir[0]);
    if (p < .03 && !tr.rang){ tr.rang = true; tramBell(); } if (p > .5) tr.rang = false;
  }
  // --- swimmers drift downstream
  for (const s of swimmers){
    const dd = ((T * 1.25 + s.userData.f * swimLen) % swimLen);
    const [x, zz, a] = alongLine(swimLine, dd);
    s.position.set(x + Math.cos(a) * s.userData.off, Math.sin(T * 2 + s.userData.f * 9) * .04, zz - Math.sin(a) * s.userData.off);
    s.rotation.y = a;
  }
  for (const g of gulls){
    const u = g.userData, a = T * u.sp + u.ph;
    g.position.set(u.c[0] + Math.cos(a) * u.r, u.h + Math.sin(T * .7 + u.ph) * 2, u.c[1] + Math.sin(a) * u.r);
    g.rotation.set(0, -a, Math.sin(T * 5 + u.ph) * .35);
  }
  water.material.uniforms.uTime.value = T;

  // --- sound: lapping louder near the water
  if (AC && river){ const d = waterDist(player.position.x, player.position.z); river.userData.lap.gain.setTargetAtTime(clamp(1 - d / 14, 0, 1) * .05, AC.currentTime, .5);
    if (AC.radio && window.__BUV){ const dd = Math.hypot(player.position.x - window.__BUV[0], player.position.z - window.__BUV[1]); AC.radio.gain.setTargetAtTime(.9 / (1 + dd * dd / 60), AC.currentTime, .5); } }
}
let rtI = 0;
function frame(){
  const dt = Math.min(clock.getDelta(), .1);
  update(dt);
  if (!DBG.has('norefl')) renderReflection();
  if (DBG.has('raw')){ renderer.setRenderTarget(null); renderer.render(scene, camera); requestAnimationFrame(frame); return; }
  renderer.setRenderTarget(rtScene); renderer.render(scene, camera);
  quad.material = accMat; accMat.uniforms.tCur.value = rtScene.texture; accMat.uniforms.tPrev.value = rtAcc[rtI].texture;
  accMat.uniforms.k.value = st.mode === 'sit' ? .1 : .22;
  renderer.setRenderTarget(rtAcc[1 - rtI]); renderer.render(post.scene, post.cam);
  quad.material = outMat; outMat.uniforms.tSrc.value = rtAcc[1 - rtI].texture; outMat.uniforms.uTime.value = T;
  renderer.setRenderTarget(null); renderer.render(post.scene, post.cam);
  rtI = 1 - rtI;
  requestAnimationFrame(frame);
}
frame();
window.__ready = true; window.__walkable = walkable; window.__RIG = RIG; window.__CIN = CIN; window.__PEDS = PEDS; window.__player = player; window.__st = st; window.__trams = trams; window.__scene = scene; window.__water = water; window.__rtRefl = rtRefl; window.__renderer = renderer; window.__accMat = accMat;
</script>
