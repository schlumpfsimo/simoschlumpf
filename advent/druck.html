<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Druckvorlage · SimOil</title>
<link rel="stylesheet" href="farben.css">
<style>
  /* Bildschirm: Einstellungen oben, darunter die Blätter. Druck: nur die Blätter (A4, 4 Lose A6). */
  * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; font-family: var(--schrift); color: var(--braun); background: var(--creme-tief); }
  .steuerung { background: var(--weiss); padding: 16px; border-bottom: 4px solid var(--braun); }
  .steuerung h1 { font-size: 24px; margin: 0 0 4px; }
  .steuerung p { margin: 4px 0 12px; font-size: 15px; max-width: 75ch; }
  .reihe { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-end; margin-bottom: 12px; }
  .reihe label { display: flex; flex-direction: column; font-size: 13px; font-weight: 600; gap: 4px; }
  .reihe label.haken { flex-direction: row; align-items: center; gap: 8px; font-size: 15px; }
  .reihe input[type=number], .reihe select { font: inherit; font-size: 16px; padding: 6px 8px; width: 6.5em; border: 3px solid var(--braun); border-radius: 10px; background: var(--weiss); color: var(--braun); }
  .reihe select { width: auto; }
  button { font: inherit; font-weight: 700; font-size: 17px; padding: 10px 20px; border: 3px solid var(--braun); background: var(--gelb); color: var(--braun);
           border-radius: 99px; box-shadow: 0 4px 0 var(--braun); cursor: pointer; }
  button.zweit { background: var(--weiss); }
  .meldung { padding: 10px 14px; border-radius: 12px; background: var(--gelb); border: 3px solid var(--braun); margin: 8px 0; font-weight: 600; }
  .meldung.fehler { background: #FFD9CC; }
  .vorschau { padding: 10mm 0; overflow-x: auto; }

  /* ----- Blatt A4 mit 4 Losen. Alle Masse in mm, damit der Druck masshaltig ist. ----- */
  .blatt { position: relative; width: 210mm; height: 297mm; background: #fff; overflow: hidden; margin: 0 auto 10mm; box-shadow: 0 2mm 0 var(--braun); }
  .marken { position: absolute; inset: 0; width: 210mm; height: 297mm; pointer-events: none; }
  .los { position: absolute; width: 105mm; height: 148.5mm; }
  /* Karte mit Abstand zur Schnittkante (kein Anschnitt nötig) */
  .karte {
    position: absolute; inset: var(--rand, 4mm); background: var(--creme); border: 0.9mm solid var(--braun); border-radius: 6mm;
    padding: 4.5mm 5mm 3.5mm; display: flex; flex-direction: column; overflow: hidden;
  }
  .kopf { display: flex; justify-content: space-between; align-items: flex-start; gap: 3mm; }
  .schild-klein {
    display: inline-flex; align-items: center; gap: 1.2mm; padding: 1mm 3.5mm 1.6mm 2.4mm; border: 0.8mm solid var(--braun); border-radius: 4mm;
    background: linear-gradient(180deg, #FF9A4D 0%, var(--rot) 55%, var(--rot-tief) 100%); box-shadow: 0 1mm 0 var(--braun); transform: rotate(-2deg);
  }
  .schild-klein .sym-tropfen { width: 4mm; height: 4.8mm; }
  .schild-klein span { font-weight: 700; font-size: 6.8mm; line-height: 1; color: var(--weiss);
    text-shadow: .35mm 0 0 var(--braun), -.35mm 0 0 var(--braun), 0 .35mm 0 var(--braun), 0 -.35mm 0 var(--braun), 0 .8mm 0 var(--braun); }
  .nr { text-align: right; line-height: 1; }
  .nr b { display: block; font-size: 9.5mm; font-weight: 700; letter-spacing: -.2mm; }
  .nr b small { font-size: 4.6mm; color: var(--leise); }
  .nr span { display: block; font-size: 3.2mm; font-weight: 600; margin-top: 1mm; }
  .unterzeile { font-weight: 700; font-size: 3.4mm; color: var(--rot); margin-top: 2.6mm; letter-spacing: .2mm; }
  .regel { font-size: 3.5mm; line-height: 1.32; margin: 1mm 0 0; font-weight: 600; }
  .frage { font-size: 3.9mm; line-height: 1.3; margin: 1.6mm 0 0; font-weight: 700; background: var(--gelb); border: .6mm solid var(--braun);
           border-radius: 2.5mm; padding: 1.2mm 2mm; }
  .felder { flex: 1; display: grid; justify-content: center; align-content: center; }
  .feld { display: flex; flex-direction: column; align-items: center; }
  .feld-kopf { display: flex; align-items: center; gap: 1.2mm; font-weight: 700; font-size: 3.3mm; margin-bottom: 1.2mm; min-height: 5mm; max-width: 100%; text-align: center; }
  .feld-nr { flex: none; width: 5mm; height: 5mm; border-radius: 50%; background: var(--gelb); border: .6mm solid var(--braun); font-size: 3mm; line-height: 3.9mm; text-align: center; }
  .feld-flaeche { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff;
                  border: 1.2mm solid var(--braun); border-radius: 3.5mm; box-shadow: 0 1mm 0 var(--braun); }
  .feld-flaeche svg { display: block; }
  .kuerzel { font-family: var(--pixel); color: var(--braun); line-height: 1; margin-top: .4mm; letter-spacing: .5mm; }
  .klein { font-size: 2.15mm; line-height: 1.25; color: var(--leise); margin-top: 2mm; text-align: center; }
  .stern { position: absolute; width: 20mm; left: 50%; margin-left: -12mm; top: 2mm; transform: rotate(-12deg); }
  .stern svg { width: 100%; height: auto; display: block; }
  .beispiel { position: absolute; left: 0; right: 0; bottom: 1mm; text-align: center; font-size: 2.5mm; color: var(--rot); font-weight: 700; }
  .hinweis-los { position: absolute; inset: 10mm; font-size: 3.6mm; line-height: 1.45; }
  .hinweis-los h2 { font-size: 6mm; margin: 0 0 3mm; }
  .massstab div { width: 50mm; height: 3mm; border: .35mm solid var(--braun); border-top: 0; margin-top: 4mm; }

  @page { size: A4 portrait; margin: 0; }
  @media print {
    body { background: #fff; }
    .steuerung { display: none; }
    .vorschau { padding: 0; }
    .blatt { margin: 0; box-shadow: none; break-after: page; page-break-after: always; }
    .blatt:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div class="steuerung">
  <h1>Druckvorlage SimOil</h1>
  <p>A4 hochformatig, 4 Lose (A6) pro Blatt, Schnittmarken an den Schnittkanten, farbig. Im Druckdialog
    <b>Skalierung 100 %</b> und <b>Hintergrundgrafiken an</b> wählen. Zuerst das Testblatt drucken und die Linie von 50 mm nachmessen.</p>
  <div id="meldung"></div>
  <div class="reihe">
    <label>Was drucken
      <select id="auswahl">
        <option value="alle">Alle Lose</option>
        <option value="test">Testblatt (1 Los)</option>
        <option value="bereich">Lose von–bis</option>
      </select>
    </label>
    <label id="l-tag">Los <input type="number" id="tag" min="1" max="31" value="1"></label>
    <label id="l-bis">bis <input type="number" id="bis" min="1" max="31" value="24"></label>
  </div>
  <div class="reihe">
    <label>Feldbreite mm <input type="number" id="feldB" step="0.5" min="10" max="45"></label>
    <label>Feldhöhe mm <input type="number" id="feldH" step="0.5" min="10" max="45"></label>
    <label>Abstand mm <input type="number" id="abstand" step="0.5" min="0" max="30"></label>
    <label>QR-Grösse mm <input type="number" id="qr" step="0.5" min="8" max="30"></label>
    <label>Kürzel pt <input type="number" id="kuerzelPt" step="0.5" min="5" max="16"></label>
    <label>Rand mm <input type="number" id="rand" step="0.5" min="2" max="12"></label>
    <label>Anordnung
      <select id="anordnung">
        <option value="2x2">2 × 2</option>
        <option value="4x1">4 nebeneinander</option>
        <option value="1x4">4 untereinander</option>
      </select>
    </label>
    <label class="haken"><input type="checkbox" id="stern"> Stern «NEU: ADVENTSRUBBEL»</label>
  </div>
  <div class="reihe">
    <button id="drucken">Drucken</button>
    <button class="zweit" id="zuruecksetzen">Masse zurücksetzen</button>
    <button class="zweit" id="beispiel" hidden>Beispieldaten zeigen</button>
  </div>
</div>
<div class="vorschau" id="vorschau"></div>

<script src="config.js"></script>
<script src="kern.js"></script>
<script src="grafik.js"></script>
<script src="lib/qrcode.js"></script>
<script src="druck.js"></script>
</body>
</html>
