 {k:"orr",ab:"ORR",de:"Oberrheinrat",fr:"Conseil Rhénan",ev:[["03-12","Kommission Verkehr - Raumordnung - Bevölkerungsschutz und -entwicklung, Freiburg i. Br.","Commission Transport - Aménagement du territoire - Protection et évolution des populations, Fribourg-en-Brisgau"],["03-15","Kommission Landwirtschaft - Umwelt - Klima - Energie","Commission Agriculture - Environnement - Climat - Energie"],["03-22","Kommission Wirtschaft - Arbeitsmarkt - Gesundheit","Commission Economie - Marché du travail - Santé"],["05-10","Kommission Wirtschaft - Arbeitsmarkt - Gesundheit (Zusatztermin), Videokonferenz","Commission Economie - Marché du travail - Santé (date supplémentaire), visioconférence"],["05-14","Vorstandssitzung, Strasbourg","Séance du Bureau, Strasbourg"],["05-24","Kommission Landwirtschaft - Umwelt - Klima - Energie","Commission Agriculture - Environnement - Climat - Energie"],["06-11","1. Plenarversammlung, Strasbourg","1re séance plénière, Strasbourg",1],["09-17","Kommission Verkehr - Raumordnung - Bevölkerungsschutz und -entwicklung, Freiburg i. Br.","Commission Transport - Aménagement du territoire - Protection et évolution des populations, Fribourg-en-Brisgau"],["09-20","Kommission Landwirtschaft - Umwelt - Klima - Energie","Commission Agriculture - Environnement - Climat - Energie"],["10-11","Kommission Wirtschaft - Arbeitsmarkt - Gesundheit","Commission Economie - Marché du travail - Santé"],["11-05","Vorstandssitzung, Strasbourg","Séance du Bureau, Strasbourg"],["11-08","Kommission Wirtschaft - Arbeitsmarkt - Gesundheit (Zusatztermin), Videokonferenz","Commission Economie - Marché du travail - Santé (date supplémentaire), visioconférence"],["12-03","2. Plenarversammlung, Strasbourg","2e séance plénière, Strasbourg",1]],
  src:[["Oberrheinrat, Eventarchiv 2027","https://www.oberrheinrat.org/de/termine/eventarchiv.html?year=2027"],["Conseil Rhénan, événements 2027","https://www.conseilrhenan.org/fr/evenements/eventarchiv.html?year=2027"]]},
 {k:"ork",ab:"ORK",de:"Oberrheinkonferenz",fr:"Conférence du Rhin supérieur",ev:[["06-03","1. Präsidium","1er comité directeur"],["10-08","2. Präsidium","2e comité directeur"],["12-09","53. Plenum","53e séance plénière",1]],
  src:[["Oberrheinkonferenz, Terminplanung 2027 (Stand 20.11.2026)",""]]}
];
const MDE=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MFR=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const WD=["di","lu","ma","me","je","ve","sa"];
const WDFR=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const WDDE=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const key=(m,d)=>String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
const fmt=k=>{const[m,d]=k.split("-");return d+"."+m+".";};
const wdOf=k=>wdK(k);
const short=s=>s.split(" (")[0];
// Sprache: fr, de oder both (zweisprachig)
const WDD=["So","Mo","Di","Mi","Do","Fr","Sa"];
let LANG="both";
try{LANG=localStorage.getItem("ferien-lang")||"";}catch(e){}
if(!["fr","de","both"].includes(LANG))LANG=(navigator.language||"").toLowerCase().startsWith("de")?"de":"fr";
const tx=(f,d)=>LANG==="fr"?f:LANG==="de"?d:`${f} / ${d}`;
const tm=(f,d)=>LANG==="fr"?f:LANG==="de"?d:`${f} <span class="fr">/ ${d}</span>`;
const tl=(f,d)=>LANG==="fr"?f:LANG==="de"?d:`${f}<span class="fr">${d}</span>`;
const nm=o=>LANG==="de"?o.de:o.fr;
const sn=r=>short(nm(r));
const wdA=()=>LANG==="de"?WDD:WD;
const wdK=k=>{const[m,d]=k.split("-").map(Number);return wdA()[new Date(2027,m-1,d).getDay()];};
const GROUPS={all:R.map(r=>r.k),ch:["bas","bl","so","ag","ju"],de:["bw","rp"],fr:["als"]};

// Zustand
let st={on:R.map(r=>r.k),vac:true,hol:true,sit:true,xb:XB.map(x=>x.k),plan:false,sel:"02-15"};
try{const v=JSON.parse(localStorage.getItem("ferien-2027")||"null");if(v&&Array.isArray(v.on))st={...st,...v};if(!Array.isArray(st.xb))st.xb=XB.map(x=>x.k);}catch(e){}
const save=()=>{try{localStorage.setItem("ferien-2027",JSON.stringify(st));}catch(e){}};
const active=()=>R.filter(r=>st.on.includes(r.k));
const status=(r,k)=>({f:r.fer.find(x=>k>=x[0]&&k<=x[1]),h:r.hol.find(x=>x[0]===k),s:PARL[r.k]?PARL[r.k].s.find(x=>k>=x[0]&&k<=x[1]):null});
const sLab=(r,s)=>PARL[r.k][s[2]];
const xbOn=k=>XB.filter(x=>st.xb.includes(x.k)).flatMap(x=>x.ev.filter(e=>e[0]===k).map(e=>({x,e})));
const xbAll=k=>XB.flatMap(x=>x.ev.filter(e=>e[0]===k).map(e=>({x,e})));

// Chips
const chips=document.getElementById("chips");
R.forEach(r=>{
  const b=document.createElement("button");b.type="button";b.className="chip";b.dataset.k=r.k;b.style.setProperty("--c",`var(--${r.k})`);
  b.addEventListener("click",()=>{st.on=st.on.includes(r.k)?st.on.filter(x=>x!==r.k):R.map(x=>x.k).filter(x=>x===r.k||st.on.includes(x));render();});
  chips.appendChild(b);
});

const xchips=document.getElementById("xchips");
XB.forEach(x=>{
  const b=document.createElement("button");b.type="button";b.className="chip xchip";b.dataset.x=x.k;b.style.setProperty("--c",`var(--${x.k})`);
  b.addEventListener("click",()=>{st.xb=st.xb.includes(x.k)?st.xb.filter(y=>y!==x.k):XB.map(y=>y.k).filter(y=>y===x.k||st.xb.includes(y));render();});

const tog=(id,p)=>document.getElementById(id).addEventListener("click",()=>{st[p]=!st[p];render();});
tog("tVac","vac");tog("tHol","hol");tog("tSit","sit");tog("tPlan","plan");

// Kalender aufbauen (einmal), dann nur aktualisieren
const cal=document.getElementById("cal");const cells={};const mcnt={};
for(let m=1;m<=12;m++){
  const col=document.createElement("div");col.className="month";
  col.innerHTML=`<div class="mh"><span class="mn"></span><span class="cnt" hidden></span></div>`;
  mcnt[m]=col.querySelector(".cnt");
  const days=new Date(2027,m,0).getDate();
  for(let d=1;d<=31;d++){
    if(d>days){const e=document.createElement("div");e.className="day empty";col.appendChild(e);continue;}
    const k=key(m,d),dow=new Date(2027,m-1,d).getDay();
    const b=document.createElement("button");b.type="button";b.id="d"+k;b.dataset.k=k;b.dataset.dow=dow;
    b.innerHTML=`<span class="dn">${d}</span><span class="mk"></span><span class="wd"></span><span class="sq"></span><span class="lanes"></span>`;
    b.addEventListener("click",()=>{st.sel=k;render();});
    col.appendChild(b);cells[k]=b;
  }
  cal.appendChild(col);
}

function render(){
  save();
  const A=active();
  document.querySelectorAll(".chip:not(.xchip)").forEach(c=>c.setAttribute("aria-pressed",st.on.includes(c.dataset.k)));
  document.querySelectorAll(".xchip").forEach(c=>c.setAttribute("aria-pressed",st.xb.includes(c.dataset.x)));
  document.getElementById("tSit").setAttribute("aria-pressed",st.sit);
  document.getElementById("tVac").setAttribute("aria-pressed",st.vac);
  document.getElementById("tHol").setAttribute("aria-pressed",st.hol);
  document.getElementById("tPlan").setAttribute("aria-pressed",st.plan);
  cal.classList.toggle("plan",st.plan);
  let freeTotal=0;const perM={};
  for(const k in cells){
    const b=cells[k],dow=+b.dataset.dow,m=+k.slice(0,2);
    let sq="",lanes="",anyH=false,busy=false,tips=[],pl=false,co=false;
    const X=xbOn(k);X.forEach(({x,e})=>{sq+=`<em style="--c:var(--${x.k})">${x.ab}</em>`;tips.push(`${nm(x)} : ${tx(e[2],e[1])}`);if(st.sit&&e[3])busy=true;});
    A.forEach(r=>{
      const s=status(r,k);
      if(s.h){if(!s.h[3])busy=true;anyH=true;if(st.hol)sq+=`<b class="${s.h[3]?"reg":""}" style="--c:var(--${r.k})"></b>`;tips.push(`${sn(r)} : ${tx(s.h[2],s.h[1])}`);}
      if(s.f){busy=true;tips.push(`${sn(r)} : ${tx(s.f[3],s.f[2])}`);}
      if(st.sit&&s.s){const L=sLab(r,s.s);if(s.s[2]==="c")co=true;else{pl=true;busy=true;}tips.push(`${nm(PARL[r.k])} : ${tx(L[1],L[0])}`);}
      if(st.vac)lanes+=`<s class="${s.f?"":"off"}" style="--c:var(--${r.k})"></s>`;
    });
    const free=A.length>0&&dow!==0&&dow!==6&&!busy;
    if(free){freeTotal++;perM[m]=(perM[m]||0)+1;}
    b.className="day"+((dow===0||dow===6)?" we":"")+(pl?" pl":"")+(anyH&&st.hol?" hol":"")+(free?" free":"")+(k===st.sel?" sel":"")+(aptDays.has(k)?" apt":"");
    b.querySelector(".sq").innerHTML=sq;b.querySelector(".lanes").innerHTML=lanes;
    const [mm,dd]=k.split("-");b.querySelector(".wd").textContent=wdA()[dow];
    b.title=`${+dd}.${+mm}.2027`+(tips.length?"\n"+tips.join("\n"):"");
    b.setAttribute("aria-label",b.title.replace(/\n/g,"; "));
  }
  for(let m=1;m<=12;m++){mcnt[m].hidden=!st.plan;mcnt[m].textContent=perM[m]||0;mcnt[m].title=`${perM[m]||0} ${tx("jours ouvrables libres","freie Werktage")}`;}
  const pi=document.getElementById("planinfo");pi.hidden=!st.plan;
  pi.textContent=A.length?tx(`${freeTotal} jours ouvrables libres pour la sélection${st.sit?" (sans séances plénières)":""}`,`${freeTotal} freie Werktage für die Auswahl${st.sit?" (ohne Plenarsitzungen)":""}`):tx("Aucune collectivité sélectionnée","Kein Gebiet ausgewählt");
  renderDetail(A);
  document.querySelectorAll(".reg-card[data-k]").forEach(c=>c.hidden=!st.on.includes(c.dataset.k));
  document.querySelectorAll(".reg-card[data-x]").forEach(c=>c.hidden=!st.xb.includes(c.dataset.x));
}

function renderDetail(A){
  const k=st.sel,[m,d]=k.split("-").map(Number),dow=new Date(2027,m-1,d).getDay();
  const items=A.map(r=>{
    const s=status(r,k);let t="";
    const fr=LANG==="de";
    if(s.h)t+=`<span class="tag h">${s.h[3]?(fr?"Teilw. Feiertag":"Férié partiel"):(fr?"Feiertag":"Férié")}</span>${tm(s.h[2],s.h[1])}<br>`;
    if(s.f)t+=`<span class="tag v">${s.f[0]===s.f[1]?(fr?"Schulfrei":"Congé"):(fr?"Ferien":"Vacances")}</span>${tm(s.f[3],s.f[2])}`;
    if(st.sit&&s.s){const L=sLab(r,s.s);t+=`${t?"<br>":""}<span class="tag ${s.s[2]==="c"?"c":"p"}">${fr?"Parlament":"Parlement"}</span>${tm(L[1],L[0])}`;}
    if(!t)t=(dow===0||dow===6)?tm("Week-end","Wochenende"):tm("Jour ouvrable","Werktag");
    return `<div class="ditem${!s.h&&!s.f&&!(st.sit&&s.s)?" free":""}" style="--c:var(--${r.k})"><i></i><div><strong>${sn(r)}</strong> – ${t}</div></div>`;
  }).join("");
  const xi=xbOn(k).map(({x,e})=>`<div class="ditem" style="--c:var(--${x.k})"><i></i><div><strong>${tm(x.fr,x.de)}</strong> – <span class="tag x" style="--c:var(--${x.k})">${x.ab}</span>${tm(e[2],e[1])}</div></div>`).join("");
  document.getElementById("detail").innerHTML=`<h3>${LANG==="de"?`${WDDE[dow]}, ${d}. ${MDE[m-1]} 2027`:`${WDFR[dow]} ${d} ${MFR[m-1]} 2027`}${LANG==="both"?`<small>${WDDE[dow]}, ${d}. ${MDE[m-1]} 2027</small>`:""}</h3><div class="dlist">${xi}${items||`<span class="fr">${tx("Aucune collectivité sélectionnée","Kein Gebiet ausgewählt")}</span>`}</div>`;
}

// Liste
function parlHtml(r){
  const P=PARL[r.k];if(!P)return "";
  const rows=P.s.map(s=>`<tr><td>${tl(P[s[2]][1],P[s[2]][0])}</td><td><a href="#d${s[0]}" class="jump" data-k="${s[0]}">${s[0]===s[1]?`${wdOf(s[0])} ${fmt(s[0])}2027`:`${wdOf(s[0])} ${fmt(s[0])} – ${wdOf(s[1])} ${fmt(s[1])}2027`}</a></td></tr>`).join("");
  const src=P.src.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join("");
  const np=P.s.filter(s=>s[2]!=="c").length;
  const sf=`Séances : ${P.fr} (${np} plénières${P.s.length>np?`, ${P.s.length-np} autres`:""})`,sd=`Sitzungen: ${P.de} (${np} Plenarsitzungen${P.s.length>np?`, ${P.s.length-np} weitere`:""})`;
  return `<details><summary>${LANG==="both"?`${sf} <span class="fr">/ Sitzungen ${P.de}</span>`:tx(sf,sd)}</summary>
    <table><tbody>${rows}</tbody></table>
    ${P.nfr?`<div class="small">${tx(P.nfr,P.nde).replace(" / ","<br>")}</div>`:""}
    <div class="src"><strong>${tx("Sources :","Quellen:")}</strong><ul style="margin:4px 0 0;padding-left:18px">${src}</ul></div></details>`;
}
const list=document.getElementById("list");
function buildList(){
list.innerHTML="";
R.forEach(r=>{
  const ferRows=r.fer.map(f=>`<tr><td>${tl(f[3],f[2])}</td><td><a href="#d${f[0]}" class="jump" data-k="${f[0]}">${wdOf(f[0])} ${fmt(f[0])} – ${wdOf(f[1])} ${fmt(f[1])}2027</a></td></tr>`).join("");
  const part=r.hol.some(x=>x[3]);
  const holDe=r.hol.map(x=>`${fmt(x[0])} ${x[1]}${x[3]?"*":""}`).join(" · ");
  const holFr=r.hol.map(x=>`${fmt(x[0])} ${x[2]}${x[3]?"*":""}`).join(" · ");
  const src=r.src.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join("");
  list.insertAdjacentHTML("beforeend",`<section class="reg-card" data-k="${r.k}" style="--c:var(--${r.k})">
    <h3>${LANG==="both"?`${r.fr} <span>/ ${r.de}</span>`:nm(r)}</h3>
    <table><tbody>${ferRows}</tbody></table>
    ${LANG!=="de"?`<div class="small"><strong>Jours fériés :</strong> ${holFr}${part?" (* dans une partie des communes seulement ou demi-journée)":""}</div>`:""}
    ${LANG!=="fr"?`<div class="small${LANG==="both"?" fr":""}"><strong>Feiertage:</strong> ${holDe}${part?" (* nur in einem Teil der Gemeinden bzw. halbtags)":""}</div>`:""}
    <div class="small">${LANG==="both"?`${r.nfr}<br><span class="fr">${r.nde}</span>`:tx(r.nfr,r.nde)}</div>
    <div class="src"><strong>${tx("Sources :","Quellen:")}</strong><ul style="margin:4px 0 0;padding-left:18px">${src}</ul></div>
    ${parlHtml(r)}
  </section>`);
});
XB.forEach(x=>{
  const rows=x.ev.map(e=>`<tr><td>${tl(e[2],e[1])}</td><td><a href="#d${e[0]}" class="jump" data-k="${e[0]}">${wdOf(e[0])} ${fmt(e[0])}2027</a></td></tr>`).join("");
  const src=x.src.map(s=>`<li>${s[1]?`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`:s[0]}</li>`).join("");
  list.insertAdjacentHTML("beforeend",`<section class="reg-card" data-x="${x.k}" style="--c:var(--${x.k})">
    <h3>${LANG==="both"?`${x.fr} <span>/ ${x.de}</span>`:nm(x)}</h3>
    <table><tbody>${rows}</tbody></table>
    <div class="src"><strong>${tx("Source :","Quelle:")}</strong><ul style="margin:4px 0 0;padding-left:18px">${src}</ul></div>
  </section>`);
});
list.querySelectorAll(".jump").forEach(a=>a.style.color="var(--head)");
}
list.addEventListener("click",e=>{const a=e.target.closest(".jump");if(!a)return;e.preventDefault();st.sel=a.dataset.k;render();
  const c=cells[a.dataset.k];c.scrollIntoView({block:"center",inline:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});c.focus({preventScroll:true});});

// ---- Termine (im Browser gespeichert) ----
const APT_KEY="ferien-2027-termine";
let apts=[],aptDays=new Set(),stored=true;
try{const v=JSON.parse(localStorage.getItem(APT_KEY)||"[]");if(Array.isArray(v))apts=v.filter(a=>a&&a.start&&Array.isArray(a.regions));}catch(e){stored=false;}
const saveApts=()=>{try{localStorage.setItem(APT_KEY,JSON.stringify(apts));}catch(e){stored=false;}};
const aRegs=document.getElementById("aRegs");
R.forEach(r=>aRegs.insertAdjacentHTML("beforeend",`<label><input type="checkbox" id="ar-${r.k}" value="${r.k}" checked> <span class="an" data-k="${r.k}"></span></label>`));
const iso2k=v=>v?v.slice(5):"";
const kDate=k=>{const[m,d]=k.split("-").map(Number);return new Date(2027,m-1,d);};
const daysBetween=(a,b)=>{const out=[];let d=kDate(a);const e=kDate(b);while(d<=e){out.push(key(d.getMonth()+1,d.getDate()));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);}return out;};
const fmtK=k=>{const[m,d]=k.split("-").map(Number);const w=new Date(2027,m-1,d).getDay();return `${wdA()[w]} ${String(d).padStart(2,"0")}.${String(m).padStart(2,"0")}.2027`;};
function check(a){
  const regs=R.filter(r=>a.regions.includes(r.k));const hard=[],soft=[];
  daysBetween(a.start,a.end||a.start).forEach(k=>{
    const dow=kDate(k).getDay();
    if(dow===0||dow===6)soft.push({k,txt:tm("Week-end","Wochenende")});
    regs.forEach(r=>{const s=status(r,k);
      if(s.h)(s.h[3]?soft:hard).push({k,r,txt:`${s.h[3]?tx("Férié partiel","Teilweise Feiertag"):tx("Férié","Feiertag")} : ${tm(s.h[2],s.h[1])}`});
      if(s.f)hard.push({k,r,txt:`${s.f[0]===s.f[1]?tx("Congé scolaire","Schulfrei"):tx("Vacances","Ferien")} : ${tm(s.f[3],s.f[2])}`});
      if(s.s&&s.s[2]!=="c"){const L=sLab(r,s.s);soft.push({k,r,txt:`${nm(PARL[r.k])} : ${tm(L[1],L[0])}`});}});
    xbAll(k).forEach(({x,e})=>soft.push({k,txt:`<strong>${x.ab}</strong> : ${tm(e[2],e[1])}`}));
  });
  return {hard,soft,state:hard.length?"bad":soft.length?"warn":"ok"};
}
const BADGES={ok:["Aucun conflit","Kein Konflikt"],warn:["À vérifier","Prüfen"],bad:["Conflit","Konflikt"]};
const badge=k=>tx(...BADGES[k]);
function issuesHtml(c){return [...c.hard,...c.soft].map(i=>`<li>${fmtK(i.k)}${i.r?` – <strong>${sn(i.r)}</strong>`:""} : ${i.txt}</li>`).join("");}
function formApt(){let a=iso2k(document.getElementById("aStart").value),b=iso2k(document.getElementById("aEnd").value);
  if(b&&b<a)[a,b]=[b,a];return {start:a,end:b&&b!==a?b:"",regions:R.map(r=>r.k).filter(k=>document.getElementById("ar-"+k).checked)};}
function preview(){const a=formApt(),el=document.getElementById("aPreview");
  if(!a.start||!document.getElementById("aStart").value.startsWith("2027")){el.textContent=tx("Choisir une date en 2027","Datum in 2027 wählen");return;}
  if(!a.regions.length){el.textContent=tx("Aucune collectivité cochée","Kein Gebiet gewählt");return;}
  const c=check(a);el.innerHTML=`${tx("Aperçu","Vorschau")} : <strong style="color:${c.state==="ok"?"var(--okfg)":c.state==="warn"?"var(--muted)":"var(--flag)"}">${badge(c.state)}</strong>${c.hard.length+c.soft.length?` (${c.hard.length+c.soft.length})`:""}`;}
document.getElementById("aptForm").addEventListener("input",preview);
function renderApts(){
  aptDays=new Set();apts.forEach(a=>daysBetween(a.start,a.end||a.start).forEach(k=>aptDays.add(k)));
  const L=document.getElementById("aList");
  if(!apts.length){L.innerHTML=`<p class="empty-apt">${LANG==="both"?`Aucun rendez-vous enregistré. Saisissez une date ci-dessus ; chaque rendez-vous est vérifié contre les vacances, jours fériés et séances plénières des collectivités cochées ainsi que les séances du Conseil Rhénan et de la Conférence du Rhin supérieur.<br><span class="fr">Noch keine Termine erfasst. Datum oben eingeben; jeder Termin wird mit den Ferien, Feiertagen und Plenarsitzungen der angekreuzten Gebiete sowie den Sitzungen von Oberrheinrat und Oberrheinkonferenz abgeglichen.</span>`:tx(`Aucun rendez-vous enregistré. Saisissez une date ci-dessus ; chaque rendez-vous est vérifié contre les vacances, jours fériés et séances plénières des collectivités cochées ainsi que les séances du Conseil Rhénan et de la Conférence du Rhin supérieur.`,`Noch keine Termine erfasst. Datum oben eingeben; jeder Termin wird mit den Ferien, Feiertagen und Plenarsitzungen der angekreuzten Gebiete sowie den Sitzungen von Oberrheinrat und Oberrheinkonferenz abgeglichen.`)}</p>`;}
  else L.innerHTML=[...apts].sort((x,y)=>x.start.localeCompare(y.start)).map(a=>{const c=check(a);
    const when=a.end?`${fmtK(a.start)} – ${fmtK(a.end)}`:fmtK(a.start);
    const regs=a.regions.length===R.length?tx("Toutes les collectivités","Alle Gebiete"):R.filter(r=>a.regions.includes(r.k)).map(r=>sn(r)).join(", ");
    return `<div class="apt-item ${c.state}"><span class="badge">${badge(c.state)}</span><div style="min-width:0"><h4><button type="button" data-go="${a.start}">${when}</button></h4><div class="meta">${regs}</div>${c.state!=="ok"?`<ul>${issuesHtml(c)}</ul>`:""}</div><button class="del" type="button" data-del="${a.id}">${tx("Supprimer","Löschen")}</button></div>`;}).join("");
  note(stored?tx("Les rendez-vous sont enregistrés uniquement dans ce navigateur.","Termine werden nur in diesem Browser gespeichert."):tx("Les rendez-vous ne sont conservés que pendant cette visite.","Termine bleiben nur während dieses Besuchs erhalten."));
  render();
}
document.getElementById("aList").addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g){st.sel=g.dataset.go;render();cells[g.dataset.go].scrollIntoView({block:"center",inline:"center"});return;}
  const d=e.target.closest("[data-del]");if(!d)return;
  if(d.dataset.armed!=="1"){d.dataset.armed="1";d.textContent=tx("Confirmer","Bestätigen");setTimeout(()=>{if(d.isConnected){d.dataset.armed="";d.textContent=tx("Supprimer","Löschen");}},4000);return;}
  apts=apts.filter(a=>a.id!==d.dataset.del);saveApts();renderApts();
});
const note=t=>document.getElementById("aNotice").textContent=t;
document.getElementById("aptForm").addEventListener("submit",e=>{
  e.preventDefault();const a=formApt();
  if(!a.start||!a.regions.length){preview();return;}
  a.created=new Date().toISOString();a.id="t"+Date.now();
  apts.push(a);saveApts();renderApts();
});
function applyLang(){
  try{localStorage.setItem("ferien-lang",LANG);}catch(e){}
  document.documentElement.lang=LANG==="de"?"de":"fr";
  document.title=tx("Vacances Rhin supérieur 2027","Ferien Oberrhein 2027");
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  document.querySelectorAll("[data-fr]").forEach(el=>{const f=el.dataset.fr,d=el.dataset.de,m=el.dataset.m;
    if(m==="h")el.innerHTML=LANG==="both"?`${f}<small>${d}</small>`:tx(f,d);
    else if(m==="p")el.innerHTML=LANG==="both"?`<p>${f}</p><p class="fr">${d}</p>`:`<p>${tx(f,d)}</p>`;
    else if(m==="x")el.textContent=tx(f,d);
    else el.innerHTML=tm(f,d);});
  document.querySelectorAll(".chip[data-k]").forEach(b=>{const r=R.find(x=>x.k===b.dataset.k);
    b.innerHTML=`<i></i>${LANG==="both"?`${short(r.fr)}${short(r.fr)!==short(r.de)?` <span class="fr">/ ${short(r.de)}</span>`:""}`:sn(r)}`;});
  document.querySelectorAll(".xchip").forEach(b=>{const x=XB.find(y=>y.k===b.dataset.x);b.innerHTML=`<i></i>${tm(x.fr,x.de)}`;});
  document.querySelectorAll(".an").forEach(el=>el.textContent=sn(R.find(r=>r.k===el.dataset.k)));
  document.querySelectorAll(".mn").forEach((el,i)=>{const f=MFR[i][0].toUpperCase()+MFR[i].slice(1);el.innerHTML=LANG==="both"?`${f} <em>/ ${MDE[i]}</em>`:tx(f,MDE[i]);});
  buildList();renderApts();preview();
}
document.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{LANG=b.dataset.lang;applyLang();}));
applyLang();
</script>
