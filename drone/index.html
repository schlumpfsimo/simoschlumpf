<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Interceptor</title>
  <meta name="description" content="FPV interceptor drone game" />
  <style>
    html,body{ margin:0; height:100%; background:#000; overflow:hidden; }
    canvas{
      position:absolute; left:50%; top:50%;
      transform:translate(-50%,-50%);
      image-rendering:pixelated; image-rendering:crisp-edges;
      outline:none;
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
THREE.ColorManagement.enabled = false;

// ---------------------------------------------------------------- setup
const W = 320, H = 240;
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const cv = renderer.domElement;
document.body.appendChild(cv);
function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
addEventListener('resize', fit); fit();

let clock = 0, last = performance.now();
const scene = new THREE.Scene();
const FOG = new THREE.Color();
scene.fog = new THREE.FogExp2(FOG, 0.0003);
const camera = new THREE.PerspectiveCamera(100, W / H, 0.04, 22000);
scene.add(camera);
const rt = new THREE.WebGLRenderTarget(W, H, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter });

// ---------------------------------------------------------------- noise helpers
function hash2(x, y){
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct = 4){
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++){ s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; }
  return s;
}
let seed = 1337;
function rnd(){ seed = (seed + 0x6D2B79F5) | 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const rr = (a, b) => a + (b - a) * rnd();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2832 * v); };

// ---------------------------------------------------------------- terrain
const SIZE = 16000, SEG = 400, CELL = SIZE / SEG, HALF = SIZE / 2;
const heights = new Float32Array((SEG + 1) * (SEG + 1));
for (let iz = 0; iz <= SEG; iz++) for (let ix = 0; ix <= SEG; ix++){
  const x = -HALF + ix * CELL, z = -HALF + iz * CELL;
  const flat = Math.min(1, Math.hypot(x, z) / 500);
  heights[iz * (SEG + 1) + ix] = ((fbm(x / 1500 + 10, z / 1500 + 10) - 0.47) * 90 + Math.sin(x / 900) * 6) * flat;
}
function groundAt(x, z){
  const gx = clamp((x + HALF) / CELL, 0, SEG - 0.001), gz = clamp((z + HALF) / CELL, 0, SEG - 0.001);
  const ix = Math.floor(gx), iz = Math.floor(gz), fx = gx - ix, fz = gz - iz;
  const r = SEG + 1;
  const h00 = heights[iz * r + ix], h10 = heights[iz * r + ix + 1], h01 = heights[(iz + 1) * r + ix], h11 = heights[(iz + 1) * r + ix + 1];
  if (fx + fz <= 1) return h00 + (h10 - h00) * fx + (h01 - h00) * fz;
  return h11 + (h01 - h11) * (1 - fx) + (h10 - h11) * (1 - fz);
}

// ---------------------------------------------------------------- map layout
// rotated field grid (u along rows, v across)
const FA = 0.33, FW = 420, FH = 230, ca = Math.cos(FA), sa = Math.sin(FA);
const toField = (x, z) => [x * ca + z * sa, -x * sa + z * ca];
const fromField = (u, v) => [u * ca - v * sa, u * sa + v * ca];
const roadX = z => 160 + 90 * Math.sin(z / 650);
const roadZ = x => 2600 + 140 * Math.sin(x / 900);
const CITY = { x0: -2700, x1: 2700, z0: 6000, z1: 7700 };
const inCity = (x, z) => x > CITY.x0 - 60 && x < CITY.x1 + 60 && z > CITY.z0 - 60 && z < CITY.z1 + 60;
const nearRoad = (x, z, d) => Math.abs(x - roadX(z)) < d || Math.abs(z - roadZ(x)) < d;
const VILLAGES = [[-420, -260], [700, 900]];
for (let k = 0; k < 400 && VILLAGES.length < 18; k++){
  const x = rr(-6800, 6800), z = rr(-6800, 5300);
  if (Math.hypot(x, z) < 700 || VILLAGES.some(v => Math.hypot(v[0] - x, v[1] - z) < 1500)) continue;
  VILLAGES.push([x, z]);
}
const FARMS = [];
for (let k = 0; k < 400 && FARMS.length < 12; k++){
  const x = rr(-6500, 6500), z = rr(-6500, 5200);
  if (Math.hypot(x, z) < 400 || VILLAGES.some(v => Math.hypot(v[0] - x, v[1] - z) < 700) || FARMS.some(v => Math.hypot(v[0] - x, v[1] - z) < 1200)) continue;
  FARMS.push([x, z, rr(0, 3.14)]);
}

function makeGroundTexture(){
  const TS = 2048, c = document.createElement('canvas');
  c.width = c.height = TS;
  const g = c.getContext('2d'), img = g.createImageData(TS, TS), d = img.data;
  const TYPES = [[0.25, 0.215, 0.18], [0.50, 0.46, 0.39], [0.33, 0.34, 0.28], [0.41, 0.38, 0.32], [0.30, 0.28, 0.25], [0.45, 0.43, 0.36]];
  const near = [...VILLAGES.map(v => [v[0], v[1], 300]), ...FARMS.map(v => [v[0], v[1], 110])];
  for (let py = 0; py < TS; py++){
    const z = -HALF + (py + 0.5) / TS * SIZE;
    for (let px = 0; px < TS; px++){
      const x = -HALF + (px + 0.5) / TS * SIZE;
      let col, m;
      if (x > CITY.x0 && x < CITY.x1 && z > CITY.z0 && z < CITY.z1){
        const sx = (x - CITY.x0) % 140, sz = (z - CITY.z0) % 140;
        col = (sx < 18 || sz < 18) ? [0.30, 0.30, 0.29] : [0.44, 0.43, 0.40];
        m = 0.85 + 0.3 * vnoise(x / 15, z / 15);
      } else {
        const [u, v] = toField(x, z);
        const i = Math.floor(u / FW), j = Math.floor(v / FH);
        col = TYPES[Math.floor(hash2(i + 100, j + 300) * TYPES.length)];
        m = 0.62 + 0.75 * fbm(x / 90, z / 90, 3);
        const fu = u - i * FW, fv = v - j * FH;
        if ((fv < 7 && hash2(j, 7) < 0.6) || (fu < 6 && hash2(i, 9) < 0.4)) { col = [0.47, 0.44, 0.38]; m = 0.9 + 0.2 * vnoise(x / 20, z / 20); }
        for (const [vx, vz, r] of near){
          const dx = x - vx, dz = z - vz;
          if (dx > r || dx < -r || dz > r || dz < -r) continue;
          const dv = Math.sqrt(dx * dx + dz * dz);
          if (dv < r){ const k = (1 - dv / r) * 0.5; col = [col[0] * (1 - k) + 0.40 * k, col[1] * (1 - k) + 0.38 * k, col[2] * (1 - k) + 0.32 * k]; }
        }
      }
      if (Math.abs(x - roadX(z)) < 6 || Math.abs(z - roadZ(x)) < 5) { col = [0.34, 0.335, 0.32]; m = 0.95 + 0.1 * hash2(px, py); }
      const o = (py * TS + px) * 4;
      d[o] = clamp(col[0] * m * 255, 0, 255); d[o + 1] = clamp(col[1] * m * 255, 0, 255); d[o + 2] = clamp(col[2] * m * 255, 0, 255); d[o + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const P = (x, z) => [(x + HALF) / SIZE * TS, (z + HALF) / SIZE * TS];
  // trench lines near the front
  g.strokeStyle = 'rgba(28,24,20,0.85)'; g.lineWidth = 1.2;
  for (let t = 0; t < 7; t++){
    let x = rr(-7500, -3000), z = rr(-7000, -3500);
    g.beginPath(); g.moveTo(...P(x, z));
    for (let s = 0; s < 120; s++){ x += rr(20, 70); z += rr(-40, 40) + (s % 2 ? 25 : -25); g.lineTo(...P(x, z)); }
    g.stroke();
  }
  // shell craters, dense near the front
  for (let k = 0; k < 5000; k++){
    const cx = rr(-7600, 7600), cz = rnd() < 0.7 ? rr(-7600, -2000) : rr(-2000, 5500);
    if (inCity(cx, cz)) continue;
    const [px, py] = P(cx, cz), r = rr(0.5, 2.2);
    g.fillStyle = 'rgba(150,140,120,0.5)'; g.beginPath(); g.arc(px, py, r + 0.8, 0, 7); g.fill();
    g.fillStyle = 'rgba(30,26,22,0.8)'; g.beginPath(); g.arc(px, py, r, 0, 7); g.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.flipY = false;
  tex.anisotropy = 4;
  return tex;
}
function makeDetailTexture(){
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S), d = img.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++){
    const n = 0.35 * hash2(x, y) + 0.4 * vnoise(x / 4, y / 4) + 0.25 * (0.5 + 0.5 * Math.sin((x + 3 * vnoise(x / 9, y / 9)) * 0.75));
    const v = clamp(n * 255, 0, 255), o = (y * S + x) * 4;
    d[o] = d[o + 1] = d[o + 2] = v; d[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

{
  const pos = [], uv = [], idx = [];
  for (let iz = 0; iz <= SEG; iz++) for (let ix = 0; ix <= SEG; ix++){
    pos.push(-HALF + ix * CELL, heights[iz * (SEG + 1) + ix], -HALF + iz * CELL);
    uv.push(ix / SEG, iz / SEG);
  }
  const r = SEG + 1;
  for (let iz = 0; iz < SEG; iz++) for (let ix = 0; ix < SEG; ix++){
    const a = iz * r + ix, b = (iz + 1) * r + ix, c = a + 1, d = b + 1;
    idx.push(a, b, c, b, d, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const detail = makeDetailTexture();
  const mat = new THREE.MeshLambertMaterial({ map: makeGroundTexture() });
  mat.onBeforeCompile = sh => {
    sh.uniforms.detailMap = { value: detail };
    sh.vertexShader = 'varying vec3 vW;\n' + sh.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      vW = (modelMatrix * vec4(transformed, 1.0)).xyz;
    `);
    sh.fragmentShader = 'uniform sampler2D detailMap;\nvarying vec3 vW;\nfloat fh(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }\n' +
      sh.fragmentShader.replace('#include <map_fragment>', `
      #include <map_fragment>
      float dt1 = texture2D(detailMap, vW.xz / 19.0).r;
      float dt2 = texture2D(detailMap, vW.xz / 210.0 + 0.37).r;
      diffuseColor.rgb *= (0.35 + 1.3 * dt1) * (0.6 + 0.8 * dt2);
      float near = clamp(1.0 - length(vW - cameraPosition) / 70.0, 0.0, 1.0);
      float dt3 = texture2D(detailMap, vW.xz / 2.7).r;
      diffuseColor.rgb *= mix(1.0, 0.55 + 0.9 * dt3, near);
      // furrows / crop rows, one direction per field
      vec2 fu = vec2(vW.x * ${ca.toFixed(6)} + vW.z * ${sa.toFixed(6)}, -vW.x * ${sa.toFixed(6)} + vW.z * ${ca.toFixed(6)});
      vec2 cid = floor(fu / vec2(${FW}.0, ${FH}.0));
      float fr = fh(cid);
      float spc = mix(1.4, 4.5, fh(cid + 7.3));
      float crd = (fr < 0.5 ? fu.y : fu.x) / spc;
      float amp = (fr < 0.8 ? 0.28 : 0.0) * clamp(1.0 - fwidth(crd) * 1.6, 0.0, 1.0);
      if (vW.x > ${CITY.x0}.0 && vW.x < ${CITY.x1}.0 && vW.z > ${CITY.z0}.0 && vW.z < ${CITY.z1}.0) amp = 0.0;
      diffuseColor.rgb *= 1.0 + amp * sin(crd * 6.2832);
    `);
  };
  scene.add(new THREE.Mesh(geo, mat));
}

// ---------------------------------------------------------------- obstacles (trees, buildings, poles)
const obstacles = new Map();
const OCELL = 40;
const okey = (cx, cz) => cx * 100003 + cz;
function addObstacle(o, R){
  for (let cx = Math.floor((o.x - R) / OCELL); cx <= Math.floor((o.x + R) / OCELL); cx++)
    for (let cz = Math.floor((o.z - R) / OCELL); cz <= Math.floor((o.z + R) / OCELL); cz++){
      const k = okey(cx, cz);
      if (!obstacles.has(k)) obstacles.set(k, []);
      obstacles.get(k).push(o);
    }
  return o;
}
function obstacleAt(x, y, z){
  const list = obstacles.get(okey(Math.floor(x / OCELL), Math.floor(z / OCELL)));
  if (!list) return null;
  for (const o of list){
    if (y > o.top) continue;
    const dx = x - o.x, dz = z - o.z;
    if (o.box){
      const lx = dx * o.c - dz * o.s, lz = dx * o.s + dz * o.c;
      if (Math.abs(lx) < o.hw && Math.abs(lz) < o.hl) return o;
    } else if (dx * dx + dz * dz < o.r * o.r) return o;
  }
  return null;
}

const _m = new THREE.Matrix4(), _qq = new THREE.Quaternion(), _ee = new THREE.Euler(), _col = new THREE.Color(), _p3 = new THREE.Vector3(), _s3 = new THREE.Vector3();
function setInst(im, i, x, y, z, ry, sx, sy, sz, rx = 0, rz = 0){
  _qq.setFromEuler(_ee.set(rx, ry, rz));
  _m.compose(_p3.set(x, y, z), _qq, _s3.set(sx, sy, sz));
  im.setMatrixAt(i, _m);
}

// ---------------------------------------------------------------- buildings
const buildings = [];
function addBuilding(kind, x, z, a, w, l, h, roof, ruined){
  const y = groundAt(x, z) - 0.5;
  buildings.push({ kind, x, z, y, a, w, l, h: ruined ? h * 0.3 : h, roof: roof && !ruined, alive: !ruined });
}
for (const [vx, vz] of VILLAGES){
  const n = Math.floor(rr(25, 50)), sa0 = rr(0, 3.14);
  for (let k = 0; k < n; k++){
    // houses along two crossing streets
    const along = rr(-260, 260), side = (rnd() < 0.5 ? -1 : 1) * rr(14, 26), st = rnd() < 0.6 ? sa0 : sa0 + Math.PI / 2;
    const x = vx + Math.cos(st) * along - Math.sin(st) * side, z = vz + Math.sin(st) * along + Math.cos(st) * side;
    if (nearRoad(x, z, 10)) continue;
    addBuilding('house', x, z, -st + rr(-0.05, 0.05), rr(6, 9), rr(8, 12), rr(3, 3.6), true, rnd() < 0.12);
  }
}
for (const [fx, fz, fa] of FARMS){
  const n = Math.floor(rr(2, 5));
  for (let k = 0; k < n; k++){
    const off = (k - n / 2) * 26;
    addBuilding('barn', fx + Math.cos(fa) * off, fz - Math.sin(fa) * off, fa, rr(12, 16), rr(40, 70), rr(5, 7), true, rnd() < 0.2);
  }
}
for (let bx = CITY.x0 + 18; bx < CITY.x1 - 100; bx += 140) for (let bz = CITY.z0 + 18; bz < CITY.z1 - 100; bz += 140){
  const cx = bx + 61, cz = bz + 61;
  const r = rnd();
  if (r < 0.15) continue;
  const tall = rr(15, 42);
  if (r < 0.55) addBuilding('block', cx, cz, rnd() < 0.5 ? 0 : Math.PI / 2, 14, rr(50, 100), tall, false, false);
  else {
    addBuilding('block', cx - 28, cz, Math.PI / 2, 13, rr(40, 100), tall, false, false);
    addBuilding('block', cx + 28, cz, Math.PI / 2, 13, rr(40, 100), rr(15, 42), false, false);
  }
}
const wallMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ color: 0xffffff }), buildings.length);
const roofGeo = (() => {
  const s = new THREE.Shape(); s.moveTo(-0.5, 0); s.lineTo(0.5, 0); s.lineTo(0, 1); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 1, bevelEnabled: false }); g.translate(0, 0, -0.5); return g;
})();
const roofMesh = new THREE.InstancedMesh(roofGeo, new THREE.MeshLambertMaterial({ color: 0xffffff }), buildings.length);
buildings.forEach((b, i) => {
  b.i = i;
  setInst(wallMesh, i, b.x, b.y + b.h / 2, b.z, b.a, b.w, b.h, b.l);
  const k = b.kind === 'block' ? rr(0.5, 0.7) : b.kind === 'barn' ? rr(0.4, 0.55) : rr(0.62, 0.85);
  wallMesh.setColorAt(i, b.alive ? _col.setRGB(k, k * 0.97, k * 0.92) : _col.setRGB(0.2, 0.19, 0.18));
  if (b.roof) setInst(roofMesh, i, b.x, b.y + b.h, b.z, b.a, b.w * 1.15, b.kind === 'barn' ? 3.5 : 2.8, b.l * 1.06);
  else setInst(roofMesh, i, b.x, -999, b.z, 0, 0.001, 0.001, 0.001);
  const rk = b.kind === 'barn' ? 0.45 : rnd() < 0.5 ? rr(0.4, 0.5) : rr(0.2, 0.28);
  roofMesh.setColorAt(i, _col.setRGB(rk, rk * 0.95, rk * 0.9));
  const c = Math.cos(b.a), s = Math.sin(b.a);
  b.obs = addObstacle({ x: b.x, z: b.z, box: true, c, s, hw: b.w / 2, hl: b.l / 2, top: b.y + b.h + (b.roof ? 2.5 : 0), b }, Math.hypot(b.w, b.l) / 2);
});
wallMesh.frustumCulled = roofMesh.frustumCulled = false;
scene.add(wallMesh, roofMesh);
const cityTargets = buildings.filter(b => b.kind === 'block' && b.alive);
const ruralTargets = buildings.filter(b => b.kind !== 'block' && b.alive && b.z > -1500);

// ---------------------------------------------------------------- vegetation & small objects
{
  const trees = [];
  for (let j = -36; j <= 36; j++) for (let i = -20; i <= 20; i++){
    const rows = [];
    if (hash2(i * 3 + 1, j * 5 + 2) < 0.22) rows.push(0);
    if (hash2(i * 7 + 4, j * 11 + 9) < 0.1) rows.push(1);
    for (const kind of rows){
      const len = kind === 0 ? FW : FH;
      for (let s = 0; s < len; s += 6.5){
        const u = kind === 0 ? i * FW + s + rr(-1, 1) : i * FW + rr(-3, 3);
        const v = kind === 0 ? j * FH + rr(-3, 3) : j * FH + s + rr(-1, 1);
        const [x, z] = fromField(u, v);
        if (Math.abs(x) > 7700 || Math.abs(z) > 7700 || Math.hypot(x, z) < 45 || inCity(x, z) || nearRoad(x, z, 10)) continue;
        trees.push([x, z, rr(2.2, 4.4), rr(6, 13)]);
      }
    }
  }
  for (const [vx, vz] of VILLAGES) for (let k = 0; k < 140; k++){
    const x = vx + rr(-300, 300), z = vz + rr(-300, 300);
    if (!nearRoad(x, z, 8) && !obstacleAt(x, groundAt(x, z) + 1, z)) trees.push([x, z, rr(1.8, 3.5), rr(4, 10)]);
  }
  const im = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshLambertMaterial({ color: 0xffffff }), trees.length);
  trees.forEach(([x, z, r, th], n) => {
    const h = groundAt(x, z);
    setInst(im, n, x, h + th * 0.5, z, rr(0, 6.3), r, th * 0.55, r, rr(-.15, .15), rr(-.15, .15));
    const k = rr(0.16, 0.26); im.setColorAt(n, _col.setRGB(k, k * 0.97, k * 0.88));
    addObstacle({ x, z, r: r * 0.85, top: h + th }, r);
  });
  im.frustumCulled = false;
  scene.add(im);

  // bushes
  const NB = 7000;
  const bush = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshLambertMaterial({ color: 0xffffff }), NB);
  for (let n = 0; n < NB; n++){
    let x = rr(-7600, 7600), z = rr(-7600, 7600);
    if (n < 1500){ x = rr(-900, 900); z = rr(-900, 900); }
    if (inCity(x, z) || nearRoad(x, z, 8) || Math.hypot(x, z) < 20){ setInst(bush, n, 0, -999, 0, 0, 0.01, 0.01, 0.01); continue; }
    const r = rr(0.6, 2);
    setInst(bush, n, x, groundAt(x, z) + r * 0.3, z, rr(0, 6), r * rr(0.8, 1.6), r * 0.7, r);
    const k = rr(0.2, 0.32); bush.setColorAt(n, _col.setRGB(k, k * 0.98, k * 0.85));
  }
  bush.frustumCulled = false;
  scene.add(bush);

  // hay bales in rows on stubble fields
  const bales = [];
  for (let f = 0; f < 160; f++){
    const i = Math.floor(rr(-18, 18)), j = Math.floor(rr(-34, 34));

const AU = { ctx: null, ready: false };

  const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
  AU.master = ctx.createGain(); AU.master.gain.value = 0.9; AU.master.connect(comp);
  const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  AU.noise = buf;
  // one gun shot: sharp crack + low thump
  const sl = Math.floor(ctx.sampleRate * 0.3), sb = ctx.createBuffer(1, sl, ctx.sampleRate), sd = sb.getChannelData(0);
  for (let i = 0; i < sl; i++){ const t = i / ctx.sampleRate; sd[i] = (Math.random() * 2 - 1) * Math.exp(-t * 28) * 0.8 + Math.sin(t * 2 * Math.PI * 95) * Math.exp(-t * 18) * 0.7; }
  AU.shot = sb;
  AU.curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++){ const x = i / 511.5 - 1; AU.curve[i] = (1 + 6) * x / (1 + 6 * Math.abs(x)); }

  // own drone: four detuned motors + prop wash
  AU.pLp = ctx.createBiquadFilter(); AU.pLp.type = 'lowpass'; AU.pLp.frequency.value = 3000; AU.pLp.Q.value = 3;
  AU.pGain = ctx.createGain(); AU.pGain.gain.value = 0;
  AU.pLp.connect(AU.pGain); AU.pGain.connect(AU.master);
  AU.pOsc = [1, 1.012, 0.989, 1.021].map(mult => {
    const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 100;
    const g = ctx.createGain(); g.gain.value = 0.25; o.connect(g); g.connect(AU.pLp); o.start();
    return { o, mult };
  });
  const wn = noiseSrc(); const wbp = ctx.createBiquadFilter(); wbp.type = 'bandpass'; wbp.frequency.value = 900; wbp.Q.value = 0.6;
  AU.wind = ctx.createGain(); AU.wind.gain.value = 0; wn.connect(wbp); wbp.connect(AU.wind); AU.wind.connect(AU.master);
  const hn = noiseSrc(); const hhp = ctx.createBiquadFilter(); hhp.type = 'highpass'; hhp.frequency.value = 1500;

function osc(type, f){ const o = AU.ctx.createOscillator(); o.type = type; o.frequency.value = f; o.start(); return o; }

function setP(param, v, tc = 0.05){ param.setTargetAtTime(v, AU.ctx.currentTime, tc); }

function makeGeranSound(type){
  const ctx = AU.ctx;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800;
  const out = gainNode(0), pan = ctx.createStereoPanner();
  lp.connect(out); out.connect(pan); pan.connect(AU.master);
  if (type === 2){
    // two-stroke "moped": buzzy saw + sub square, distorted, with flutter
    const base = rr(88, 104);
    const o1 = osc('sawtooth', base), o2 = osc('square', base / 2), lfo = osc('sine', rr(7, 11));
    const g1 = gainNode(0.55), g2 = gainNode(0.35), lg = gainNode(0.18), sh = ctx.createWaveShaper();
    sh.curve = AU.curve;
    o1.connect(g1); o2.connect(g2); g1.connect(sh); g2.connect(sh); sh.connect(lp);
    lfo.connect(lg); lg.connect(g1.gain);
    return { lp, out, pan, oscs: [[o1, base], [o2, base / 2]], stops: [o1, o2, lfo], vol: 0.6 };
  }
  // jet: roar + turbine whine
  const n = noiseSrc(), bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 0.5;
  const ng = gainNode(1.3); n.connect(bp); bp.connect(ng); ng.connect(lp);
  const wf = type === 3 ? rr(3000, 3400) : rr(3800, 4300);
  const w = osc('sine', wf), wg = gainNode(0.06); w.connect(wg); wg.connect(lp);

}
const _v = new THREE.Vector3(), _q = new THREE.Quaternion(), _w = new THREE.Vector3();
function updateGeranSound(g){
  const s = g.snd;
  _v.copy(g.pos).sub(camera.position);
  const dist = _v.length() + 0.001;
  const vrad = _v.dot(_w.copy(g.vel).sub(P.vel)) / dist;
  const dop = clamp(343 / (343 + vrad), 0.5, 2);
  for (const [o, f] of s.oscs) setP(o.frequency, f * dop * (g.state === 'dive' ? 1.08 : 1));
  _q.copy(camera.quaternion).invert();
  const local = _w.copy(_v).applyQuaternion(_q);
  setP(s.pan.pan, clamp(local.x / dist * 1.1, -1, 1));
  const behind = local.z > 0 ? 0.75 : 1;
  setP(s.out.gain, (g.state !== 'down' ? s.vol : 0) * behind * 90 / (90 + dist));
  setP(s.lp.frequency, 250 + 7000 * 70 / (70 + dist));

  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';

  n.connect(lp); lp.connect(g); g.connect(AU.master); n.start(t0, Math.random()); n.stop(t0 + 2.6);

  const og = ctx.createGain(); og.gain.setValueAtTime(amp, t0); og.gain.exponentialRampToValueAtTime(0.0005, t0 + 0.9);

function respawn(){

  P.vel.set(0, 0, 0); P.w.set(0, 0, 0); P.q.identity();
  P.thr = 0; P.armed = false; P.alive = true; P.psi = 0; P.used = 0; P.time = 0; P.onGround = true;
}
function toggleArm(){
  if (!P.alive) return;
  P.armed = !P.armed;
  if (P.armed){ P.thr = 0; beep(1800, 0.08); } else beep(900, 0.12);
}
function toggleMode(){
  P.mode = P.mode === 'ANGL' ? 'ACRO' : 'ANGL';
  if (P.mode === 'ANGL'){
    const f = new THREE.Vector3(0, 0, -1).applyQuaternion(P.q);
    P.psi = Math.atan2(-f.x, -f.z);

const _up = new THREE.Vector3(), _acc = new THREE.Vector3(), _e = new THREE.Euler(), _qt = new THREE.Quaternion(), _dq = new THREE.Quaternion(), _ax = new THREE.Vector3();
function simStep(dt){
  const acro = P.mode === 'ACRO';
  // rotation
  if (acro){
    const rate = THREE.MathUtils.degToRad(380), yrate = THREE.MathUtils.degToRad(220);
    const tx = -P.sp * rate, tz = -P.sr * rate, ty = -P.sy * yrate;

    const ang = P.w.length() * dt;
    if (ang > 0){ _dq.setFromAxisAngle(_ax.copy(P.w).normalize(), ang); P.q.multiply(_dq).normalize(); }
  } else {

    P.psi -= P.sy * THREE.MathUtils.degToRad(130) * dt;
    _qt.setFromEuler(_e.set(-P.sp * tilt, P.psi, -P.sr * tilt, 'YXZ'));
    P.q.slerp(_qt, 1 - Math.exp(-dt * 9));

  // thrust
  _up.set(0, 1, 0).applyQuaternion(P.q);
  let T = 0;
  if (P.armed){
    if (acro) T = P.thr * MAXT;
    else {
      const vzt = (keys.KeyW ? 14 : 0) - (keys.KeyS ? 11 : 0);
      T = clamp((G + 4 * (vzt - P.vel.y) + KDRAG * P.vel.length() * P.vel.y) / Math.max(0.28, _up.y), 0, MAXT);
    }
    const left = 1 - P.used;
    if (left < 0.12) T *= Math.max(0, left / 0.12);
    P.used = Math.min(1, P.used + (0.03 + 0.97 * Math.pow(T / MAXT, 1.5)) * dt / 260);
  }
  P.T = T;
  const sp = P.vel.length();
  _acc.copy(_up).multiplyScalar(T);
  _acc.y -= G;
  _acc.addScaledVector(P.vel, -(KDRAG * sp + LDRAG));
  P.vel.addScaledVector(_acc, dt);
  P.pos.addScaledVector(P.vel, dt);

  // ground
  const gh = groundAt(P.pos.x, P.pos.z) + 0.05;
  if (P.pos.y <= gh){
    if (P.vel.length() > 9){ die(false); return; }
    P.pos.y = gh;
    if (P.vel.y < 0) P.vel.y = 0;
    P.vel.x *= Math.exp(-8 * dt); P.vel.z *= Math.exp(-8 * dt);
    P.onGround = true;
    if (T < G * 1.02){
      const f = _ax.set(0, 0, -1).applyQuaternion(P.q);
      _qt.setFromEuler(_e.set(0, Math.atan2(-f.x, -f.z), 0, 'YXZ'));
      P.q.slerp(_qt, 1 - Math.exp(-dt * 10));
      P.w.set(0, 0, 0);
    }
  } else P.onGround = P.pos.y < gh + 0.03;

  // trees / buildings / poles
  if (obstacleAt(P.pos.x, P.pos.y, P.pos.z)){
    if (P.vel.length() > 5){ die(false); return; }
    P.vel.multiplyScalar(-0.3);
  }
  if (Math.abs(P.pos.x) > MAP_LIMIT || Math.abs(P.pos.z) > MAP_LIMIT || P.pos.y > 4000) die(false);
}

function pickTarget(near){

const gerans = [];

    } else {
      if (!this.target.alive) this.target = pickTarget(this.target);
      const aim = this.aim();
      const hd = Math.hypot(aim.x - this.pos.x, aim.z - this.pos.z);
      if (this.state === 'cruise' && hd < Math.max(450, (this.pos.y - aim.y) * 2.6)) this.state = 'dive';

        let want = Math.atan2(aim.x - this.pos.x, aim.z - this.pos.z);

  setInst(wallMesh, b.i, b.x, b.y + rh / 2, b.z, b.a + rr(-0.03, 0.03), b.w * 1.06, rh, b.l * 1.04);

function killGeran(g){

  kills++; killBlink = 3;

  explosion(g.pos.clone(), 1.4);
  boom(g.pos.distanceTo(camera.position), 2);
  g.shootDown();

// waves
let wave = 0, queue = [], nextSpawn = 0, waveGap = 0;
function startWave(){
  wave++;
  const n = 2 + wave;
  let t = 0;
  queue = [];
  for (let i = 0; i < n; i++){
    const r = rnd();
    const type = wave >= 5 && r < 0.25 ? 4 : wave >= 3 && r < 0.45 ? 3 : 2;
    queue.push({ type, at: t });
    t += rr(3, 10);
  }
  nextSpawn = clock + 2;
}
function updateWaves(){
  if (queue.length){
    if (clock >= nextSpawn + queue[0].at) gerans.push(new Geran(queue.shift().type));
  } else if (!gerans.length){
    if (!waveGap) waveGap = clock + 8;
    if (clock > waveGap){ waveGap = 0; startWave(); }
  }
}

{
  const sites = [[-900, 1100], [650, 1400], [150, 2200], [-1500, 2100], [1800, -1500], [-2000, -2600], [900, 4200], [-600, 5300], [2200, 3000], [-300, -4500]];
  for (const [vx, vz] of VILLAGES) if (vz > -5000 && vz < 5500 && Math.abs(vx) < 3500 && rnd() < 0.6) sites.push([vx + rr(-150, 150), vz + rr(-150, 150)]);

const rounds = [];
const MAXTR = 900;

const stats = { rounds: 0, hits: 0 };

function fireRound(gun){
  const g = gun.g, tg = gun.target, from = gun.pos;

  // gunner's lead and aim error: large at the start of a burst, gunner walks the tracers in, never perfectly
  const corr = 0.55 + 0.45 * Math.exp(-gun.t / 2.5);
  const wob = dist * 0.006;
  const ax = tg.pos.x + tg.vel.x * tof * gun.lead + gun.err.x * corr + Math.sin(clock * 3.1 + gun.ph) * wob;

  dx = dx / l + gauss() * g.disp; dy = dy / l + gauss() * g.disp; dz = dz / l + gauss() * g.disp;
  const v = g.v0 * rr(0.99, 1.01) / Math.hypot(dx, dy, dz);

  rounds.push({ x: from.x, y: from.y, z: from.z, vx: dx * v, vy: dy * v, vz: dz * v, age: 0, g, tracer: gun.n % g.tracer === 0 });
  stats.rounds++;
  if (gun.n % 2 === 0 || g.rate < 20) gunShot(from, gun.kind === 'zu');

function updateDefences(dt){
  for (const s of guns){
    let tgt = null, td = Math.max(2600, s.g.range);
    for (const g of gerans){ if (g.state === 'down') continue; const d = g.pos.distanceTo(s.pos); if (d < td){ td = d; tgt = g; } }
    if (s.mesh){
      let want;
      if (tgt){
        want = _v.copy(tgt.pos).sub(s.pos).normalize();
        want.x += Math.sin(clock * 0.9 + s.ph) * 0.06; want.z += Math.cos(clock * 0.7 + s.ph) * 0.06;

    s.flashS.visible = false;
    if (s.burst > 0){
      s.burst -= dt; s.t += dt;
      const g = s.target;
      if (!g || g.state === 'down' || !g.grp.parent){ s.burst = 0; s.target = null; }
      else {

  for (let i = rounds.length - 1; i >= 0; i--){
    const r = rounds[i], g = r.g;
    const ox = r.x, oy = r.y, oz = r.z;
    const sp = Math.hypot(r.vx, r.vy, r.vz), dr = 1 - g.k * sp * dt;
    r.vx *= dr; r.vy = r.vy * dr - G * dt; r.vz *= dr;

        let t = ((ge.pos.x - ox) * sx + (ge.pos.y - oy) * sy + (ge.pos.z - oz) * sz) / ss;
        t = clamp(t, 0, 1);
        const cx = ox + sx * t - ge.pos.x, cy = oy + sy * t - ge.pos.y, cz = oz + sz * t - ge.pos.z;
        if (cx * cx + cy * cy + cz * cz < 1.2 * 1.2){
          stats.hits++;
          ge.hp -= g.dmg;
          fx(ge.pos, true, 1, 4, 0.15);
          if (ge.hp <= 0){ aaKills++; explosion(ge.pos.clone(), 0.6); ge.shootDown(); }
          gone = true; break;
        }
      }
      if (!gone && P.alive){
        let t = ((P.pos.x - ox) * sx + (P.pos.y - oy) * sy + (P.pos.z - oz) * sz) / ss;
        t = clamp(t, 0, 1);
        const cx = ox + sx * t - P.pos.x, cy = oy + sy * t - P.pos.y, cz = oz + sz * t - P.pos.z;
        if (cx * cx + cy * cy + cz * cz < 0.35 * 0.35){ die(false); gone = true; }
      }
    }
    if (gone){
      // 23 mm HE self-destruct puff
      if (g.sd && r.age > g.life && r.tracer) fx(_p3.set(r.x, r.y, r.z), true, 1, 6, 0.2);
      rounds.splice(i, 1); continue;
    }
    if (r.tracer && r.age < g.burn && nt < MAXTR){
      const tl = Math.min(22, sp * 0.022) / sp, o = nt * 6, fade = 1 - r.age / g.burn * 0.6;
      trPos[o] = r.x; trPos[o + 1] = r.y; trPos[o + 2] = r.z;
      trPos[o + 3] = r.x - r.vx * tl; trPos[o + 4] = r.y - r.vy * tl; trPos[o + 5] = r.z - r.vz * tl;
      trCol[o] = g.col[0] * fade; trCol[o + 1] = g.col[1] * fade; trCol[o + 2] = g.col[2] * fade;
      trCol[o + 3] = g.col[0] * 0.15; trCol[o + 4] = g.col[1] * 0.1; trCol[o + 5] = g.col[2] * 0.05;
      nt++;
    }
  }
  trGeo.setDrawRange(0, nt * 2);
  trGeo.attributes.position.needsUpdate = true;
  trGeo.attributes.color.needsUpdate = true;
}

const K = 0.2;
const post = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: rt.texture }, tOSD: { value: osdTex }, uRes: { value: new THREE.Vector2(W, H) },
    uTime: { value: 0 }, uNoise: { value: 0 }, uStatic: { value: 0 }, uFlash: { value: 0 }, uK: { value: K }, uGain: { value: 1.9 }, uLift: { value: -0.06 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tScene, tOSD; uniform vec2 uRes;
    uniform float uTime, uNoise, uStatic, uFlash, uK, uGain, uLift;
    varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 uv = vUv;
      float tq = floor(uTime * 30.0);
      float row = floor(uv.y * uRes.y);
      float jit = (h(vec2(row, tq)) - 0.5) * (0.003 + uNoise * 0.06) * step(0.7 - uNoise * 0.6, h(vec2(row * 0.37, tq + 1.7)));
      jit += sin(uv.y * 30.0 + uTime * 2.0) * 0.0008;
      uv.x += jit;
      vec2 c = uv * 2.0 - 1.0;
      c *= (1.0 + uK * dot(c, c)) / (1.0 + 2.0 * uK);
      vec2 s = c * 0.5 + 0.5;
      vec3 col = texture2D(tScene, s).rgb;
      vec3 smear = texture2D(tScene, s - vec2(1.5 / uRes.x, 0.0)).rgb + texture2D(tScene, s - vec2(3.5 / uRes.x, 0.0)).rgb;
      col = mix(col, smear * 0.5, 0.4);
      float l = dot(col, vec3(0.299, 0.587, 0.114));
      l = clamp(pow(l * uGain, 0.85) * 1.15 + uLift, 0.0, 1.0);
      vec3 graded = mix(vec3(0.11, 0.10, 0.09), vec3(0.88, 0.85, 0.79), l);
      graded *= vec3(1.0, 0.965, 0.9);
      vec3 chroma = col - vec3((col.r + col.g + col.b) / 3.0);
      col = graded + chroma * 0.5;
      vec4 o = texture2D(tOSD, vec2(vUv.x + jit, vUv.y));
      col = mix(col, o.rgb, o.a);
      float n = h(gl_FragCoord.xy + vec2(tq * 7.13, tq * 3.7));
      col += (n - 0.5) * (0.07 + uNoise * 0.55);
      col += step(1.0 - uNoise * 0.03, h(gl_FragCoord.xy * 1.31 + tq)) * 0.8;

// scene uv -> screen uv (inverse of the barrel warp)
function undistort(sx, sy){
  let x = sx, y = sy;
  for (let k = 0; k < 8; k++){
    const cx = x * 2 - 1, cy = y * 2 - 1, f = (1 + K * (cx * cx + cy * cy)) / (1 + 2 * K);
    x += sx - (cx * f * 0.5 + 0.5); y += sy - (cy * f * 0.5 + 0.5);
  }
  return [x * W, (1 - y) * H];
}
// world point -> [px, py, inFront]
const _pv = new THREE.Vector3();
function toScreen(p){
  _pv.copy(p).applyMatrix4(camera.matrixWorldInverse);
  const front = _pv.z < 0;
  _pv.applyMatrix4(camera.projectionMatrix);
  const [x, y] = undistort(_pv.x * 0.5 + 0.5, _pv.y * 0.5 + 0.5);
  return [x, y, front];
}

// ---------------------------------------------------------------- main loop
const _p0 = new THREE.Vector3(), _rel = new THREE.Vector3(), _dr = new THREE.Vector3();
let noise = 0;
respawn();
startWave();
try { setDayNight(localStorage.getItem('interceptor-daynight') === 'day' ? 'day' : 'night'); } catch (e) { setDayNight('night'); }

function updateSticks(dt){
  const acro = P.mode === 'ACRO';
  const r = 1 - Math.exp(-dt * (acro ? 7 : 9));
  const tp = (keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0);
  const tr = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  const ty = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  P.sp += (tp - P.sp) * r; P.sr += (tr - P.sr) * r; P.sy += (ty - P.sy) * r;
  if (acro && P.armed){
    if (keys.KeyW) P.thr = Math.min(1, P.thr + dt * 0.75);
    if (keys.KeyS) P.thr = Math.max(0, P.thr - dt * 0.75);
  }
}

function update(dt){
  clock += dt;
  updateSticks(dt);

  _p0.copy(P.pos);
  if (P.alive){
    const n = Math.ceil(dt / 0.004);
    for (let i = 0; i < n && P.alive; i++) simStep(dt / n);
    if (P.armed) P.time += dt;
  } else if (clock - P.deadAt > 1.8){ respawn(); }

  updateWaves();
  for (const g of [...gerans]) g.update(dt);

  // intercept check: closest approach of the relative motion during the frame
  if (P.alive && P.armed){
    for (const g of [...gerans]){
      if (g.state === 'down') continue;
      _rel.copy(g.prev).sub(_p0);
      _dr.copy(g.pos).sub(g.prev).sub(_v.copy(P.pos).sub(_p0));
      const t = clamp(-_rel.dot(_dr) / Math.max(1e-6, _dr.lengthSq()), 0, 1);
      if (_rel.addScaledVector(_dr, t).length() < 3.2){ detonate(); break; }
    }
  }

  updateDefences(dt);
  updateFx(dt);
  updateBurners(dt);
  for (const f of horizonFires){ const s = f.base * (0.8 + 0.25 * Math.sin(clock * 7 + f.ph) + 0.1 * Math.random()); f.f.scale.set(s, s * 0.8, 1); }

  // camera
  camera.position.copy(P.pos).add(_v.set(0, 0.03, -0.04).applyQuaternion(P.q));
  camera.quaternion.copy(P.q).multiply(UPTILT);
  if (P.alive && P.armed){
    const v = 0.0015 + 0.004 * (P.T / MAXT);
    camera.rotateX((Math.random() - 0.5) * v); camera.rotateY((Math.random() - 0.5) * v);
  }
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  sunSprite.position.copy(camera.position).addScaledVector(SUN_DIR, 15000);

  // signal + feed effects
  const dist = Math.hypot(P.pos.x, P.pos.z);
  const lowAlt = clamp((dist - 1500) / 3000, 0, 1) * clamp(1 - (P.pos.y - groundAt(P.pos.x, P.pos.z)) / 40, 0, 1);
  noise = clamp(Math.max(0, dist - LINK_START) / 4000 + lowAlt * 0.5, 0, 1);
  flash = Math.max(0, flash - dt * 6);
  if (P.alive) staticAmt = Math.max(0, staticAmt - dt * 5);
  killBlink = Math.max(0, killBlink - dt);
}

function render(){
  post.uniforms.uTime.value = clock;
  post.uniforms.uNoise.value = noise;
  post.uniforms.uStatic.value = P.alive ? staticAmt : 1;
  post.uniforms.uFlash.value = flash;

  if (AU.ready){
    const tf = P.T / MAXT;
    const f = 95 + 620 * Math.sqrt(tf) + P.vel.length() * 0.8;
    for (const { o, mult } of AU.pOsc) setP(o.frequency, f * mult, 0.03);
    setP(AU.pGain.gain, P.alive && P.armed ? 0.05 + 0.16 * tf : 0, 0.03);
    setP(AU.pLp.frequency, 900 + 3500 * tf);
    setP(AU.wind.gain, P.alive ? Math.min(0.3, P.vel.length() / 110 * 0.3) : 0);
    setP(AU.hiss.gain, (P.alive ? noise * 0.04 : 0.07));
  }

  drawOSD();
  if (paused) drawPause();
  osdTex.needsUpdate = true;

  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
}

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) update(dt);
  render();
}
requestAnimationFrame(frame);
if (location.hash === '#dbg') window.__d = { P, gerans, Geran, camera, THREE, guns, stats, buildings, setDayNight, update, render,
  get counts(){ return { kills, leaks, aaKills, wave }; } };
</script>
