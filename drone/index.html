// ---------------------------------------------------------------- helpers
function hash2(x, y){
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, oct = 4){
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++){ s += a * vnoise(x * f, y * f); f *= 2.03; a *= 0.5; }
  return s;
}
let seed = 1337;
function rnd(){ seed = (seed + 0x6D2B79F5) | 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const rr = (a, b) => a + (b - a) * rnd();
const pick = a => a[Math.floor(rnd() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gauss = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2832 * Math.random()); };
const _m = new THREE.Matrix4(), _qq = new THREE.Quaternion(), _ee = new THREE.Euler(), _col = new THREE.Color(), _p3 = new THREE.Vector3(), _s3 = new THREE.Vector3();
const _v = new THREE.Vector3(), _w = new THREE.Vector3(), _q = new THREE.Quaternion();

// thermal vision: every lit material gets a heat value; TH blends between visible and white-hot
const TH = { value: 0 };
function thermal(mat, heat, ground = false){
  const heatU = { value: heat };
  mat.userData.heat = heatU;
  const prev = mat.onBeforeCompile;
  mat.onBeforeCompile = (sh, r) => {
    if (prev) prev.call(mat, sh, r);
    sh.uniforms.uTh = TH; sh.uniforms.uHeat = heatU;
    sh.fragmentShader = 'uniform float uTh;\nuniform float uHeat;\n' + sh.fragmentShader.replace('#include <fog_fragment>', `
      { float lum = dot(gl_FragColor.rgb, vec3(0.333));
        float ht = ${ground ? 'uHeat + (0.42 - lum) * 0.45' : 'uHeat + (lum - 0.4) * 0.15'};
        gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(clamp(ht, 0.0, 1.0)), uTh); }
      #include <fog_fragment>`);
  };
  mat.customProgramCacheKey = () => 'th' + (ground ? 'g' : 'o');
  return mat;
}
const lam = (opts, heat) => thermal(new THREE.MeshLambertMaterial(opts), heat);

// ---------------------------------------------------------------- terrain
// east = +x, north = -z. The village is at the origin, the enemy comes from the east.
const SIZE = 16000, SEG = 400, CELL = SIZE / SEG, HALF = SIZE / 2;
const heights = new Float32Array((SEG + 1) * (SEG + 1));
for (let iz = 0; iz <= SEG; iz++) for (let ix = 0; ix <= SEG; ix++){
  const x = -HALF + ix * CELL, z = -HALF + iz * CELL;
  const flat = clamp((Math.hypot(x, z) - 300) / 700, 0, 1);
  heights[iz * (SEG + 1) + ix] = ((fbm(x / 1500 + 10, z / 1500 + 10) - 0.47) * 80 + Math.sin(z / 900) * 6) * flat;
}
function groundAt(x, z){
  const gx = clamp((x + HALF) / CELL, 0, SEG - 0.001), gz = clamp((z + HALF) / CELL, 0, SEG - 0.001);
  const ix = Math.floor(gx), iz = Math.floor(gz), fx = gx - ix, fz = gz - iz;
  const r = SEG + 1;
  const h00 = heights[iz * r + ix], h10 = heights[iz * r + ix + 1], h01 = heights[(iz + 1) * r + ix], h11 = heights[(iz + 1) * r + ix + 1];
  if (fx + fz <= 1) return h00 + (h10 - h00) * fx + (h01 - h00) * fz;
  return h11 + (h01 - h11) * (1 - fx) + (h10 - h11) * (1 - fz);
}

// ---------------------------------------------------------------- roads
const ROAD_DEFS = [
  { name: 'E',  w: 7, pts: [[7900, -300], [6000, 250], [4200, -200], [2600, 150], [1200, -60], [400, 10], [5, 0]] },
  { name: 'NE', w: 5, pts: [[6800, -6800], [4800, -4300], [3200, -2600], [1800, -1200], [700, -330], [180, -40], [5, 0]] },
  { name: 'SE', w: 5, pts: [[7200, 6200], [5200, 4300], [3400, 2600], [1900, 1300], [700, 380], [180, 40], [5, 0]] },
  { name: 'W',  w: 6, pts: [[-50, 0], [-700, 120], [-2200, -150], [-4500, 250], [-7900, -200]] },
  { name: 'v1', w: 4, pts: [[30, 30], [60, 160], [40, 330], [-60, 470]] },
  { name: 'v2', w: 4, pts: [[-40, -40], [-150, -170], [-180, -360], [-90, -520]] },
  { name: 'v3', w: 4, pts: [[120, -20], [250, -150], [330, -330]] },
];
const ROADS = ROAD_DEFS.map(def => {
  const curve = new THREE.CatmullRomCurve3(def.pts.map(([x, z]) => new THREE.Vector3(x, 0, z)), false, 'centripetal');
  const n = Math.max(8, Math.ceil(curve.getLength() / 8));
  const xs = new Float32Array(n + 1), zs = new Float32Array(n + 1), ss = new Float32Array(n + 1);
  for (let i = 0; i <= n; i++){
    const p = curve.getPointAt(i / n);
    xs[i] = p.x; zs[i] = p.z;
    ss[i] = i ? ss[i - 1] + Math.hypot(xs[i] - xs[i - 1], zs[i] - zs[i - 1]) : 0;
  }
  return { ...def, xs, zs, ss, len: ss[n], n };
});
function roadAt(r, s, out, cur = { i: 0 }){
  s = clamp(s, 0, r.len);
  let i = clamp(cur.i, 0, r.n - 1);
  while (i < r.n - 1 && r.ss[i + 1] < s) i++;
  while (i > 0 && r.ss[i] > s) i--;
  cur.i = i;
  const t = (s - r.ss[i]) / Math.max(1e-6, r.ss[i + 1] - r.ss[i]);
  out.x = r.xs[i] + (r.xs[i + 1] - r.xs[i]) * t; out.z = r.zs[i] + (r.zs[i + 1] - r.zs[i]) * t;
  out.dx = r.xs[i + 1] - r.xs[i]; out.dz = r.zs[i + 1] - r.zs[i];
  const l = Math.hypot(out.dx, out.dz) || 1; out.dx /= l; out.dz /= l;
  return out;
}
// raster mask, 10 m cells, for "is this near a road"
const RM = 1600, roadMask = new Uint8Array(RM * RM);
for (const r of ROADS) for (let i = 0; i <= r.n; i++)
  for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++){
    const cx = Math.floor((r.xs[i] + HALF) / 10) + dx, cz = Math.floor((r.zs[i] + HALF) / 10) + dz;
    if (cx >= 0 && cz >= 0 && cx < RM && cz < RM) roadMask[cz * RM + cx] = 1;
  }
const nearRoad = (x, z) => { const cx = Math.floor((x + HALF) / 10), cz = Math.floor((z + HALF) / 10); return cx >= 0 && cz >= 0 && cx < RM && cz < RM && roadMask[cz * RM + cx] === 1; };

// ---------------------------------------------------------------- layout
const CENTRAL = { x: -30, z: 0 };
const START = new THREE.Vector3(70, 0, -75);
const SQUARE = { x0: -60, x1: 45, z0: -40, z1: 40 };
const inSquare = (x, z) => x > SQUARE.x0 && x < SQUARE.x1 && z > SQUARE.z0 && z < SQUARE.z1;
// rotated field grid (u along rows, v across)
const FA = 0.33, FW = 420, FH = 230, ca = Math.cos(FA), sa = Math.sin(FA);
const toField = (x, z) => [x * ca + z * sa, -x * sa + z * ca];
const fromField = (u, v) => [u * ca - v * sa, u * sa + v * ca];

const houseSpecs = [];
function placeHouses(cx, cz, n, rMin, rMax, ruinP, village){
  for (let k = 0, tries = 0; k < n && tries < 4000; tries++){
    const a = rr(0, 6.283), d = rMin + (rMax - rMin) * Math.pow(rnd(), 0.8);
    const x = cx + Math.cos(a) * d, z = cz + Math.sin(a) * d;
    if (nearRoad(x, z) || inSquare(x, z) || Math.hypot(x - START.x, z - START.z) < 35) continue;
    if (houseSpecs.some(h => Math.hypot(h.x - x, h.z - z) < 26)) continue;
    houseSpecs.push({ x, z, a: rr(0, 6.283), w: rr(6.5, 9), l: rr(9, 12.5), ruined: rnd() < ruinP, village, style: Math.floor(rnd() * 4), hip: rnd() < 0.35 });
    k++;
  }
}
placeHouses(0, 0, 56, 65, 470, 0.22, true);
const HAMLETS = [[3000, 330], [4400, -3350], [4200, 3150], [6200, 900]];
for (const [x, z] of HAMLETS) placeHouses(x, z, 8, 20, 170, 0.7, false);
const FARMS = [[2200, -2600, 0.4], [5200, 2000, 1.2], [3600, 1300, 2.0], [1500, 2300, 0.9], [-2600, 1800, 0.2]];

// ---------------------------------------------------------------- ground textures
function makeGroundTexture(){
  const TS = 2048, c = document.createElement('canvas');
  c.width = c.height = TS;
  const g = c.getContext('2d'), img = g.createImageData(TS, TS), d = img.data;
  const TYPES = [[0.25, 0.215, 0.18], [0.50, 0.46, 0.39], [0.33, 0.34, 0.28], [0.41, 0.38, 0.32], [0.30, 0.28, 0.25], [0.45, 0.43, 0.36]];
  for (let py = 0; py < TS; py++){
    const z = -HALF + (py + 0.5) / TS * SIZE;
    for (let px = 0; px < TS; px++){
      const x = -HALF + (px + 0.5) / TS * SIZE;
      const [u, v] = toField(x, z);
      const i = Math.floor(u / FW), j = Math.floor(v / FH);
      let col = TYPES[Math.floor(hash2(i + 100, j + 300) * TYPES.length)];
      let m = 0.62 + 0.75 * fbm(x / 90, z / 90, 3);
      const fu = u - i * FW, fv = v - j * FH;
      if ((fv < 7 && hash2(j, 7) < 0.6) || (fu < 6 && hash2(i, 9) < 0.4)) { col = [0.47, 0.44, 0.38]; m = 0.9 + 0.2 * vnoise(x / 20, z / 20); }
      const o = (py * TS + px) * 4;
      d[o] = clamp(col[0] * m * 255, 0, 255); d[o + 1] = clamp(col[1] * m * 255, 0, 255); d[o + 2] = clamp(col[2] * m * 255, 0, 255); d[o + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  const P = (x, z) => [(x + HALF) / SIZE * TS, (z + HALF) / SIZE * TS];
  for (const r of ROADS){
    g.strokeStyle = r.w >= 6 ? 'rgb(86,85,82)' : 'rgb(120,112,96)'; g.lineWidth = Math.max(0.8, r.w * TS / SIZE);
    g.beginPath(); g.moveTo(...P(r.xs[0], r.zs[0])); for (let i = 1; i <= r.n; i++) g.lineTo(...P(r.xs[i], r.zs[i])); g.stroke();
  }
  // trench lines near the front (east)
  g.strokeStyle = 'rgba(28,24,20,0.85)'; g.lineWidth = 1.2;
  for (let t = 0; t < 7; t++){
    let x = rr(5200, 7600), z = rr(-7000, 3000);
    g.beginPath(); g.moveTo(...P(x, z));
    for (let s = 0; s < 120; s++){ z += rr(20, 70); x += rr(-40, 40) + (s % 2 ? 25 : -25); g.lineTo(...P(x, z)); }
    g.stroke();
  }
  // shell craters, dense in the east
  for (let k = 0; k < 6000; k++){
    const cx = rnd() < 0.7 ? rr(2500, 7800) : rr(-7800, 7800), cz = rr(-7800, 7800);
    if (Math.hypot(cx, cz) < 600) continue;
    const [px, py] = P(cx, cz), r = rr(0.5, 2.2);
    g.fillStyle = 'rgba(150,140,120,0.5)'; g.beginPath(); g.arc(px, py, r + 0.8, 0, 7); g.fill();
    g.fillStyle = 'rgba(30,26,22,0.8)'; g.beginPath(); g.arc(px, py, r, 0, 7); g.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.flipY = false;
  tex.anisotropy = 4;
  return tex;
}
// high resolution texture for the village (1.2 km square, ~1.2 m per pixel)
const VS = 1200, VT = 1024;
function makeVillageTexture(){
  const c = document.createElement('canvas'); c.width = c.height = VT;
  const g = c.getContext('2d'), img = g.createImageData(VT, VT), d = img.data;
  for (let py = 0; py < VT; py++) for (let px = 0; px < VT; px++){
    const x = -VS / 2 + (px + 0.5) / VT * VS, z = -VS / 2 + (py + 0.5) / VT * VS;
    const m = 0.7 + 0.45 * fbm(x / 25, z / 25, 3) + 0.1 * hash2(px, py);
    const o = (py * VT + px) * 4;
    d[o] = clamp(0.42 * m * 255, 0, 255); d[o + 1] = clamp(0.41 * m * 255, 0, 255); d[o + 2] = clamp(0.32 * m * 255, 0, 255); d[o + 3] = 255;
  }

  const k = VT / VS, P = (x, z) => [(x + VS / 2) * k, (z + VS / 2) * k];
  const at = (x, z, a, fn) => { g.save(); g.translate(...P(x, z)); g.rotate(a); g.scale(k, k); fn(); g.restore(); };
  // yards and vegetable gardens
  for (const h of houseSpecs){
    if (Math.abs(h.x) > VS / 2 - 40 || Math.abs(h.z) > VS / 2 - 40) continue;
    at(h.x, h.z, -h.a, () => {
      g.fillStyle = 'rgba(128,118,98,0.9)'; g.fillRect(-h.w / 2 - 4, -h.l / 2 - 5, h.w + 8, h.l + 10);
      g.fillStyle = 'rgba(70,60,48,0.95)'; g.fillRect(-h.w / 2 - 3, h.l / 2 + 6, h.w + 10, 22);
      g.fillStyle = 'rgba(45,40,33,0.9)';
      for (let s = 0; s < 22; s += 1.6) g.fillRect(-h.w / 2 - 3, h.l / 2 + 6 + s, h.w + 10, 0.6);
    });
  }
  // square in front of the central building
  at((SQUARE.x0 + SQUARE.x1) / 2, 0, 0, () => {
    g.fillStyle = 'rgb(140,138,130)'; g.fillRect(-(SQUARE.x1 - SQUARE.x0) / 2, -40, SQUARE.x1 - SQUARE.x0, 80);
    g.strokeStyle = 'rgba(90,88,84,0.6)'; g.lineWidth = 0.15;
    for (let s = -52; s < 52; s += 2){ g.beginPath(); g.moveTo(s, -40); g.lineTo(s, 40); g.stroke(); }
    for (let s = -40; s < 40; s += 2){ g.beginPath(); g.moveTo(-52, s); g.lineTo(52, s); g.stroke(); }
  });
  for (const r of ROADS){
    g.strokeStyle = r.w >= 6 ? 'rgb(84,83,80)' : 'rgb(132,122,104)'; g.lineWidth = r.w * k;
    g.beginPath(); g.moveTo(...P(r.xs[0], r.zs[0])); for (let i = 1; i <= r.n; i++) g.lineTo(...P(r.xs[i], r.zs[i])); g.stroke();
  }
  for (let n = 0; n < 40; n++){
    const [px, py] = P(rr(-550, 550), rr(-550, 550)), r = rr(1.5, 4) * k;
    g.fillStyle = 'rgba(150,140,120,0.6)'; g.beginPath(); g.arc(px, py, r * 1.4, 0, 7); g.fill();
    g.fillStyle = 'rgba(32,28,24,0.85)'; g.beginPath(); g.arc(px, py, r, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.flipY = false; t.anisotropy = 4;
  return t;
}
function makeDetailTexture(){
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'), img = g.createImageData(S, S), d = img.data;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++){
    const n = 0.35 * hash2(x, y) + 0.4 * vnoise(x / 4, y / 4) + 0.25 * (0.5 + 0.5 * Math.sin((x + 3 * vnoise(x / 9, y / 9)) * 0.75));

    d[o] = d[o + 1] = d[o + 2] = v; d[o + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
{
  const pos = [], uv = [], idx = [];
  for (let iz = 0; iz <= SEG; iz++) for (let ix = 0; ix <= SEG; ix++){
    pos.push(-HALF + ix * CELL, heights[iz * (SEG + 1) + ix], -HALF + iz * CELL);
    uv.push(ix / SEG, iz / SEG);
  }
  const r = SEG + 1;
  for (let iz = 0; iz < SEG; iz++) for (let ix = 0; ix < SEG; ix++){
    const a = iz * r + ix, b = (iz + 1) * r + ix, c = a + 1, d = b + 1;
    idx.push(a, b, c, b, d, c);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  geo.computeVertexNormals();
  const detail = makeDetailTexture(), village = makeVillageTexture();
  const mat = new THREE.MeshLambertMaterial({ map: makeGroundTexture() });
  mat.onBeforeCompile = sh => {
    sh.uniforms.detailMap = { value: detail };
    sh.uniforms.villageMap = { value: village };
    sh.vertexShader = 'varying vec3 vW;\n' + sh.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>

      sh.fragmentShader.replace('#include <map_fragment>', `
      #include <map_fragment>
      float wv = 1.0 - smoothstep(${VS / 2 - 130}.0, ${VS / 2 - 5}.0, max(abs(vW.x), abs(vW.z)));
      diffuseColor.rgb = mix(diffuseColor.rgb, texture2D(villageMap, (vW.xz + ${VS / 2}.0) / ${VS}.0).rgb, wv);
      float dt1 = texture2D(detailMap, vW.xz / 19.0).r;
      float dt2 = texture2D(detailMap, vW.xz / 210.0 + 0.37).r;
      diffuseColor.rgb *= (0.35 + 1.3 * dt1) * (0.6 + 0.8 * dt2);
      float near = clamp(1.0 - length(vW - cameraPosition) / 70.0, 0.0, 1.0);
      float dt3 = texture2D(detailMap, vW.xz / 2.7).r;
      diffuseColor.rgb *= mix(1.0, 0.55 + 0.9 * dt3, near);
      // furrows / crop rows, one direction per field
      vec2 fu = vec2(vW.x * ${ca.toFixed(6)} + vW.z * ${sa.toFixed(6)}, -vW.x * ${sa.toFixed(6)} + vW.z * ${ca.toFixed(6)});

// ---------------------------------------------------------------- obstacles
const obstacles = new Map();
const OCELL = 40;
const okey = (cx, cz) => cx * 100003 + cz;
function addObstacle(o, R){
  for (let cx = Math.floor((o.x - R) / OCELL); cx <= Math.floor((o.x + R) / OCELL); cx++)
    for (let cz = Math.floor((o.z - R) / OCELL); cz <= Math.floor((o.z + R) / OCELL); cz++){
      const k = okey(cx, cz);
      if (!obstacles.has(k)) obstacles.set(k, []);
      obstacles.get(k).push(o);
    }
  return o;
}
function obstacleAt(x, y, z){
  const list = obstacles.get(okey(Math.floor(x / OCELL), Math.floor(z / OCELL)));
  if (!list) return null;
  for (const o of list){
    if (y > o.top) continue;
    const dx = x - o.x, dz = z - o.z;
    if (o.box){

  // radar cue boxes on Gerans
  let near = null, nd = 1e9;
  for (const g of gerans){
    if (g.state === 'down') continue;
    const d = g.pos.distanceTo(camera.position);
    const [x, y, fr] = toScreen(g.pos);
    if (fr && x > 4 && x < W - 4 && y > 4 && y < H - 4){
      const s = clamp(900 / d, 3, 14);
      oc.beginPath();
      for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]){
        oc.moveTo(x + sx * s, y + sy * s * 0.4); oc.lineTo(x + sx * s, y + sy * s); oc.lineTo(x + sx * s * 0.4, y + sy * s);
      }
      strokeTwice();
      txt(fmtD(d), x, y + s + 6, 'center');
    } else if (d < nd){ nd = d; near = g; }
  }
  // ground targets reported by the recon drone: diamond with distance
  for (const v of vehicles){
    if (!v.alive) continue;
    const d = v.pos.distanceTo(camera.position);
    const [x, y, fr] = toScreen(_p3.copy(v.pos).setY(v.pos.y + 1.5));
    if (!fr || x < 4 || x > W - 4 || y < 36 || y > H - 4) continue;
    oc.beginPath(); oc.moveTo(x, y - 6); oc.lineTo(x + 6, y); oc.lineTo(x, y + 6); oc.lineTo(x - 6, y); oc.closePath();
    strokeTwice();
    txt(fmtD(d), x, y + 12, 'center');
  }
  if (near){
    const l = near.pos.clone().applyMatrix4(camera.matrixWorldInverse);
    let ax = l.x, ay = l.y;
    if (l.z > 0 && Math.abs(ax) + Math.abs(ay) < 1e-3) ay = -1;
    const m = Math.hypot(ax, ay) || 1; ax /= m; ay /= m;
    const cx = W / 2 + ax * 130, cy = H / 2 - ay * 88;
    oc.save(); oc.translate(cx, cy); oc.rotate(Math.atan2(-ay, ax));
    oc.beginPath(); oc.moveTo(7, 0); oc.lineTo(-4, -5); oc.lineTo(-4, 5); oc.closePath(); oc.stroke(); oc.fill();
    oc.restore();
    txt(fmtD(nd), cx, cy + (ay > 0 ? 11 : -11), 'center');
  }

  if (!(killBlink > 0 && blink)) txt('KILL ' + kills, 8, 10);
  txt('LEAK ' + leaks, 8, 21);
  txt('AA ' + aaKills, 8, 32);
  const mm = Math.floor(P.time / 60), ss = Math.floor(P.time % 60);
  txt(mm + ':' + String(ss).padStart(2, '0'), W - 8, 10, 'right');
  const dist = Math.hypot(P.pos.x, P.pos.z);
  const lq = Math.round(clamp(100 - Math.max(0, dist - LINK_START) / 37, 0, 99));
  if (!(lq < 30 && blink)) txt('LQ ' + lq, W - 8, 21, 'right');
  if (vision === 'thermal') txt('WHT', W - 8, 32, 'right');

  const volts = 16.8 - 3.6 * P.used - 0.7 * (P.T / MAXT);
  if (!(volts < 13.6 && blink)) txt(volts.toFixed(1) + 'V', 8, H - 10);
  txt('THR ' + Math.round(P.T / MAXT * 100), 8, H - 21);
  txt(Math.round(P.vel.length() * 3.6) + ' KMH', W - 8, H - 21, 'right');
  txt(Math.round(P.pos.y - groundAt(P.pos.x, P.pos.z)) + ' M', W - 8, H - 10, 'right');
  txt(P.mode, W / 2, H - 10, 'center');
  txt('H ' + fmtD(dist), W / 2 + 40, H - 10, 'left');
  if (!P.armed && blink) txt('DISARMED', W / 2, H / 2 + 26, 'center');
  if (!P.armed) txt('[SPACE]   [P]', W / 2, H / 2 + 38, 'center');
}

function drawEnd(){
  if (endPhase() < 7) return;
  oc.font = 'bold 9px monospace'; oc.textBaseline = 'middle';
  oc.lineWidth = 2.5; oc.strokeStyle = EDGE; oc.fillStyle = INK;
  txt('[TRY AGAIN]', W / 2, H / 2, 'center');
}

// ---------------------------------------------------------------- pause screen: quadcopter schematic
// Betaflight quad X: 1 rear right CW, 2 front right CCW, 3 rear left CCW, 4 front left CW
const MOTORS = [
  { n: 1, x: 122, y: 166, cw: true,  p: 1, r: -1, y_: -1 },
  { n: 2, x: 122, y: 82,  cw: false, p: -1, r: -1, y_: 1 },
  { n: 3, x: 38,  y: 166, cw: false, p: 1, r: 1, y_: 1 },
  { n: 4, x: 38,  y: 82,  cw: true,  p: -1, r: 1, y_: -1 },
];
const propPhase = [0, 0, 0, 0];
let pauseLast = performance.now();
function outlined(draw, w = 1){
  oc.lineWidth = w + 2; oc.strokeStyle = 'rgba(0,0,0,0.8)'; oc.beginPath(); draw(); oc.stroke();
  oc.lineWidth = w; oc.strokeStyle = INK; oc.beginPath(); draw(); oc.stroke();
}
function drawPause(){
  const now = performance.now(), pdt = Math.min(0.05, (now - pauseLast) / 1000); pauseLast = now;
  oc.setTransform(RW / W, 0, 0, RH / H, 0, 0);
  oc.clearRect(0, 0, W, H);
  oc.fillStyle = 'rgba(0,0,0,0.6)'; oc.fillRect(0, 0, W, H);
  oc.font = 'bold 9px monospace'; oc.textBaseline = 'middle'; oc.lineJoin = 'round';
  oc.lineWidth = 2.5; oc.strokeStyle = 'rgba(0,0,0,0.8)'; oc.fillStyle = INK;
  txt('PAUSE', 80, 12, 'center');
  txt('[P] RESUME', W - 8, 12, 'right');

  const thr = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
  const pit = (keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0);
  const rol = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  const yaw = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);

  const cx = 80, cy = 124;
  outlined(() => { for (const m of MOTORS){ oc.moveTo(cx, cy); oc.lineTo(m.x, m.y); } }, 2);
  oc.fillStyle = 'rgba(0,0,0,0.8)'; oc.fillRect(cx - 12, cy - 18, 24, 36);
  outlined(() => oc.rect(cx - 11, cy - 17, 22, 34));
  outlined(() => oc.rect(cx - 5, cy - 17, 10, 7));
  oc.fillStyle = INK;
  txt('CAM', cx, cy - 4, 'center');
  txt('FC', cx, cy + 8, 'center');
  outlined(() => { oc.moveTo(cx, cy - 26); oc.lineTo(cx, cy - 62); oc.moveTo(cx - 5, cy - 56); oc.lineTo(cx, cy - 62); oc.lineTo(cx + 5, cy - 56); });
  txt('FRONT', cx, cy - 70, 'center');

  MOTORS.forEach((m, i) => {
    const mix = clamp(0.5 + 0.3 * thr + 0.18 * (pit * m.p + rol * m.r + yaw * m.y_), 0.05, 1);
    const dir = m.cw ? 1 : -1;
    propPhase[i] += dir * mix * 40 * pdt;
    outlined(() => oc.arc(m.x, m.y, 20, 0, 6.2832));
    const a = propPhase[i];
    outlined(() => { oc.moveTo(m.x + Math.cos(a) * 18, m.y + Math.sin(a) * 18); oc.lineTo(m.x - Math.cos(a) * 18, m.y - Math.sin(a) * 18); }, 2);
    // rotation arrow (canvas y points down, so a growing angle is clockwise seen from above)
    const a0 = m.y < cy ? 3.6 : 0.5, a1 = a0 + 1.3 * dir, r = 25;
    outlined(() => oc.arc(m.x, m.y, r, Math.min(a0, a1), Math.max(a0, a1)));
    const hx = m.x + Math.cos(a1) * r, hy = m.y + Math.sin(a1) * r, tx = -Math.sin(a1) * dir, ty = Math.cos(a1) * dir;
    outlined(() => { oc.moveTo(hx - tx * 4 + ty * 3, hy - ty * 4 - tx * 3); oc.lineTo(hx, hy); oc.lineTo(hx - tx * 4 - ty * 3, hy - ty * 4 + tx * 3); });
    oc.fillStyle = INK; oc.beginPath(); oc.arc(m.x, m.y, 2 + mix * 5, 0, 6.2832); oc.fill();
    const ly = m.y < cy ? m.y - 33 : m.y + 33;
    txt(m.n + (m.cw ? ' CW ' : ' CCW ') + Math.round(mix * 100) + '%', m.x, ly, 'center');
  });
  txt('SPACE ARM   E DETONATE', 8, 218);
  txt('M ACRO/ANGL N THERMAL', 8, 229);

  const x0 = 162; let y = 30;
  const row = (on, a, b) => {
    if (on){ oc.fillStyle = 'rgba(244,242,236,0.25)'; oc.fillRect(x0 - 4, y - 6, W - x0, 23); oc.fillStyle = INK; }
    txt(a, x0, y); txt(b, x0 + 32, y + 11); y += 25;
  };
  txt('HOLD A KEY: MOTOR MIX', x0, y); y += 16;
  row(thr !== 0, 'W S  THR  ALL 4 FASTER', '= CLIMB');
  row(pit !== 0, '↑ ↓  PITCH REAR 1+3 UP', '= NOSE DOWN, FLY FWD');
  row(rol !== 0, '← →  ROLL  LEFT 3+4 UP', '= BANK RIGHT');
  row(yaw !== 0, 'A D  YAW   CCW 2+3 UP', '= TURN RIGHT');
  y += 4;
  txt('THRUST POINTS UP THROUGH', x0, y); y += 11;
  txt('FRAME: TILT + THR = SPEED', x0, y); y += 16;
  txt('ACRO  STICK = SPIN RATE', x0, y); y += 11;
  txt('      LEVEL IT YOURSELF', x0, y); y += 13;
  txt('ANGL  STICK = TILT ANGLE', x0, y); y += 11;
  txt('      AUTO LEVEL', x0, y);
}

// ---------------------------------------------------------------- main loop
const _p0 = new THREE.Vector3(), _rel = new THREE.Vector3(), _dr = new THREE.Vector3();
let noise = 0;
respawn();
setVision('day');

function updateSticks(dt){
  const acro = P.mode === 'ACRO';
  const r = 1 - Math.exp(-dt * (acro ? 7 : 9));
  const tp = (keys.ArrowUp ? 1 : 0) - (keys.ArrowDown ? 1 : 0);
  const tr = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  const ty = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  P.sp += (tp - P.sp) * r; P.sr += (tr - P.sr) * r; P.sy += (ty - P.sy) * r;
  if (acro && P.armed){
    if (keys.KeyW) P.thr = Math.min(1, P.thr + dt * 0.75);
    if (keys.KeyS) P.thr = Math.max(0, P.thr - dt * 0.75);
  }
}

function update(dt){
  clock += dt;
  updateSticks(dt);

  _p0.copy(P.pos);
  if (P.alive){
    const n = Math.ceil(dt / 0.004);
    for (let i = 0; i < n && P.alive; i++) simStep(dt / n);
    if (P.armed) P.time += dt;
  } else if (!ended && clock - P.deadAt > 0.5) respawn();

  updateThreats();
  for (const g of [...gerans]) g.update(dt);
  for (const v of vehicles) v.update(dt);

  // intercept check: closest approach of the relative motion during the frame
  if (P.alive && P.armed){
    for (const g of [...gerans]){
      if (g.state === 'down') continue;
      _rel.copy(g.prev).sub(_p0);
      _dr.copy(g.pos).sub(g.prev).sub(_v.copy(P.pos).sub(_p0));
      const t = clamp(-_rel.dot(_dr) / Math.max(1e-6, _dr.lengthSq()), 0, 1);
      if (_rel.addScaledVector(_dr, t).length() < 3.2){ die('boom'); break; }
    }
  }

  updateGuns(dt);
  updateFx(dt);
  updateBurners(dt);
  updateFlying(dt);
  for (const f of horizonFires){ const s = f.base * (0.8 + 0.25 * Math.sin(clock * 7 + f.ph) + 0.1 * Math.random()); f.f.scale.set(s, s * 0.8, 1); }

  camera.position.copy(P.pos).add(_v.set(0, 0.03, -0.04).applyQuaternion(P.q));
  camera.quaternion.copy(P.q).multiply(UPTILT);
  if (P.alive && P.armed){
    const v = 0.0015 + 0.004 * (P.T / MAXT);
    camera.rotateX((Math.random() - 0.5) * v); camera.rotateY((Math.random() - 0.5) * v);
  }
  camera.updateMatrixWorld();
  sky.position.copy(camera.position);
  sunSprite.position.copy(camera.position).addScaledVector(SUN_DIR, 15000);

  const dist = Math.hypot(P.pos.x, P.pos.z);
  const lowAlt = clamp((dist - 1500) / 3000, 0, 1) * clamp(1 - (P.pos.y - groundAt(P.pos.x, P.pos.z)) / 40, 0, 1);
  noise = clamp(Math.max(0, dist - LINK_START) / 4000 + lowAlt * 0.5, 0, 1);
  flash = Math.max(0, flash - dt * 6);
  if (P.alive) staticAmt = Math.max(0, staticAmt - dt * 4);
  killBlink = Math.max(0, killBlink - dt);
}

function render(){
  post.uniforms.uTime.value = (performance.now() / 1000) % 600;
  post.uniforms.uNoise.value = noise;
  post.uniforms.uStatic.value = P.alive ? staticAmt : 1;
  post.uniforms.uFlash.value = ended ? 0 : flash;
  const black = clamp((endPhase() - 5) / 1.5, 0, 1);
  post.uniforms.uBlack.value = black;

  if (AU.ready){
    const tf = P.T / MAXT, on = P.alive && P.armed && !ended;
    const f = 95 + 620 * Math.sqrt(tf) + P.vel.length() * 0.8;
    for (const { o, mult } of AU.pOsc) setP(o.frequency, f * mult, 0.03);
    setP(AU.pGain.gain, on ? 0.05 + 0.16 * tf : 0, 0.03);
    setP(AU.pLp.frequency, 900 + 3500 * tf);
    setP(AU.wind.gain, P.alive && !ended ? Math.min(0.3, P.vel.length() / 110 * 0.3) : 0);
    setP(AU.hiss.gain, ended ? 0.1 * (1 - black) : P.alive ? noise * 0.04 : 0.07);
  }

  drawOSD();
  if (paused) drawPause();
  osdTex.needsUpdate = true;

  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
}

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) update(dt);
  render();
}
requestAnimationFrame(frame);
if (location.hash === '#dbg') window.__d = { P, gerans, vehicles, houses, central, Geran, Vehicle, ROADS, camera, THREE, stats, setVision, update, render, spawnColumn, destroyHouse, noColumns(){ nextColumn = 1e9; },
  get state(){ return { clock, ended, kills, leaks, aaKills, alive: houses.filter(h => h.village && h.alive).length }; } };
</script>
</body>
