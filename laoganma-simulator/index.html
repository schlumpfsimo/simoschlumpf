class Builder {
  constructor(){ this.p = []; this.n = []; this.c = []; this.frames = []; this.frame = null; }
  push(x, y, z, ry = 0){
    const f = new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, ry, 0)), new THREE.Vector3(1, 1, 1));
    if (this.frame) f.premultiply(this.frame);
    this.frames.push(this.frame); this.frame = f; return this;
  }
  pop(){ this.frame = this.frames.pop(); return this; }
  world(x, y, z){ const v = new THREE.Vector3(x, y, z); if (this.frame) v.applyMatrix4(this.frame); return v; }
  add(geo, x, y, z, sx, sy, sz, ry, col, rx = 0, rz = 0){
    _qq.setFromEuler(_ee.set(rx, ry, rz));
    _m.compose(_p3.set(x, y, z), _qq, _s3.set(sx, sy, sz));
    if (this.frame) _m.premultiply(this.frame);
    _nm.getNormalMatrix(_m);
    const P = geo.attributes.position, N = geo.attributes.normal;
    for (let i = 0; i < P.count; i++){
      _v.fromBufferAttribute(P, i).applyMatrix4(_m); this.p.push(_v.x, _v.y, _v.z);
      _w.fromBufferAttribute(N, i).applyMatrix3(_nm).normalize(); this.n.push(_w.x, _w.y, _w.z);
      this.c.push(col[0], col[1], col[2]);
    }
    return this;
  }
  box(x, y, z, sx, sy, sz, ry, col, rx, rz){ return this.add(G_BOX, x, y, z, sx, sy, sz, ry, col, rx, rz); }
  cyl(x, y, z, r, h, col, ry = 0, rx = 0, rz = 0){ return this.add(G_CYL, x, y, z, r * 2, h, r * 2, ry, col, rx, rz); }
  sph(x, y, z, r, col, sy = 1){ return this.add(G_SPH, x, y, z, r * 2, r * 2 * sy, r * 2, 0, col); }
  build(){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    g.computeBoundingSphere();
    return g;
  }
  mesh(mat){ return new THREE.Mesh(this.build(), mat); }
}

function pyramid(x, z, n, y = 0){

    if (!paused){ P.yaw -= dead(ax[2] || 0) * dt * 2.8; P.pitch = clamp(P.pitch - dead(ax[3] || 0) * dt * 2.2, -1.45, 1.45); }
    const a = bt[0] && bt[0].pressed, st = bt[9] && bt[9].pressed;

  touch.f = touch.move ? clamp(-(touch.move.y - touch.move.y0) / 70, -1, 1) : 0;
  touch.s = touch.move ? clamp((touch.move.x - touch.move.x0) / 70, -1, 1) : 0;
  let fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + input.padF + touch.f;
  let str = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + input.padS + touch.s;
  const len = Math.hypot(fwd, str); if (len > 1){ fwd /= len; str /= len; }
  const sp = (keys.ShiftLeft || keys.ShiftRight || input.padRun) ? 3.4 : 2.1;
  const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw), rx = Math.cos(P.yaw), rz = -Math.sin(P.yaw);
  const vx = (fx * fwd + rx * str) * sp, vz = (fz * fwd + rz * str) * sp;
  P.x += vx * dt; P.z += vz * dt; collide(); collide();
  P.speed = Math.hypot(vx, vz); P.bob += dt * P.speed * 3.4;
  placeCamera();
  // stations
  active = pickStation();
  const held = input.held || keys.KeyE || keys.Space || touch.actId !== null;
  input.held = false;
  if (active && input.act) active.act();
  if (active && active.hold && held && G.wok.has && !G.wok.done){ stirring = true; G.wok.t += dt; if (G.wok.t >= STIR_T) G.wok.done = true; }
  input.act = false;
  if (active) active = pickStation();   // the prompt may have changed with the action
  // cooking timers
  if (G.boil.on){ G.boil.t += dt; if (G.boil.t >= BOIL_T){ G.boil.on = false; G.boil.done = true; } }
  const w = G.wok, tgt = w.has && !w.done ? 1 : w.has ? 0.4 : 0.15; w.flame += (tgt - w.flame) * Math.min(1, dt * 4);
  if (G.pour > 0) G.pour = Math.max(0, G.pour - dt * 1.3);
  if (G.flash > 0) G.flash -= dt * 0.6;
  updateOrders(dt);
}
const boilMat = noodleMat.clone(); boilNoodles.material = boilMat;
function animate(dt){
  clock += dt;
  const f = G.wok.flame;
  flames.forEach((s, i) => {
    const a = i / flames.length * 6.283 + clock * 3;
    s.position.set(-3.1 + Math.cos(a) * 0.13, 0.9 + Math.random() * 0.04 + f * 0.05, KZ + Math.sin(a) * 0.13);
    s.scale.setScalar((0.07 + f * 0.17) * (0.8 + Math.random() * 0.4)); s.visible = f > 0.02;
  });
  wokLight.intensity = 0.25 + f * 0.9 + Math.random() * 0.2 * f;
  wokFood.visible = G.wok.has;
  if (G.wok.has){
    const k = clamp(G.wok.t / STIR_T, 0, 1);
    noodleMat.color.setRGB(lerp(0.9, 0.82, k), lerp(0.82, 0.56, k), lerp(0.52, 0.24, k));
    wokFood.position.y = 1.0 + (stirring ? Math.abs(Math.sin(clock * 14)) * 0.07 : 0);
    wokFood.rotation.y += (stirring ? 3.5 : 0.2) * dt;
    if (Math.random() < dt * (stirring ? 28 : 6)) puff(-3.1, 1.12, KZ, 0.2, stirring ? 0.6 : 0.4, 0.14, stirring ? 0.7 : 0.4);
  }
  wok.rotation.z = stirring ? Math.sin(clock * 14) * 0.05 : 0;
  if (Math.random() < dt * (G.boil.on ? 20 : 5)) puff(-2.1, 1.22, KZ, 0.16, 0.5, 0.13, G.boil.on ? 0.8 : 0.4);
  boilNoodles.position.y = 1.15 + Math.sin(clock * 9) * 0.012;
  neon.material.opacity = 0.9 + Math.sin(clock * 31) * 0.05 - (Math.random() < 0.012 ? 0.5 : 0);
  neonLight.intensity = neon.material.opacity * 0.55;
  if (handItem && G.held === 'final'){ const top = handItem.getObjectByName('top'); if (top){ const s = 1 - G.pour; top.scale.set(s, s * s, s); top.visible = s > 0.02; if (G.pour > 0 && Math.random() < dt * 20) puff(-1.6, 1.3, -2.55, 0.08, 0.3, 0.06, 0.4); } }
  updateSteam(dt);
  if (AU.ctx){
    AU.sizzle.gain.value = paused ? 0 : (0.015 + f * 0.09 + (stirring ? 0.09 : 0)) * (0.7 + Math.random() * 0.3);
    AU.bubble.gain.value = paused ? 0 : (G.boil.on ? 0.13 : 0.04) * (0.5 + Math.random() * 0.5);
  }
}

// ---------------------------------------------------------------- OSD: sharp text on its own canvas, bold monospace like the drone
const INK = '#f6f1e6', EDGE = 'rgba(0,0,0,0.8)';
function txt(s, x, y, align = 'left'){ oc.textAlign = align; oc.strokeText(s, x, y); oc.fillText(s, x, y); }
const HELD_NAME = { nest: 'hNest', cooked: 'hCooked', bowl: 'hBowl', dish: 'hDish', final: 'hFinal' };
function drawOSD(){
  oc.setTransform(DPR, 0, 0, DPR, 0, 0); oc.clearRect(0, 0, VW, VH);
  const u = ui();
  const mono = s => 'bold ' + (u * s).toFixed(1) + 'px ui-monospace, Menlo, Consolas, "Courier New", monospace';
  oc.lineJoin = 'round'; oc.lineWidth = u * 0.28; oc.strokeStyle = EDGE; oc.fillStyle = INK; oc.textBaseline = 'middle';
  if (paused){
    oc.fillStyle = 'rgba(12,4,3,0.55)'; oc.fillRect(0, 0, VW, VH); oc.fillStyle = INK;
    oc.font = 'bold ' + (u * 4.4).toFixed(1) + 'px ' + CJK; txt(S.title, VW / 2, VH * 0.28, 'center');
    oc.font = mono(1.3); txt(say(S.sub), VW / 2, VH * 0.28 + u * 3.8, 'center');
    oc.font = mono(0.85); txt(say(S.job), VW / 2, VH * 0.28 + u * 5.8, 'center');
    if (Math.floor(clock * 2) % 2 === 0){ oc.font = mono(1.15); txt(say(started ? (TOUCH ? S.resumeTouch : S.resume) : (TOUCH ? S.startTouch : S.start)), VW / 2, VH * 0.62, 'center'); }
    oc.font = mono(0.8); txt(say(TOUCH ? S.ctrlTouch : padMode ? S.ctrlPad : S.ctrlKb), VW / 2, VH * 0.62 + u * 2.4, 'center');
    const langs = LANGS.map(l => l === lang ? '[' + l.toUpperCase() + ']' : l.toUpperCase()).join('  ');
    txt((TOUCH ? '' : say(S.langHint) + ' · ') + langs, VW / 2, TOUCH ? VH * 0.92 : VH * 0.62 + u * 4.0, 'center');
    return;
  }
  oc.font = mono(1.0); txt(say(S.served) + ' ' + G.served, u, u * 1.3);
  if (G.held){ oc.font = mono(0.8); txt(say(S.holding) + ': ' + say(S[HELD_NAME[G.held]]), u, u * 2.8); }
  const step = currentStep();
  oc.font = mono(0.8);
  S.steps.forEach((s, i) => { oc.globalAlpha = i === step ? 1 : 0.5; txt((i < step ? '✓ ' : (i + 1) + ' ') + say(s), VW - u, u * 1.3 + i * u * 1.35, 'right'); });
  oc.globalAlpha = 1;
  oc.beginPath(); oc.arc(VW / 2, VH / 2, u * 0.16, 0, 6.3); oc.lineWidth = u * 0.14; oc.stroke(); oc.fill(); oc.lineWidth = u * 0.28;
  if (active){
    oc.font = mono(1.05); txt((TOUCH ? '' : padMode ? '[A] ' : '[E] ') + activeText, VW / 2, VH / 2 + u * 3.2, 'center');
    if (active.hold && G.wok.has && !G.wok.done){
      const w = u * 12, h = u * 0.6, x = VW / 2 - w / 2, y = VH / 2 + u * 4.4;
      oc.fillStyle = 'rgba(0,0,0,0.55)'; oc.fillRect(x, y, w, h); oc.fillStyle = INK; oc.fillRect(x + 2, y + 2, (w - 4) * clamp(G.wok.t / STIR_T, 0, 1), h - 4);
    }
  }
  if (G.flash > 0){ oc.font = 'bold ' + (u * 1.8).toFixed(1) + 'px ' + CJK; oc.globalAlpha = Math.min(1, G.flash * 1.5); txt('老干妈拌面 +1', VW / 2, VH * 0.3, 'center'); oc.globalAlpha = 1; }
  if (TOUCH){
    const b = touchBtn();
    oc.beginPath(); oc.arc(b.x, b.y, b.r, 0, 6.3); oc.fillStyle = active ? 'rgba(246,241,230,0.85)' : 'rgba(246,241,230,0.28)'; oc.fill();
    oc.fillStyle = active ? '#2a0806' : INK; oc.font = mono(1.5); oc.textAlign = 'center'; oc.fillText('E', b.x, b.y); oc.fillStyle = INK;
  }
}

// ---------------------------------------------------------------- loop
fit(); placeCamera(); openOrder();
if (new URLSearchParams(location.search).has('debug')) window.LG = { P, G, begin, pause, setHeld, placeCamera, spots };
function frame(){
  const now = performance.now(), dt = Math.min((now - last) / 1000, 0.05); last = now;
  stirring = false;
  if (!paused) update(dt);
  animate(dt);
  renderer.render(scene, camera);
  drawOSD();
}
renderer.setAnimationLoop(frame);
</script>
