<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Rhein – Fahrbarkeit und Rückhalt</title>
  <meta name="description" content="Wovon die Fahrbarkeit des Rheins bis Kaub abhängt und was ein Rückhalt in den Seen brächte: gemessene Abflüsse, Pegel Kaub, Herkunft des Wassers und Simulation." />
  <link rel="canonical" href="https://www.simoschlumpf.ch/rhin-retention/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preload" href="../karte/plex-500.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../karte/plex-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="rhin.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
  <script src="rhin.js" defer></script>
</head>
<body>
  <main class="blatt">
    <nav class="sprache" id="sprache"></nav>
    <h1 class="name" data-t="titel"></h1>
    <p class="lead kopf" data-t="lead"></p>
    <nav class="inhalt" id="inhalt"></nav>

    <header class="teil" id="teil1">
      <p class="teilnr" data-t="teil1"></p>
      <h2 class="teiltitel" data-t="teil1T"></h2>
      <p class="lead" data-t="teil1L"></p>
    </header>

    <!-- 1 Heute -->
    <section class="kapitel" id="k1">
      <h2 class="frage" data-t="k1Titel"></h2>
      <p class="lead" data-t="k1Lead"></p>
      <div class="wahl" id="wahl"></div>
      <section class="lage" id="lage"></section>
      <div class="scrolly" id="sc1">
        <div class="buehne">
          <figure class="karte"><div id="karte"></div></figure>
          <figure class="grafik netzbild" id="netzfig" hidden><div class="legende" id="netzlegende"></div><svg id="netz" role="img"></svg></figure>
        </div>
        <div class="schritte" id="st1"></div>
      </div>
      <p class="klein" id="kartenlegende"></p>
      <section id="fahrbar"></section>
      <figure class="grafik" id="laengsfig"><div class="legende" id="laengslegende"></div><svg id="laengs" role="img"></svg></figure>
    </section>

    <!-- 2 Die Jahre -->
    <section class="kapitel" id="k2">
      <h2 class="frage" data-t="k2Titel"></h2>
      <p class="lead" data-t="k2Lead"></p>
      <div class="scrolly" id="sc2">
        <div class="buehne frei">
          <figure class="grafik" id="jahrfig"><div class="legende" id="jahrlegende"></div><svg id="jahrkaub" role="img"></svg></figure>
        </div>
        <div class="schritte" id="st2"></div>
      </div>
    </section>

    <header class="teil" id="teil2">
      <p class="teilnr" data-t="teil2"></p>
      <h2 class="teiltitel" data-t="teil2T"></h2>
      <p class="lead" data-t="teil2L"></p>
    </header>

    <!-- 3 Rückhalt -->
    <section class="kapitel" id="k3">
      <h2 class="frage" data-t="k3Titel"></h2>
      <p class="lead" data-t="k3Lead"></p>
      <div class="scrolly" id="sc3">
        <div class="buehne frei">
          <div class="jahrkopf" id="k3kopf"></div>
          <figure class="grafik" id="kettefig" hidden><svg id="kette" role="img"></svg></figure>
          <figure class="grafik" id="szenfig"><div class="legende" id="szenlegende"></div><svg id="szen" role="img"></svg></figure>
        </div>
        <div class="schritte" id="st3"></div>
      </div>
      <div id="jahre"></div>
      <figure class="grafik" id="jahrefig"><svg id="jahregrafik" role="img"></svg></figure>
    </section>

    <!-- 4 Simulator -->
    <section class="kapitel" id="simulator">
      <h2 class="frage" data-t="simTitel"></h2>
      <p class="lead" data-t="simLead"></p>
      <div class="jahrkopf gross" id="simkopf"></div>
      <section class="bedarf" id="bedarf"></section>
      <div class="wahl" id="simjahr"></div>
      <div class="wahl" id="simwahl"></div>
      <p class="hinweis" id="stufentext"></p>
      <div id="simseen"></div>
      <p class="warnung" id="hochwasser"></p>
      <p class="noetig" id="noetig" hidden></p>
      <div class="werte" id="simwerte"></div>
      <figure class="verlauf" id="verlauffig">
        <div class="legende" id="simlegende"></div>
        <div class="rahmen"><svg id="verlauf" role="img"></svg><div class="tip" id="tip" hidden></div></div>
        <svg id="speicher" role="img"></svg>
        <div class="legende" id="abgabelegende"></div>
        <svg id="abgabe" role="img"></svg>
      </figure>
      <figure class="grafik" id="bandfig"><div class="legende" id="bandlegende"></div><svg id="band" role="img"></svg></figure>
      <div id="nutzen"></div>
      <figure class="grafik" id="kapfig"><svg id="kapkurve" role="img"></svg><p class="hinweis" id="kaptext"></p></figure>
      <div id="seetafel"></div>
      <div class="wahl" id="seewahl"></div>
      <figure class="grafik" id="seefig"><div class="legende" id="seelegende"></div><svg id="seegrafik" role="img"></svg><p class="hinweis" id="seetext"></p></figure>
      <p class="klein" data-t="simHinweis"></p>
    </section>

    <header class="teil" id="anhang">
      <p class="teilnr" data-t="anhang"></p>
      <h2 class="teiltitel" data-t="anhangT"></h2>
      <p class="lead" data-t="anhangL"></p>
    </header>

    <!-- 5 Herleitung, 6 Datensatz -->
    <section class="kapitel" id="herleitung">
      <h2 class="frage" data-t="herTitel"></h2>
      <p class="lead" data-t="herLead"></p>
      <div id="hertext"></div>
      <h3 class="unter" data-t="bilTitel"></h3>
      <p class="klein" data-t="bilLead"></p>
      <div class="tafel zwei">
        <section id="herkunft"></section>
        <section id="bilanz"></section>
        <section id="seen"></section>
      </div>
    </section>

    <section class="kapitel" id="daten">
      <h2 class="frage" data-t="datTitel"></h2>
      <p class="lead" data-t="datLead"></p>
      <div id="datuebersicht"></div>
      <div class="wahl" id="datwahl"></div>
      <details id="dattage"><summary></summary><div class="datrahmen" id="dattabelle"></div></details>
    </section>

    <footer class="fuss">
      <h2 id="fehlt" data-t="fehlTitel"></h2>
      <p class="klein" data-t="fehlLead"></p>
      <div class="rollen" id="fehlend"></div>
      <h2 data-t="methode"></h2>
      <div id="methodentext"></div>
      <h2 data-t="quellen"></h2>
      <div id="quellen"></div>
      <p class="klein" id="stand"></p>
      <p class="klein"><a href="/">simoschlumpf.ch</a></p>
    </footer>
  </main>
  <noscript><p style="padding:24px">Diese Seite braucht JavaScript. / Cette page nécessite JavaScript.</p></noscript>
</body>
</html>
